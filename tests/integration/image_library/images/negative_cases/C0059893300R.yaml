  notes: |
    One of the Galileo SSI 'scattered_light' C00598xx quintet.  Instrument:
    Galileo SSI (GOSSI): the frames live under the GO_0xxx volumes and carry
    instrument=gossi.  GO_0003, target MOON, 1990 Earth/Moon flyby, 0.1 s,
    CLEAR filter.
    Stage-A selected this as a scattered_light surrogate (bright body in
    inventory, unresolved on disc) with a real but gentle Moon-glare gradient
    (prescan gradient_score ~7.4, amplitude ~4.5 DN).  The in-pipeline image
    classifier scores the frame 'clean' (noise ~1 DN), so the glare does not
    swamp detection: there is no photometric-path defect.
    A sparse Pleiades pointing whose only genuinely bright catalog star in
    frame is Eta Tau (~V2.8); the next member (23 Tau ~V4.2) and the fainter
    V6-8 remainder sit at or below the glare-elevated detection limit.  The
    pipeline fails closed with reason=all_techniques_spurious.

    VALIDATED NEGATIVE under current capability: this frame stays failed, and
    it is a genuine capability boundary, not a matcher defect.  With the UCAC4
    bright-end correction, Eta Tau (V2.84) is the unambiguous bright anchor,
    but an exhaustive tight-tolerance (<=2 px) offset search over the
    detection list finds NO second catalog star aligned to any detection at
    any rigid offset: exactly one star is confidently detectable at the true
    wide offset.  The wide-offset asterism matcher requires at least three
    tight inliers (a trusted bright anchor plus two corroborating stars) with
    a chance-alignment significance below budget; a single-star wide-offset
    lock is under-determined and a false-lock trap (the brightest detection
    here, 1694 DN, is not uniquely bright -- the runner-up is 1240 DN -- so
    pairing the anchor to it is ambiguous, and the glare field routinely
    raises peaks above a real faint star).  The matcher therefore correctly
    declines to lock.  The residual single-detectable-star wide-offset gap is
    tracked by the pending issue recorded below; this fixture must be
    re-verified when it lands.  The regression assertion is
    expected.status=failed with reason=all_techniques_spurious.
