    Re-ratchet 2026-07-21 (issue #284, UCAC4 bright-end saturation correction). Expected success/high/StarRefineNav -> measured success/medium/StarRefineNav. This frame's two bright stars are Theta-1 and Theta-2 Tau, which UCAC4 catalogues saturated near V6.8 (see the selection's star_vmags [6.83, 6.88, ...]); correcting them against YBSC to their true V3.4/V3.8 also exposes that the UCAC4 and Tycho-2 records of Theta-2 Tau are the same star (their saturated magnitudes had disagreed by more than the dedup threshold), so the double-counted record is dropped. The offset is unchanged and within slack; fused confidence moves from about 0.86 to about 0.83, crossing the recalibrated 0.85 high-tier boundary, because the field carries two independent stars rather than the three the saturated catalog implied. Primary technique (StarRefineNav) and must-run set (StarUniqueMatchNav) are unchanged.

    Ground truth corrected by +0.500 / +0.500 px in (dv, du) for issue #635:
    the star model predicted positions in oops uv while the techniques
    measured them in array indices, so every star-derived offset was short
    by half a pixel on each axis. This ground truth is star-derived -- the
    sidecar above records it as a Star technique's own offset, or records
    that only Star techniques ran -- so it carries that bias in full, and
    the correction is the datum itself rather than the amount this frame's
    current answer happened to move. The operator verification stands: the
    star boxes the overlay drew came from the same biased conversion, and
    half a pixel is below what an overlay resolves, so verification never
    constrained this value either way.
