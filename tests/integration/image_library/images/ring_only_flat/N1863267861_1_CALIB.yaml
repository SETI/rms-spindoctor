  notes: |
    ring_only_flat exemplar from cohort-curation review batch 005
    (seq 028; Stage A metadata scan seed 20260708).
    Selection: Keeler gap / A ring outer edge closeup, flattest edge
    apparent curvature radius 34701 px (straight across the FOV), ring
    opening -1.98 deg, no body in FOV; CL1+IR3, year 2017.
    Rank-1 scene: only the offset component along the edge normal is
    operator-verified (vote y, 2026-07-13, along the then-recorded
    normal; per the batch instructions the
    along-edge component carries no alignment judgment). The (dv, du) pair
    is the ensemble's representative point on the constraint line.
    normal_angle_deg comes from aggregate_edge_normal_angle_deg on the
    frame's three straight RING_EDGE features (Keeler-A Ring OE IER/OER,
    Keeler IEG), taken from the straight edge's own line: 50.69 deg
    (re-pinned 2026-10-27; see below).
    Pipeline at review and at sidecar time: status=success,
    confidence=0.952, rank=high, status_reason=rank_1_only; RingEdgeNav
    raw fit (-48.1864, 9.4187) projected to -27.4128 px along the normal
    recorded at the time (45.0 deg), identical to the voted representative
    point.
    The ring radial orbit-uncertainty channel adds each consumed edge's own
    catalog orbit-solution rms to the reported covariance as a
    fully-correlated radial term. Measured per-edge contributions on this
    frame (LM-weight shares, local radial scale ~0.34 km/px):
      Keeler gap IEG      weight 87.5%, rms 3.62 km -> 10.66 px, contributes 9.33 px
      Keeler-A OE IER     weight 12.1%, rms 1.01 km ->  2.97 px, contributes 0.36 px
      Keeler-A OE OER     weight  0.4%, rms 10.18 km -> 31.16 px, contributes 0.11 px
    Effective 9.80 px; fused sigma 6.93 px/axis, far above the medium tier's
    2 px cap. The dominant contributor is the Keeler GAP inner edge, not the
    higher-rms Keeler-A OE outer edge: the latter carries almost no LM
    weight. The RingEdgeNav fit is the one recorded above; its projection onto
    the pinned normal is given in the 2026-10-27 paragraph below; the
    reported confidence is 0.706.
    CONTESTED, not settled: this prices catalog rms as a fully-correlated
    whole-edge displacement, but rms is an orbit-fit residual that mixes a
    coherent radius error with longitude-varying resonant wander which does
    not displace an edge coherently (the same A-ring outer edge measures
    10.18 km unfitted and 1.78 km with nine m-modes fitted -- 5.7x). The
    severity here is therefore an upper bound, plausibly several-fold
    over-severe, and this operator-verified frame is priced low on an
    unvalidated correlation model. A mode-aware decomposition, which would
    price only the m=0 part coherently, is the principled fix and is not
    implemented.
    Re-pinned 2026-10-27 (operator decision): the rank-1 constraint was
    re-expressed along the straight edge's own normal, 50.69 deg /
    -23.2398 px. The old value, 45.0 deg / -27.4128 px, used the rings
    model's quantized per-vertex normal, which RingEdgeNav no longer
    uses for a straight edge's rank-1 axis. The raw fit voted on is
    unchanged: (-48.1864, 9.4187) projects to -23.2393 px along the new
    normal, and (dv, du) is the foot of the new constraint line (along *
    (cos, sin) of the angle). The original vote was cast on an overlay
    rendered at the old representative point, 4.0 px across the edge
    from the new constraint line, so a fresh operator look at the raw
    fit is still welcome.
