  notes: |
    ring_only_flat exemplar from cohort-curation review batch 005
    (seq 032; Stage A metadata scan seed 20260708).
    Selection: Keeler gap / A ring outer edge closeup, flattest edge
    apparent curvature radius 147936 px (straight across the FOV), ring
    opening -13.76 deg, no body in FOV; CL1+UV3, year 2017.
    Rank-1 scene: only the offset component along the edge normal is
    operator-verified (vote y, 2026-07-13, along the then-recorded
    normal; per the batch instructions the
    along-edge component carries no alignment judgment). The (dv, du) pair
    is the ensemble's representative point on the constraint line.
    normal_angle_deg comes from aggregate_edge_normal_angle_deg on the
    frame's two straight RING_EDGE features (Keeler-A Ring OE IER, Keeler
    IEG), taken from the straight edge's own line: 68.77 deg
    (re-pinned 2026-10-27; see below).
    The 22 catalog stars in the FOV are all smear-skipped or gated, so no
    star technique contributes.
    Pipeline at review and at sidecar time: status=success,
    confidence=0.952, rank=high, status_reason=rank_1_only; RingEdgeNav
    raw fit (-39.4646, 1.5777) projected to 1.5777 px along the normal
    recorded at the time (90.0 deg), identical to the voted representative
    point.
    The ring radial orbit-uncertainty channel prices each consumed edge's
    own catalog orbit-solution rms as a fully-correlated radial
    displacement.  This frame fuses the Keeler-A Ring OE IER (rms 1.006 km)
    and the Keeler IEG (rms 3.620 km) at a local radial scale near 0.34
    km/px, giving an LM-weight-weighted effective sigma of 5.387 px along
    the edge normal (the fit is rank-1, so the term lands entirely on the
    observable normal axis); the fused sigma 5.39 px exceeds the medium
    tier's 2 px cap.  The RingEdgeNav fit is the one
    recorded above; its projection onto the pinned normal is given in the
    2026-10-27 paragraph below; only the reported uncertainty differs.
    CONTESTED, not settled: catalog rms is an orbit-fit residual that mixes
    a coherent radius error with longitude-varying resonant wander, which
    does not displace an edge coherently (the A-ring outer edge measures
    10.18 km fitted without m-modes and 1.78 km with nine).  The severity
    applied here is an upper bound and is plausibly several-fold over-severe
    on exactly these shepherded Keeler edges; a mode-aware decomposition
    pricing only the m=0 part is the principled fix and is not
    implemented.  Five operator-verified ring_only_flat frames are priced
    low under this assumption.
    Re-pinned 2026-10-27 (operator decision): the rank-1 constraint was
    re-expressed along the straight edge's own normal, 68.77 deg /
    -12.8190 px. The old value, 90.0 deg / 1.5777 px, used the rings
    model's quantized per-vertex normal, which RingEdgeNav no longer
    uses for a straight edge's rank-1 axis. The raw fit voted on is
    unchanged: (-39.4646, 1.5777) projects to -12.8200 px along the new
    normal, and (dv, du) is the foot of the new constraint line (along *
    (cos, sin) of the angle). The original vote was cast on an overlay
    rendered at the old representative point, 14.3 px across the edge
    from the new constraint line, so a fresh operator look at the raw
    fit is still welcome.
