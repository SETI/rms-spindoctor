  notes: |
    negative_cases curation for issue #238 (Galileo SSI 'scattered_light'
    C00598xx quintet).  Instrument: Galileo SSI (GOSSI).  The tracking issue
    labelled the quintet 'Voyager ISS', but the frames live under the GO_0xxx
    volumes and carry instrument=gossi, so they are Galileo SSI; the label is
    imprecise.  GO_0003, target MOON, 1990 Earth/Moon flyby, 0.1 s, CLEAR filter.
    Stage-A selected this as a scattered_light surrogate (bright body in
    inventory, unresolved on disc) with a real but gentle Moon-glare gradient
    (prescan gradient_score ~7.4, amplitude ~4.5 DN).  The in-pipeline image
    classifier scores the frame 'clean' (noise ~1 DN), so the glare does not
    swamp detection: there is no photometric-path defect.
    First triage (2026-07-14) recorded the frame as unnavigable: the field is a
    sparse Pleiades pointing whose only genuinely bright catalog stars are two
    members (Eta Tau ~V2.8, 23 Tau ~V4.2); the remaining ~18 predicted stars are
    V 6-8, at or below the glare-elevated detection limit.  The star-field
    pattern matcher detected 30 sources (noise and cosmic-ray hits included) but
    recovered only 4 inliers against its strong-tier floor of 6, so the pipeline
    failed closed with reason=all_techniques_spurious.  The ground-truth offset
    was a placeholder (0, 0) pending #285 (sparse-field star nav) and #284 (UCAC4
    bright-end photometry).

    Re-ratchet 2026-07-21 (issue #285, wide-offset asterism matching; depends on
    #284).  This frame now NAVIGATES.  With the UCAC4 bright-end correction in
    place, Eta Tau (V2.84) is the field's unambiguous bright anchor.  The new
    wide-offset asterism fallback in StarFieldFromCatalogNav seeds a translation
    from a handful of trusted bright-anchor pairings and locks on three inliers
    (Eta Tau plus two fainter members) at offset (dv, du) ~= (115.2, 228.7) px,
    residual RMS ~1.2 px, with a chance-alignment false-lock expectation ~3.4e-5
    (budget 1e-2) -- decisively better than chance because the trial count is a
    handful of bright-anchor seeds, not the triplet RANSAC's thousands.  The
    independent pass-2 StarRefineNav converges to (114.8, 229.3) px, within ~0.5
    px, corroborating the lock.  The recorded ground-truth offset is the fused
    ensemble offset from this measured, self-corroborated lock (not an operator
    overlay); offset_uncertainty_px reflects the fit and inter-technique
    agreement.  The wide-offset lock is confidence-capped (0.6), so the fused
    result lands in the medium tier.  The residual single-detectable-star quintet
    frames stay failed (see C0059893300R); their capability gap is tracked
    separately.

    Ground truth corrected by +0.500 / +0.500 px in (dv, du) for issue #635:
    the star model predicted positions in oops uv while the techniques
    measured them in array indices, so every star-derived offset was short
    by half a pixel on each axis. This ground truth is star-derived -- the
    sidecar above records it as a Star technique's own offset, or records
    that only Star techniques ran -- so it carries that bias in full, and
    the correction is the datum itself rather than the amount this frame's
    current answer happened to move. The operator verification stands: the
    star boxes the overlay drew came from the same biased conversion, and
    half a pixel is below what an overlay resolves, so verification never
    constrained this value either way.
