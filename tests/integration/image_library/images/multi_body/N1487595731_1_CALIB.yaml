  notes: |
    Dione and Rhea both visible and overlapping. Phase angle ~90 deg.

    The geometry is a hazard for BodyTerminatorNav. Its coarse
    normalized cross-correlation runs over a combined edge mask built
    from both bodies' concatenated terminator polylines, and on a
    high-phase multi-body crescent that surface has an incorrect global
    maximum tens of pixels away in U. Levenberg-Marquardt then converges
    near the wrong seed and the technique reports sub-pixel RMS with a
    high inlier fraction on the wrong answer, so it is confidently wrong
    rather than merely wrong.

    The expected pins follow the seed-20260718 recalibration (attribution basis util/calibration/CAMPAIGN_20260718.md). BodyTerminatorNav emits no result on this frame, so the agreeing BodyDiscCorrelateNav + BodyLimbNav pair carries the fuse to the operator offset at medium tier.

