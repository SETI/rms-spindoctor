sweep_name: range_body_size
# Body size shrinking from well-resolved to unnavigable.  Each value is the
# sphere's semi-axis (its radius) in pixels, so the body is twice that across.
# The primary technique transitions BodyLimbNav -> BodyDiscCorrelateNav ->
# BodyBlobNav as the disc and limb lose resolution.  The smallest body, 4 px
# across, is below the 5 px BODY_BLOB emission floor and is meant to fail.  It
# currently navigates by disc correlation instead, on a PSR computed from about
# five background cells, which is too few to mean anything; the test that
# expects the failure is marked as an expected failure until the PSR requires a
# minimum background size.  This is the technique ladder the range regime
# exercises.
base_scene: phase_sweep_regular_body/regular_sphere_base.yaml
parameters: [bodies.0.semi_a_px, bodies.0.semi_b_px, bodies.0.semi_c_px]
values: [65.0, 45.0, 30.0, 20.0, 10.0, 6.0, 3.0, 2.0]
