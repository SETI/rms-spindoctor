schema_version: 2
scene_name: lock_single_dense
instrument: coiss_nac
size_v: 200
size_u: 200
random_seed: 7
exposure_sec: 1.0
# One-star lock at a confounder density near the breakdown region.  The single
# navigable star (vmag 3.0) is embedded in a dense background-sky field: the
# sky_counts law is raised to a = -0.5 so the field reaches comparable
# brightness, and density_factor 100 crowds it.  At this density the one-star
# path still recovers the planted offset for this seed -- but the field is close
# enough to the cliff that a modest density increase (or a different seed's
# realization) tips it into a spurious/failed result, never a confident wrong
# offset.  This scene is also the base geometry of the confounder-density
# breakdown sweep (sim_sweeps/star_confounder_density.yaml), which walks
# density_factor across the transition and drives the seed-ensemble population.
optics:
  psf:
    match_navigator: true
bodies: []
stars:
  - {name: N1, v: 100.5, u: 110.5, vmag: 3.0}
sky_counts:
  a: -0.5
  b: 0.34
  density_factor: 100.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
