schema_version: 2
scene_name: saturated_star
instrument: coiss_nac
size_v: 200
size_u: 200
random_seed: 7
exposure_sec: 1.0
# A navigable star bright enough to clip, testing saturation handling directly.
# Five clean stars plus one very bright star (F5, vmag -1.0) whose core drives
# the coiss_nac well past full scale; instrument_defaults switches on the
# physical signal chain, so the bright core clips and blooms.  The clipped core
# biases F5's centroid, and the six-star similarity fit carries that bias into
# the recovered offset -- yet the navigation still succeeds at the high tier and
# recovers the planted offset inside a tolerance that absorbs the bias.
# Measured recovered-vs-planted error at this geometry and seed: ~0.67 px
# under the cohort-tuned coiss_nac PSF kernel (dominated by the clipped-core
# centroid shift on F5); the test tolerance is 1.0 px.
artifacts:
  instrument_defaults: true
bodies: []
stars:
  - {name: F1, v: 55.5, u: 70.5, vmag: 3.0}
  - {name: F2, v: 145.5, u: 130.5, vmag: 3.2}
  - {name: F3, v: 70.5, u: 150.5, vmag: 3.4}
  - {name: F4, v: 150.5, u: 60.5, vmag: 3.1}
  - {name: F5, v: 100.5, u: 100.5, vmag: -1.0}
  - {name: F6, v: 60.5, u: 120.5, vmag: 3.0}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: high
