# The Maxwell gap and ringlet in the C ring at 2 km/px, lit, near the ansa,
# with the ringlet drawn eccentric while the navigator's orbit for it is
# circular: a hidden eccentricity.
#
# The radii, all from config_310_saturn_rings.yaml: the Maxwell gap from
# 87,342.77 to 87,610.12 km, and the Maxwell ringlet from 87,480.29 to
# 87,539.36 km.  The catalog gives the ringlet's inner edge ae = 18.93 km
# and its outer edge ae = 58.02 km.  One ringlet orbit carries one
# eccentricity here, so the drawn ringlet takes their mean, 38.475 km
# (19.2375 px), through orbit_error, with its pericenter 75 deg from the
# node.  Along the ringlet's arc in the frame (longitudes -2.9 to +2.7
# deg) that draws it 4.04 to 5.86 px inward of the navigator's circular
# orbit, 4.95 px on average.  The gap's outer edge has ae = 1.11 km in the
# catalog (0.6 px); the gap is drawn circular, as the navigator knows it.
# The rest of the C ring is a uniform sheet at tau 0.1.  The navigator is
# given no orbit error bars, as for a catalog that takes its orbits to be
# exact.  The catalog's ringlet also has m = 2 and 4 terms; the schema can
# withhold only the mode-1 ellipse (#910).
#
# The frame spans 86,496 to 88,817 km and holds three more cataloged
# structures, all circular in the catalog:
# - the outer edge of a plateau at 88,592.74 km (feature_28_oer), which
#   crosses a 566 px arc.  The catalog has no inner edge for it, so the
#   scene draws a ramp that rises over 150 km to tau 0.3 above the sheet
#   and ends in a sharp step at the cataloged radius.  Only that step is
#   known to the navigator.  The ramp's width and depth are illustrative.
# - the Bond gap, 88,686.01 to 88,723.04 km, and the Bond ringlet inside
#   it, 88,701.89 to 88,719.24 km (tau 0.3, illustrative), whose edges
#   cross 179 to 261 px arcs in the frame's corner.  They are drawn but not
#   known to the navigator.  The ringlet's outer edge sits 1.9 px inside
#   the gap's outer edge.  With both navigable, the frame with the ringlet
#   drawn circular and the twist removed lands 0.66 px off at 12 sigma
#   instead of 0.08 px, a separate failure (#1152) that would mix with the
#   hidden eccentricity this scene holds.
#
# Geometry: B = +14 deg to the observer and +20 deg to the Sun (the lit
# face), phase 40 deg, frame longitudes -3.3 to +3.0 deg, so the edges are
# curved arcs.  The planted twist, +0.0115 deg, is the NAC's measured
# twist, with roll fitting off as the camera ships.
#
# Measured outcome (2026-11-23): success at high tier, 6.80 px from the
# planted offset with a reported sigma of 0.047 to 0.060 px: 130 sigma.
# The error is 4.99 px across the edges, matching the ringlet's displacement,
# so the fit followed the ringlet and gave up the gap's correct edges, and
# 4.62 px along them.  RingAnnulusNav is 7.0 to 9.4 px off and flagged on
# 12 of the 16 draws, so it carries no band.  With the ringlet drawn
# circular the committed draw is 0.581 px off (0.084 px with the twist
# removed too), so the hidden eccentricity carries the error, and the
# reported sigma does not cover it (#1144).  With only the twist removed it
# is 6.50 px off at 153 sigma.  The measurement covers the committed seed
# and random_seed 101, 202, ..., 1515: 16 distinct draws.  noise_seed 101
# to 808 repeats random_seed 101 to 808 exactly, because the random seed
# draws only the detector noise here.  The error is 6.782 to 6.819 px and
# 128.8 to 132.8 sigma, at high tier on every draw.  The band puts each end
# max(0.05 px, a fifth of the spread) outside the measured range: [6.732,
# 6.870] px.
expected:
  status: success
  confidence_tier: high
  known_offset_error_px: 6.801
  known_offset_error_tol_px: 0.069
