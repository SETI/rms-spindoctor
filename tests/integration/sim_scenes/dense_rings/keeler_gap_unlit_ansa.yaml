schema_version: 2
scene_name: keeler_gap_unlit_ansa
instrument: coiss_nac
size_v: 1024
size_u: 1024
random_seed: 23
exposure_sec: 3.8
# The Keeler gap at real scale on the unlit face, near the ansa, with the
# measured radial profile of the A ring beside it and only the gap's two
# cataloged edges known to the navigator.
#
# Where the profile comes from.  Library frame N1863267861 (COISS_2110,
# 2017-01-16, NAC, CL1+IR3, 3.8 s, gain 29 e-/DN) navigated: its
# operator-verified pointing, (dv, du) = (-14.7228, -17.9813) px from the
# image library's ground truth, was applied before reading the ring radius
# of every pixel.  That verification is along the edge normal, which is the
# direction a radial profile depends on.  The profile is the median CALIB
# I/F in 1 km bins of ring radius, 136,283 to 136,736 km: 453 bins, each a
# non-navigable ringlet 2.959 px wide.  Each bin's tau sits on the low-tau
# side of the unlit single-scattering law for this geometry, scaled so the
# brightest bin is at 98% of that law's peak, so the drawn brightness
# follows the measured I/F.  These tau values are therefore not the ring's
# optical depths.  On the frame, the gap's inner edge falls within 1 km of
# its cataloged radius and the outer edge rises about 3 km inside it.
#
# The cataloged edges, from config_310_saturn_rings.yaml.  The gap's inner
# edge is keeler_gap, 136,484.91 km and circular, and the gap carries that
# orbit.  Its outer edge is the inner edge of Keeler-A Ring OE, 136,522.087
# km with ae = 0.99 km and its pericenter frozen at 322.44 deg.  The gap's
# width, 36.39 km, puts the outer edge on that catalog orbit in the middle
# of its arc in the frame (longitude -0.10 deg), at 136,521.30 km; along
# the arc it then sits within 0.004 km (0.01 px) of its catalog radius.
# The navigable gap clears the profile between its edges, and the
# navigator is given the same orbit and width the scene draws.
#
# The geometry is the frame's own: 0.338 km/px radially, B = -12.83 deg to
# the observer and +26.67 deg to the Sun (the unlit face), phase 82.1 deg.
# The real frame looks near the sub-observer meridian, where the edges are
# straight; this scene moves the view to the ansa (ring longitudes -0.5 to
# +0.3 deg from the node).  There the edges curve with a radius of about
# 19,900 px, bending about 6.6 px across the frame, so the edge fit is
# two-dimensional rather than rank-1.  An albedo of 0.95 at the frame's
# exposure puts most of the ring at 525 to 735 DN against the raw frame's 555 to
# 818 DN.  The planted twist, +0.0115 deg, is the NAC's measured twist,
# with roll fitting off as the camera ships.
#
# Measured outcome (2026-11-23): RingEdgeNav answers 3.39 px from the
# planted offset, almost all of it along the edge, with a reported sigma of
# 0.034 to 0.13 px: 28 sigma.  This is the along-edge error on nearly
# straight edges at sub-pixel sigma (#755).  The along-edge answer is weakly
# determined, so the twist does not simply slide it: with the twist
# removed the committed draw is 2.37 px off along the edge (25 sigma), and
# a twist of -0.01 deg moves it to 4.37 px off on the other side.  With one
# uniform sheet in place of the measured profile the committed draw is
# 1.38 px off with the twist and 1.37 px without, so the profile beside
# the edges carries most of the error.  The measurement covers the
# committed seed and random_seed 101, 202, ..., 1515: 16 distinct draws.
# noise_seed 101 to 808 repeats random_seed 101 to 808 exactly, because the
# random seed draws only the detector noise here.  The error is 3.243 to
# 3.469 px and 27.2 to 29.9 sigma.  The confidence runs 0.84 to 0.90 across
# the high tier's 0.85 floor, so the tier is medium on 15 draws and high on
# 1 and is not asserted.  The band puts each end max(0.05 px, a fifth of
# the spread) outside the measured range: [3.193, 3.519] px.
