schema_version: 2
scene_name: planted_offset_star_field_bright
instrument: coiss_nac
size_v: 128
size_u: 128
random_seed: 7
exposure_sec: 1.0
# A bright-star counterpart to ``planted_offset_star_field`` (same geometry, same
# planted offset), used to exercise the *high-SNR* regime of the star field.  The
# stars here are vmag 0.0-0.8 -> roughly 1000-2000 DN net peak, well above the
# ~4095 DN full well but far brighter than the dim field.  Above the PSF-refine
# integrated-SNR crossover the brightness-weighted moment centroid is the lower-
# error estimator, so this scene confirms the technique keeps the moment (rather
# than the PSF fit, whose sub-pixel-phase bias floor would dominate here) and
# still recovers the planted offset to a few hundredths of a pixel.
# Stars deposit as point masses; an explicit navigator-matched PSF gives them a
# finite (floor-form) profile instead of a 1-pixel spike.
optics:
  psf:
    match_navigator: true
bodies: []
stars:
  - {name: B1, v: 30.5, u: 40.5, vmag: 0.0}
  - {name: B2, v: 80.5, u: 35.5, vmag: 0.6}
  - {name: B3, v: 55.5, u: 90.5, vmag: 0.3}
  - {name: B4, v: 95.5, u: 95.5, vmag: 0.8}
  - {name: B5, v: 40.5, u: 100.5, vmag: 0.7}
  - {name: B6, v: 100.5, u: 50.5, vmag: 0.5}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
