schema_version: 2
scene_name: planted_offset_shapemismatch
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 42
exposure_sec: 1.0
# B7 scenario 2: mesh vs ellipsoid, same pose.  The frame renders an irregular
# (lumpy) mesh body, but the navigator predicts a smooth body at the same pose,
# axes, and center -- the only difference is shape.  mesh_lumpiness 0.1 is a
# 1.25% RMS non-ellipsoidal relief (lumpiness / 8 of the radius).  The prediction is realized
# through the body's nav_override mapping: the renderer draws the true geometry
# (mesh_lumpiness 0.1) while NavModelBodySimulated predicts mesh_lumpiness 0.0,
# the zero-relief (ellipsoidal) limit of the same mesh.  Realizing the
# ellipsoidal prediction as the smooth limit of the mesh keeps both silhouettes
# on one renderer with a consistent axis/pose convention, so the residual is pure
# shape mismatch rather than a renderer-convention skew.
#
# The point is that the body still navigates despite the shape mismatch: the disc
# correlation aligns the two filled silhouettes and the full ensemble recovers
# the planted offset to under a pixel (0.67 px).  The companion irregularity sweep
# (sim_sweeps/irregularity_shape_mismatch.yaml) walks mesh_lumpiness up from this
# base.
#
# mesh_seed is chosen by a rule fixed before any navigation: among mesh seeds 0
# to 12 (the population test_sim_sweeps navigates), the seed whose silhouette at
# the sweep's extreme lumpiness, 0.7, at this pose and these axes, has the median
# mismatch with the predicted smooth silhouette (symmetric-difference area over
# the predicted perimeter: 3.8 to 7.9 px over the 13 seeds, 5.5 px for seed 4).
# That is seed 4, a typical shape rather than one picked for its navigation
# outcome.  tests/integration/sim_mesh_seed_rule.py applies the rule, and
# test_sim_mesh_seed_rule fails if a relief or renderer change moves the median.
# The 64 x 128 tessellation keeps flat-shaded facets out of the frame
# and out of the prediction alike.
bodies:
  - name: HYPERION
    shape_model: polyhedral_mesh
    mesh_lumpiness: 0.1
    mesh_seed: 4
    mesh_n_lat: 64
    mesh_n_lon: 128
    pose_euler_deg: [10.0, 35.0, 0.0]
    center_v: 110.0
    center_u: 110.0
    axis1: 150.0
    axis2: 110.0
    axis3: 95.0
    illumination_angle: 25.0
    phase_angle: 30.0
    nav_override:
      mesh_lumpiness: 0.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
