schema_version: 2
scene_name: planted_offset_disc_if
instrument: coiss_calib_nac
size_v: 220
size_u: 220
random_seed: 7
exposure_sec: 1.0
# The disc-correlation invariant on an I/F-calibrated instrument (coiss_calib_nac)
# rather than a raw-DN one.  The calibrated_if render path runs the full DN
# detector chain and then inverts the calibration transform, so the frame carries
# propagated shot and read noise in I/F units.  The navigation techniques key on
# scale-invariant quantities (normalized cross-correlation, a MAD-relative noise
# threshold), so the disc recovers the planted offset the same way it does on a
# raw-DN frame -- demonstrating navigation is unit-agnostic.
bodies:
  - name: RHEA
    center_v: 110.0
    center_u: 110.0
    axis1: 90.0
    axis2: 90.0
    axis3: 90.0
    illumination_angle: 25.0
    phase_angle: 30.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
# Propagated shot + read noise, carried through the calibration inverse into I/F.
noise:
  poisson: true
  read_noise_dn: 4.0
