schema_version: 2
scene_name: planted_offset_ring
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 7
exposure_sec: 1.0
# A centered, face-on (B = 90) ring_system ringlet whose inner and outer
# edges are well-curved circular arcs.  The navigable feature's catalog
# orbit reaches the navigator through nav_params; the simulated ring model
# emits one RING_EDGE per edge -- a per-vertex polyline with outward radial
# normals -- which RingEdgeNav fits against the image-edge distance
# transform.  Two curved arcs constrain the offset in both axes, so the
# planted offset is recovered.  tau = 2 renders the band at ~0.16 of full
# scale through the single-scattering photometry (the closed-form
# saturation limit for the default albedo is ~0.166), far above the 4 DN
# read noise.  Recovery is asserted on the RingEdgeNav per-technique
# result; the fused ensemble outcome is pinned by the scene baseline.
bodies: []
ring_system:
  geometry:
    center_v: 110.0
    center_u: 110.0
    opening_deg_obs: 90.0
    opening_deg_sun: 90.0
    node_deg: 0.0
  features:
    - name: SATURN
      kind: ringlet
      tau: 2.0
      width: 25.0
      navigable: true
      orbit: {a: 60.0, ae: 0.0, long_peri: 0.0, rate_peri: 0.0}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
