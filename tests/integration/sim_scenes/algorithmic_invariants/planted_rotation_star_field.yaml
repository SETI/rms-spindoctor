schema_version: 2
scene_name: planted_rotation_star_field
instrument: coiss_nac
size_v: 200
size_u: 200
random_seed: 7
exposure_sec: 1.0
# A clean multi-star field with a planted camera ROLL.  ``fit_camera_rotation``
# asks the navigator to solve for a roll on top of the instrument's optics --
# decoupling rotation fitting from the camera the scene emulates, so the scene
# keeps Cassini NAC's sharp PSF (precise centroids) while exercising the 3-DoF
# path.  The renderer rotates each star about the boresight by
# ``planted_rotation_deg`` then translates by the planted offset; the simulated
# stars NavModel predicts the unrotated geometry, so StarFieldFromCatalogNav's
# similarity (rotation + translation) fit recovers the planted roll.  The roll is
# kept small (1.5 deg) so the outer stars stay within the matcher's inlier
# tolerance; larger rolls displace them past it and drop the inlier count.
fit_camera_rotation: true
# Stars deposit as point masses; an explicit navigator-matched PSF gives them a
# finite (floor-form) profile instead of a 1-pixel spike.
optics:
  psf:
    match_navigator: true
bodies: []
stars:
  - {name: F1, v: 55.5, u: 70.5, vmag: 3.0}
  - {name: F2, v: 145.5, u: 130.5, vmag: 3.0}
  - {name: F3, v: 70.5, u: 145.5, vmag: 3.0}
  - {name: F4, v: 130.5, u: 55.5, vmag: 3.0}
  - {name: F5, v: 50.5, u: 110.5, vmag: 3.0}
  - {name: F6, v: 150.5, u: 90.5, vmag: 3.0}
  - {name: F7, v: 112.5, u: 152.5, vmag: 3.0}
  - {name: F8, v: 88.5, u: 48.5, vmag: 3.0}
  - {name: F9, v: 155.5, u: 140.5, vmag: 3.0}
  - {name: F10, v: 45.5, u: 60.5, vmag: 3.0}
  - {name: F11, v: 140.5, u: 115.5, vmag: 3.0}
  - {name: F12, v: 60.5, u: 85.5, vmag: 3.0}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 1.37
# Known error: the fused translation is (5.00, -4.09) px, 4.98 px from the
# planted (1.43, -0.61).  The roll is fitted about the corner of the extended
# field of view, but the renderer turns the stars about the frame center (#434).
# Over 16 noise seeds (the committed one and 101, 202, ..., 1515) the error runs
# 4.980 to 4.988 px, a spread of 0.007 px.  Each end of the band sits a margin
# of max(0.05 px, a fifth of the spread) outside, giving [4.930, 5.038] px.  A
# fix to the rotation center drops the error out of the band, and the scene
# fails until the pin is retired.  test_sim_algorithmic_invariants checks the
# recovered roll itself.
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 4.984
  known_offset_error_tol_px: 0.054
