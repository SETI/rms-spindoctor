# A calibrated Cassini WAC star field at full frame, modeled on the library
# frame W1580760393 (CL1+CL2, 26 s).  Thirty-six catalog stars, V 7.4 to 9.5,
# drawn uniformly over the frame with the count rising 0.45 dex per magnitude:
# the brightest stars of a 12 square degree field, the part of it a catalog
# would offer the navigator.  The long exposure collects about 670 cosmic rays
# over the frame.  instrument_defaults turns on the CALIB chain: shot, read,
# and readout-dark noise, the calibration residual, cosmic rays, the calibrated
# hot-pixel population, and the fitted PSF and distortion residual.
#
# Real WAC pointing errors stay within about 12 px on each axis, and the
# camera's search window is 13 px, so the planted offset is 12 px.  The roll is
# the camera's measured twist, -0.0115 deg, planted with roll fitting off as
# the camera ships.
