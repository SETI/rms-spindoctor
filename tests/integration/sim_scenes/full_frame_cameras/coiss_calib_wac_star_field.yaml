# A calibrated Cassini WAC star field at full frame, modeled on the library
# frame W1580760393 (CL1+CL2, 26 s).  Ninety-five catalog stars, V 7.4 to 10.4,
# as many as the navigator refines on that frame, drawn uniformly over the
# frame with the count rising 0.45 dex per magnitude.  On a calibrated
# simulated frame the navigator predicts every listed star (#899), so the list
# sets the count.  The long exposure collects about 670 cosmic rays over the
# frame.
# instrument_defaults turns on the CALIB chain: shot, read, and readout-dark
# noise, the calibration residual, cosmic rays, the calibrated hot-pixel
# population, and the fitted PSF and distortion residual.
#
# Real WAC pointing errors reach about 12.4 px on one axis (#785).  The planted
# offset, 9.4 px up and 7.7 px right (12.1 px in all), stays below 12 px on
# each axis, where the star techniques' margin test leaves it alone: an answer
# within 1 px of the 13 px WAC search limit on either axis has its confidence
# zeroed (#785).  coiss_calib_wac_star_field_large_offset plants the real
# per-axis extent and fails for that reason.  The roll is the camera's
# measured twist, -0.0115 deg, planted with roll fitting off as the camera
# ships.
