# gossi_star_field at 0.1 s, the exposure of the real Pleiades frames
# C0059894800R and C0059899900R, which navigate by locking on three stars.
# Here the navigator predicts only the V 2.8 star visible and the frame fails
# all_techniques_spurious (#TBD).  Two things leave it short of the real
# frames.  The simulated Galileo stars are about 12 times fainter than real
# ones of the same magnitude: the real frames' V 6.3 to 7.3 stars, two of
# which the real lock uses, hold 4e7 to 7e7 electrons per second at V 0,
# against the simulator's 4.0e6, so the scene's V 5.7 to 8.0 stars lie at or
# below the sky noise.  And on a simulated frame the navigator's star limit
# divides that zero point over the 3.0 px placeholder star blur (#342), which
# gives V 3.2 at 0.1 s, where the real frames' limit is V 7.8.  With the blur
# at the published 0.8 px the navigator predicts four stars and still finds no
# match.  The real frames ran at gain 10K (39 electrons per DN) and the scene
# at the catalog's 187; at the higher gain it fails the same way.
#
# On 3 of 25 draws (random_seed 505 and 1313, noise_seed 505) the single-star
# technique returns an unflagged answer 130 to 221 px off at zero confidence,
# and the frame fails final_confidence_below_threshold instead.  The committed
# draw fails as the block declares, so a fix fails this scene until the block
# is retired.
