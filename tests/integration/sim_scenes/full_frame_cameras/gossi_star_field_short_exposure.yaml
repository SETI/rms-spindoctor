# gossi_star_field at 0.1 s, the exposure of the real Pleiades frames
# C0059894800R and C0059899900R, which navigate by locking on three stars.
# The simulated Galileo stars are about 12 times fainter than real ones of the
# same magnitude: the real frames' V 6.3 to 7.3 stars, two of which the real
# lock uses, hold 4e7 to 7e7 electrons per second at V 0, against the
# simulator's 4.0e6, so the scene's V 5.7 to 8.0 stars lie at or below the sky
# noise.  On a simulated frame the navigator's star limit divides that zero
# point over the navigator's star blur, now the measured 0.65 px (#342), so it
# predicts six stars visible and the frame navigates on three of them.  At the
# earlier 3.0 px placeholder blur the navigator predicted only the V 2.8 star and
# the frame failed all_techniques_spurious (#1153).
