# gossi_star_field at 0.1 s, the exposure of the real Pleiades frames
# C0059894800R and C0059899900R, which navigate by locking on three stars.
# The simulator's Galileo star zero point is measured on real frames, 2.3e8
# electrons per second at V 0 (#1153).  At the catalog's gain of 187 e-/DN the
# V 2.8 and V 4.2 stars saturate, and the V 7.3 stars peak about 20 times the
# sky noise.  The navigator's copy of the zero point for simulated frames
# matches the simulator's, and its star width is the measured 0.65 px, so it
# predicts stars to V 10.9, matches 11 of them, and lands 0.03 to 0.04 px off
# over 24 draws, at high confidence on 23 and medium on one (0.04 px on the
# committed draw without the roll).
#
# The scene keeps the camera's zero point, which follows the 1992 Pleiades
# frames.  The 1990 frames it is modeled on (GO_0002 and GO_0003) read about
# 1.3 mag fainter than the 1992 frames (#1211), so the scene checks the
# short-exposure path rather than twinning those frames.
