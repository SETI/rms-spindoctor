# A Voyager 2 wide angle GEOMED star field, modeled on C1204825 (VGISS_8210,
# Scorpius, CLEAR, 0.48 s), a frame of the twist measurement's cohort.  The
# stars are that frame's catalog stars, V 2.3 to 6.5, at the positions the
# navigator predicts for them at the frame's recorded pointing, over the frame
# and 400 px around it, the camera's search margin.  The real frame navigates
# on a few bright stars: the star-field fit finds only 2 of 6 predicted stars
# and returns spurious, and the two-star match and the refinement carry the
# answer (fused confidence 0.83).  Its brightest star, V 2.6, peaks 44 raw DN
# above the sky (I/F 0.27), and the simulated one 26 DN.  The real star holds
# 360 DN in a 6 px aperture, 0.6 mag more than the camera's star zero point
# gives a V 2.6 star (200 DN), and the camera's kernel, fitted to real stars,
# puts 45% of a star's light in its wing (see the instrument catalog).  The sky_counts field adds the faint stars
# no catalog lists.  instrument_defaults turns on the camera's vidicon chain:
# the line and pixel read noise, the banding, and the PSF and distortion
# residual.
#
# The planted offset, 35.2 px up and right, lies inside the 28 to 49 px of the
# image library's Voyager frames.  The roll is the camera's measured mean
# twist, +0.358 deg (4.42 px at the corner), planted with roll fitting off as
# the camera ships.  The 14 locked frames of the twist measurement give 0.30 to
# 0.39 deg.  A translation cannot undo a roll, so the answer lands where the
# turned stars it measures moved.  The stars in the frame lie 11 to 512 px from
# the boresight, the frame center after the offset, and the roll moves them
# 0.07 to 3.2 px; their mean position moves 1.6 px.
#
# The fused answer lands 1.02 to 1.39 px off over 24 distinct draws, at medium
# tier (confidence 0.70 to 0.80), within 1.8 of its reported sigmas.  The
# refinement carries it on 6 stars.  The two-star match lands 0.03 to 1.61 px
# off, and the star-field fit, locking on 3 stars by its wide-offset lock,
# 0.16 to 0.62 px off.  Without the roll the committed draw lands 0.17 px off,
# against 1.34 px with it.  That is the error the tolerance holds; a lost
# twist still passes the tolerance and fails the baseline.
