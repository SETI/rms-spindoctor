schema_version: 2
scene_name: gossi_star_field
instrument: gossi
size_v: 800
size_u: 800
random_seed: 7
exposure_sec: 1.6
# A Galileo SSI star field at full frame and a pointing error of 257 px, the
# size of the library's scattered-light frames C0059894800R and C0059899900R
# (257 and 286 px).  Like those Pleiades frames, the field holds two bright
# stars, V 2.8 and 4.2, among fourteen of V 5.7 to 8.0.  The stars sit across
# the camera's 350 px search window, and the offset brings a different part of
# it into view.  The brightest star saturates and blooms.
#
# The real frames ran 0.1 s and lock on three stars.  At 0.1 s this field
# fails: the navigator predicts only the V 2.8 star visible
# (gossi_star_field_short_exposure, #1153).  At 1.6 s it predicts four, enough
# for the star-field technique's wide-offset lock, the path the real frames
# take, so this scene runs at 1.6 s.
#
# instrument_defaults turns on the camera's whole chain.  The scene plants the
# measured Galileo sky noise, 0.96 DN, in place of the catalog's read noise,
# because simulated Galileo skies are about four times quieter than real ones
# (#979: 0.96 DN against 0.22 DN on 8 frames each).
#
# The roll is the camera's measured twist, -0.0526 deg (0.5 px at the corner),
# planted with roll fitting off as the camera ships.  The roll turns the scene
# about the frame center before the offset moves it, so it moves the two bright
# stars in view by 0.22 and 0.50 px, and the answer lands 0.26 to 0.28 px off
# over 16 seeds.
artifacts:
  instrument_defaults: true
noise:
  read_noise_dn: 0.96
sky_counts: {}
bodies: []
stars:
