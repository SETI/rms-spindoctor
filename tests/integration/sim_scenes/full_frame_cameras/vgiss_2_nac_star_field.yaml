# A Voyager 2 narrow angle GEOMED star field, the library frame C1205021
# (VGISS_8210, the Pleiades, CLEAR, 0.48 s).  The stars are that frame's
# catalog stars, V 3.7 to 7.7, at the positions the navigator predicts for
# them at the frame's recorded pointing, over the frame and 400 px around it,
# the camera's search margin.  On the real frame the star-field fit locks on 7
# of 11 predicted stars at confidence 0.94.  The sky_counts field adds the faint
# stars no catalog lists.  instrument_defaults turns on the camera's vidicon
# chain: the line and pixel read noise, the banding, and the PSF and
# distortion residual.
#
# Simulated Voyager stars are much fainter than real ones of the same
# magnitude on this camera.  The brightest star in the frame, V 3.9, peaks at
# I/F 0.07, where on the real frame it peaks near I/F 3; the four Voyager
# cameras share one placeholder star zero point (#806, #907).
#
# The planted offset, 48.6 px, is the size of the real frame's offset (48.7 px)
# turned to point mostly along -u.  The roll is the camera's measured mean
# twist, +0.030 deg (0.37 px at the corner), planted with roll fitting off as
# the camera ships.  The twist varies from frame to frame by 0.28 px at the
# corner, and the mean lies inside that spread.
#
# The fused answer lands 0.02 to 0.54 px off over 24 distinct draws, at medium
# tier (confidence 0.74 to 0.83).  The refinement carries it on the 5 stars it
# finds.  The star-field fit locks on 3 of 13 predicted stars by its
# wide-offset lock at confidence 0.6, and flags its answer spurious on 5
# draws.  Without the roll the committed draw lands 0.24 px off, against
# 0.20 px with it.
