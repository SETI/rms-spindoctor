schema_version: 2
scene_name: coiss_calib_nac_disc
instrument: coiss_calib_nac
size_v: 1024
size_u: 1024
random_seed: 7
exposure_sec: 0.18
# A calibrated Cassini NAC frame of a mid-sized icy moon, 280 px across, at a
# phase of 35 deg, the kind of frame most of the image library's NAC body
# frames are.  The body is as bright as Dione in N1481737141, at 34 deg phase
# through RED+GRN: normal_albedo, 0.498, is that disc's median I/F over the
# lunar-Lambert law's value, counting the pixels where the Sun and the camera
# are both within about 73 deg of overhead, as the realism match measures it.
# Through CL1+GRN for 0.18 s the brightest pixel at the sunlit limb fills 40% of
# the full well, and no pixel of the real disc reads full scale in its raw
# product.  instrument_defaults turns on the CALIB
# chain: shot, read, and readout-dark noise, the calibration residual, cosmic
# rays, the calibrated hot-pixel population, and the fitted PSF and distortion
# residual.
#
# The planted offset, 57 px, is near the largest operator-verified NAC offset
# (60 px), inside the camera's 50 by 140 px search window.  The roll is the
# camera's measured twist, +0.0115 deg, planted with roll fitting off as the
# camera ships.
artifacts:
  instrument_defaults: true
detector:
  filter: CL1+GRN
bodies:
  - name: DIONE
    center_v: 470.0
    center_u: 560.0
    semi_a_px: 140.0
    semi_b_px: 140.0
    semi_c_px: 140.0
    illumination_angle: 120.0
    phase_angle: 35.0
    normal_albedo: 0.498
offset_v: -31.27
offset_u: -47.62
offset_rotation_deg: 0.0115
expected:
  status: success
  # The body shades with the default lunar-Lambert law, and the navigator's
  # Lambert template pulls the answer toward the Sun (#1110).  The band holds the
  # fused error over the seeds, measured as sim_truth.py describes.
  known_offset_error_px: 0.2285
  known_offset_error_tol_px: 0.0535
