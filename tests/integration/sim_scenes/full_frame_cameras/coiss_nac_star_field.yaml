random_seed: 7
exposure_sec: 2.0
# A raw Cassini NAC star field at full frame.  Eighteen catalog stars, V 8.7 to
# 11.4, drawn uniformly over the frame with the count rising 0.45 dex per
# magnitude, as for a field near the galactic plane.  The exposure and the
# magnitudes follow the library frame N1530185128 (2.0 s, stars V 9.2 to 11.3,
# 17 detectable).  The sky_counts field adds the faint stars no catalog lists.
# instrument_defaults turns on the camera's whole raw chain: shot, read, and
# readout-dark noise, hot pixels, cosmic rays, banding, bias structure, bloom,
# and the fitted PSF and distortion residual.
#
# N1530185128 was taken through CL1+IR3, and the scene sets no filter, so its
# stars render at the camera's clear-filter brightness.  Through CL1+IR3 the
# simulator dims each star by the filter's throughput for sunlight, 22 times
# (3.4 mag).  The frame then fails at 2 s, and at 10 s it navigates only with
# hot pixels and cosmic rays off, where the real frame navigates at medium
# tier at 2 s (#895).  The real frame's V 9.9 and 10.2 stars hold 2.3e7 to
# 2.5e7 electrons per second at V 0 through CL1+IR3, about 50 times the
# simulator's value for that filter and about twice its clear-filter value,
# 1.0e7, so the clear filter keeps the stars closer to the real frame's.
#
# The planted offset, 39.5 px, lies above the 90th percentile of the
# operator-verified NAC offsets in the image library (median 15.9 px, 90th
# percentile 33.9 px, largest 60.3 px), inside the camera's 50 by 140 px search
# window.  The roll is the camera's measured twist, +0.0115 deg (0.15 px at the
# corner), planted with roll fitting off as the camera ships.
