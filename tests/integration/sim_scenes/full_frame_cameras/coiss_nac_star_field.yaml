# The star-field technique returns spurious on every draw, with 1 inlier where it
# needs 6 (#1146).  It matches the catalog against the 30 brightest sources it
# detects, and the raw frame's hot pixels and cosmic rays crowd the stars out of
# that list: with either one off it still fails, and with both off it finds the
# offset to 0.05 px.  The simulated hot pixels are overstrong (#906), so the
# failure with hot pixels alone is partly the simulator's; the failure with cosmic
# rays alone confirms #1146 as a navigator fault.  The single-star and refinement
# techniques carry the answer, 0.03 to 0.30 px off over 16 seeds.
