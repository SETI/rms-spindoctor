schema_version: 2
scene_name: gossi_disc
instrument: gossi
size_v: 800
size_u: 800
random_seed: 7
exposure_sec: 0.1
# A Galileo SSI frame of a moon 240 px across, at a phase of 40 deg, with a
# pointing error of 286 px, the larger of the library's two Galileo
# scattered-light offsets, in a different direction.  The search window is
# 350 px.  normal_albedo, 0.922, makes the disc as bright as Europa in
# C0413742778R (27 deg phase, GREEN, 46 ms, ICT): the brightest 1% of the disc
# reads 156 DN above the sky on both frames.  Neither disc reaches the 255 DN top
# of the 8-bit range apart from one pixel of the scene's; the brightest disc pixel
# reads 236 DN here and 177 DN on the real frame.  The middle third of the disc
# reads 120 DN above the sky, and the real one 105 DN, because the real Europa
# brightens toward its limb more than the lunar-Lambert law does.
#
# instrument_defaults turns on the camera's whole chain.  The scene plants the
# measured Galileo sky noise, 0.96 DN, in place of the catalog's read noise,
# because simulated Galileo skies are about four times quieter than real ones
# (#979).
#
# The roll is the camera's measured twist, -0.0526 deg, planted with roll
# fitting off as the camera ships.
artifacts:
  instrument_defaults: true
noise:
  read_noise_dn: 0.96
bodies:
  - name: EUROPA
    center_v: 330.0
    center_u: 470.0
    semi_a_px: 120.0
    semi_b_px: 120.0
    semi_c_px: 120.0
    illumination_angle: 250.0
    phase_angle: 40.0
    normal_albedo: 0.922
offset_v: 163.27
offset_u: -234.81
offset_rotation_deg: -0.0526
expected:
  status: success
  # The body shades with the default lunar-Lambert law, and the navigator's
  # Lambert template pulls the answer toward the Sun (#1110).  The band holds the
  # fused error over the seeds, measured as sim_truth.py describes.
  known_offset_error_px: 0.305
  known_offset_error_tol_px: 0.056
