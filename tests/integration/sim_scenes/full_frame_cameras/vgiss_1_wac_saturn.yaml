# The disc correlation flags its answer spurious on all 24 distinct draws: its
# peak lands 25.9 to 26.5 px off, with a peak quality of 3.4 against the
# threshold of 6, and the coarse and fine passes disagree by 26 px (#TBD).
# The rings, which the navigator does not model, lower the peak: on the
# committed draw without them the planet gives a quality of 8.2 and the disc
# correlation lands 0.20 px off, and with the rings laid along u it lands
# 0.22 px off at a quality of 3.7, still below the threshold.  On the real
# frame C3446143,
# rings and all, the disc correlation reaches a quality of 7.2 and carries the
# answer.  The limb fit carries the frame alone, 0.40 to 1.05 px off over the
# 24 draws, at low tier with a 2.5 px sigma; on one draw (random_seed 909) it
# is flagged spurious too and the blob carries the frame, 0.86 px off.  The
# block holds the low tier, so a fix that keeps the disc answer fails here
# until the block is retired.
expected:
  status: success
  confidence_tier: low
