schema_version: 2
scene_name: vgiss_1_wac_saturn
instrument: vgiss_1_wac
size_v: 1000
size_u: 1000
random_seed: 7
exposure_sec: 7.68
# A Voyager 1 wide angle GEOMED frame of Saturn on approach, modeled on the
# library frames C3446143 and C3448723 (VGISS_6108, CH4_JS, 7.68 s).  The
# planet is 100 px across at a range of 21.7 million km (1,196 km/px), seen
# at a phase of 13 deg, with its C, B, and A rings at their real radii and the
# real ring openings: 8.6 deg to the spacecraft and 3.6 deg to the Sun.  The
# real frames navigate on the planet's disc and limb.  Their navigator models
# the rings only as an annulus, which it flags spurious, and fits no ring edge,
# so the scene marks no ring navigable.  The rings are drawn and the navigator
# does not model them.  The ring plane and the planet's equator lie about
# 59 deg from the frame's u axis, as in C3446143.  instrument_defaults turns on
# the camera's vidicon chain: the line and pixel read noise, the banding, and
# the PSF and distortion residual.
#
# A Voyager frame renders in I/F, and the simulator's vidicon DN scale has no
# exposure term (#907), so the exposure does not change the planet.  The disc
# peaks near I/F 1.0, where the real one peaks near I/F 0.37: a body takes no
# albedo key (#895).  The simulated rings read I/F 0.08 to 0.10, a tenth of the
# disc, where the real rings read 0.1 to 0.2, a third to a half of it.
#
# The planted offset, 31.7 px down and left, matches the library frames' 28.8
# and 33.4 px, which point up and left.  The roll, +0.0227 deg, is 0.28 px at
# the corner, the frame-to-frame twist scatter measured on both Voyager 2
# cameras.  No Voyager 1 twist is measured, since no Voyager 1 star frame
# locks, and the two cameras of one spacecraft share their rotation, so the
# scene plants the size of the frame-varying twist and both Voyager 1 scenes
# plant the same value.  Roll fitting is off, as the camera ships.
artifacts:
  instrument_defaults: true
