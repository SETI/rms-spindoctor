# nhlorri_star_field at 1 s instead of 5 s.  The brightest star, V 10.5, peaks
# about 175 times the sky noise at the simulator's measured zero point, 7.0e8
# electrons per second at V 0 (#1213), but the navigator predicts every star too
# faint to detect and draws no star features, so navigation fails.  Two values
# of the navigator's own LORRI block set its star limit on a simulated frame:
# its copy of the zero point, star_flux_dn_per_s_vmag0, holds the earlier value
# over the gain (3.33e6 DN/s against the simulator's 3.33e7), and its star blur,
# star_psf_sigma, is a 3.0 px placeholder against a published core near 1 px
# (#342), which spreads each predicted star over about nine times the pixels.
# With the copy at 3.33e7 DN/s the committed draw navigates 0.54 px off at high
# confidence on 7 stars, with the blur left at 3.0 px; with the blur at 1.0 px
# and the earlier copy the navigator emits 7 star features.  The
# expected block holds the failure, so a fix to either value fails this scene
# until the block is retired.
