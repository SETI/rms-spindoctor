schema_version: 2
scene_name: disc_subpixel_offset
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 7
exposure_sec: 1.0
# Regression scene for the gradient-magnitude NCC sub-pixel bias surfaced by the
# disc offset sweep.  Both axes are planted at a whole-pixel offset, where the
# bias is largest (it recurs at every integer offset and vanishes at the
# half-pixel).  The gradient-magnitude sub-pixel refinement biased it by ~0.3 px
# per axis.  Guarding it here exercises the fix in the normal suite without running
# the full offset sweep.  The body shades with the default Lommel-Seeliger law, and
# the navigator's Lambert template pulls the answer 0.53 px toward the Sun (#1110),
# which the expected block and sim_truth hold to bands; on a Lambert surface it
# landed within 0.01 px.
bodies:
  - name: RHEA
    center_v: 110.0
    center_u: 110.0
    semi_a_px: 45.0
    semi_b_px: 45.0
    semi_c_px: 45.0
    illumination_angle: 25.0
    phase_angle: 30.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 3.0
offset_u: 2.0
offset_rotation_deg: 0.0
expected:
  status: success
  # The body shades with the default Lommel-Seeliger law, and the navigator's
  # Lambert template pulls the answer toward the Sun (#1110).  The band holds the
  # fused error over the seeds, measured as sim_truth.py describes.
  known_offset_error_px: 0.5275
  known_offset_error_tol_px: 0.0505
