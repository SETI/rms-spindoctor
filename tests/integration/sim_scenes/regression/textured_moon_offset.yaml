schema_version: 2
scene_name: textured_moon_offset
instrument: coiss_nac
size_v: 256
size_u: 256
random_seed: 23
exposure_sec: 1.0
# An icy moon with a multiplicative albedo texture: band-limited noise
# (rms 0.25, correlation 12 px on the disc) plus a dark and a bright
# circular albedo spot.  The texture is truth-side, so the disc correlation
# sees realistic surface contrast against its smooth Lambert template while
# the silhouette the limb fit uses is untouched.  The body is as bright as Dione
# in N1481737141, at 34 deg phase: normal_albedo, 0.455, is that disc's median I/F
# over the Lommel-Seeliger law's value, counting the pixels where the Sun and the
# camera are both within about 73 deg of overhead, as the realism match measures
# it.  The brightest pixel fills 54% of the full well, and no pixel of the real
# disc reads full scale in its raw product.  Measured behavior: still
# an accurate success, 0.16 to 0.17 px from the planted value.  The texture pulls
# the correlation peak, which is the realistic-contrast degradation this scene
# measures, and the Lambert template's pull toward the Sun on the default
# Lommel-Seeliger surface (#1110) partly offsets it: on a Lambert surface the fused
# answer landed 0.36 to 0.37 px off.
bodies:
  - name: DAPPLED
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 128.0
    semi_a_px: 70.0
    semi_b_px: 70.0
    semi_c_px: 70.0
    illumination_angle: 20.0
    phase_angle: 35.0
    normal_albedo: 0.498
    albedo_texture:
      rms: 0.25
      corr_px: 12.0
      spots:
        - lat_deg: 40.0
          lon_deg: 30.0
          radius_deg: 12.0
          albedo_factor: 0.55
        - lat_deg: 10.0
          lon_deg: 300.0
          radius_deg: 9.0
          albedo_factor: 1.4
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: -2.2
offset_u: 1.7
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
