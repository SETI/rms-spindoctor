schema_version: 2
scene_name: star_zero_offset
instrument: coiss_nac
size_v: 200
size_u: 200
random_seed: 7
exposure_sec: 1.0
# Regression scene for the star reliability-gate defect: the star model used to
# check the saturation / cosmic-ray mask at each star's PREDICTED position and
# zero its reliability if flagged.  A sharp star peak is itself flagged by the
# cosmic-ray detector, so at a near-zero offset (prediction on the star) every
# star was gated and the star techniques had nothing to navigate.  With a zero
# planted offset the prediction coincides exactly with each star; the star field
# must still recover it.  Magnitudes are distinct here so the detection is
# unambiguous; the equal-magnitude sibling scene star_equal_brightness exercises
# the geometric triplet canonicalisation that keeps the match deterministic when
# the magnitudes tie.
# Stars deposit as point masses; an explicit navigator-matched PSF gives them a
# finite (floor-form) profile instead of a 1-pixel spike.
optics:
  psf:
    match_navigator: true
bodies: []
stars:
  - {name: S1, v: 40.5, u: 50.5, vmag: 3.0}
  - {name: S2, v: 160.5, u: 150.5, vmag: 3.1}
  - {name: S3, v: 70.5, u: 165.5, vmag: 3.2}
  - {name: S4, v: 150.5, u: 55.5, vmag: 3.3}
  - {name: S5, v: 50.5, u: 120.5, vmag: 3.4}
  - {name: S6, v: 150.5, u: 100.5, vmag: 3.5}
  - {name: S7, v: 112.5, u: 172.5, vmag: 3.6}
  - {name: S8, v: 88.5, u: 38.5, vmag: 3.7}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 0.0
offset_u: 0.0
offset_rotation_deg: 0.0
