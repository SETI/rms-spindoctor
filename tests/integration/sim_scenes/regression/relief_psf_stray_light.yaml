schema_version: 2
scene_name: relief_psf_stray_light
instrument: coiss_nac
size_v: 256
size_u: 256
random_seed: 31
exposure_sec: 1.0
# A lit body with limb relief under a whole-scene PSF and an off-center
# radial stray-light bump.  The explicit PSF activates oversample 4, so
# this is the catalog's pin on the topographic renderer's
# split-resolution path (detector-grid shading upsampled under the
# oversampled relief silhouette), the defaulted PSF kernel size at
# oversample, and the stray-light center_v/center_u scaling onto the
# oversampled grid.  A change to that mapping moves the rendered image;
# it does not necessarily move the recorded result, which is what this
# baseline pins -- a half-pixel shift of the bump leaves the fused
# offset where it was.  All of relief, PSF, and stray light are truth-side: the
# navigator fits its smooth sharp Lambert template against the blurred
# ragged limb and the relief's slope shading over a sloped background.
# Measured behavior: all three body techniques survive the blur and the
# sloped background, but the fused offset is (1.57, -1.5) against the
# planted (2.37, -1.62), a miss of 0.81 px, nearly all in v.  The limb fit
# lands at (2.18, -1.71), about 0.2 px from the planted value.  The disc
# correlation reports (1.57, -1.5).  Its sub-pixel refinement searches only
# +-0.5 px around the integer NCC peak (#791), and its smooth template doesn't
# carry the relief shading the frame does.  The
# ensemble fuses the limb fit and the correlation as one witness and takes
# the correlation's offset, so the scene pins a medium-confidence success
# whose error is the correlation's.
# Known error: over 16 noise seeds (the committed one and 101, 202, ...,
# 1515) the fused error runs 0.655 to 3.252 px, because which window edge
# the correlation stops at depends on the noise draw (#791).  Each end of the
# band sits a margin of max(0.05 px, a fifth of the 2.597 px spread) outside,
# giving [0.135, 3.772] px.  A worse miss fails, and so does a fix that brings
# the error under 0.135 px.
bodies:
  - name: RUGGED
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 128.0
    axis1: 140.0
    axis2: 140.0
    axis3: 140.0
    illumination_angle: 20.0
    phase_angle: 35.0
    limb_relief_rms: 0.02
    limb_relief_corr_deg: 12.0
optics:
  psf:
    sigma_v: 0.7
    sigma_u: 0.7
  stray_light:
    amplitude: 0.35
    model: radial
    center_v: 40.0
    center_u: 210.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 2.37
offset_u: -1.62
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 1.9535
  known_offset_error_tol_px: 1.8185
