schema_version: 2
scene_name: relief_psf_stray_light
instrument: coiss_nac
size_v: 256
size_u: 256
random_seed: 31
exposure_sec: 1.0
# A lit body with limb relief under a whole-scene PSF and an off-center
# radial stray-light bump.  The explicit PSF activates oversample 4, so
# this is the catalog's pin on the topographic renderer's
# split-resolution path (detector-grid shading upsampled under the
# oversampled relief silhouette), the defaulted PSF kernel size at
# oversample, and the stray-light center_v/center_u scaling onto the
# oversampled grid.  A change to that mapping moves the rendered image;
# it does not necessarily move the recorded result, which is what this
# baseline pins -- a half-pixel shift of the bump leaves the fused
# offset where it was.  All of relief, PSF, and stray light are truth-side: the
# navigator fits its smooth sharp Lambert template against the blurred
# ragged limb over a sloped background.  Measured behavior: all three
# body techniques survive the blur and the sloped background, but the
# fused offset is (3.5, -0.5) against the planted (2.5, -1.5), a miss
# of 1.4 px.  The limb fit lands at (2.65, -1.24), about 0.3 px from the
# planted value.  The disc correlation reports (3.5, -0.5), and its two
# axes miss for different reasons.  Its sub-pixel refinement searches
# only +-0.5 px around the integer NCC peak, which sits at (4, -1), and
# returns that window's corner.  Searched over +-3 px, the cross-power
# maximum the refinement climbs toward lies at (2.5, -0.44).  So in v
# the window causes the whole 1 px miss: the maximum is on the planted
# 2.5.  In u the maximum itself is biased, 1.06 px from the planted
# -1.5, and a wider window would still miss by that much.  The surface
# is flat: about 0.2% separates the window center from the maximum.
# Both defects are tracked as #791.  The ensemble fuses the limb fit and the correlation as one witness and
# takes the correlation's offset, so the scene pins a medium-confidence
# success whose error is the correlation's.  The baseline is a tripwire
# on that outcome; it makes no accuracy claim.
bodies:
  - name: RUGGED
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 128.0
    axis1: 140.0
    axis2: 140.0
    axis3: 140.0
    illumination_angle: 20.0
    phase_angle: 35.0
    limb_relief_rms: 0.02
    limb_relief_corr_deg: 12.0
optics:
  psf:
    sigma_v: 0.7
    sigma_u: 0.7
  stray_light:
    amplitude: 0.35
    model: radial
    center_v: 40.0
    center_u: 210.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 2.5
offset_u: -1.5
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
