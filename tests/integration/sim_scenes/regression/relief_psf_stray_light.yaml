schema_version: 2
scene_name: relief_psf_stray_light
instrument: coiss_nac
size_v: 256
size_u: 256
random_seed: 31
exposure_sec: 1.0
# A lit body with limb relief under a whole-scene PSF and an off-center
# radial stray-light bump.  The explicit PSF activates oversample 4, so
# this is the catalog's pin on the ellipsoid renderer's oversampled
# relief body (working-grid shading with the relief tilt interpolated
# from the detector grid), the defaulted PSF kernel size at
# oversample, and the stray-light center_v/center_u scaling onto the
# oversampled grid.  A change to that mapping moves the rendered image;
# it does not necessarily move the recorded result, which is what this
# baseline pins -- a half-pixel shift of the bump leaves the fused
# offset where it was.  All of relief, PSF, and stray light are truth-side: the
# navigator fits its smooth sharp Lambert template against the blurred
# ragged limb and the relief's slope shading over a sloped background.
# Measured behavior: all three body techniques survive the blur and the
# sloped background, but the fused offset is (1.32, -1.34) against the
# planted (2.37, -1.62), a miss of 1.09 px, mostly in v, toward the Sun.  The
# limb fit lands 0.94 to 0.95 px from the planted value over the 16 noise draws
# below.  The body shades with the default Lommel-Seeliger law, and the
# navigator's Lambert template pulls both answers toward the Sun (#1110); on a
# Lambert surface the limb fit landed 0.66 to 0.70 px off.  Each pixel reads the
# terrain where its line of sight meets the relief (#875), which sets the shading
# near the limb that both the limb fit and the correlation follow.  The disc
# correlation lands 1.09 px off.  Its high-pass refinement does not stop at a
# window edge: the surface's own maximum lies 1.09 px off, because the smooth
# Lambert template carries neither the relief shading the frame does (#1050) nor
# the Lommel-Seeliger limb.  The ensemble fuses the limb fit and the correlation as one
# witness and takes the correlation's offset, so the scene pins a
# medium-confidence success whose error is the correlation's.
# Known error: over 16 draws of the detector noise alone (the committed draw
# and noise_seed 101, 202, ..., 1515), which keep this scene's limb relief,
# the fused error runs 1.085 to 1.087 px (spread 0.002 px).  Each end of the
# band sits a margin of max(0.05 px, a fifth of the spread) = 0.05 px outside,
# giving [1.035, 1.138] px.  A worse miss fails, and so does a fix that brings
# the error under 1.035 px.  The relief decides the error: over 16 values of
# random_seed (the committed one and 101 to 1515), which redraw the relief too, it
# runs 0.57 to 2.43 px, every draw a success, because where the high-pass maximum
# lies depends on the relief drawn (#1050).
bodies:
  - name: RUGGED
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 128.0
    semi_a_px: 70.0
    semi_b_px: 70.0
    semi_c_px: 70.0
    illumination_angle: 20.0
    phase_angle: 35.0
    limb_relief_rms: 0.02
    limb_relief_corr_deg: 12.0
optics:
  psf:
    sigma_v: 0.7
    sigma_u: 0.7
  stray_light:
    amplitude: 0.35
    model: radial
    center_v: 40.0
    center_u: 210.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 2.37
offset_u: -1.62
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 1.0865
  known_offset_error_tol_px: 0.0515
