schema_version: 2
scene_name: relief_psf_stray_light
instrument: coiss_nac
size_v: 256
size_u: 256
random_seed: 31
exposure_sec: 1.0
# A lit body with limb relief under a whole-scene PSF and an off-center
# radial stray-light bump.  The explicit PSF activates oversample 4, so
# this is the catalog's pin on the ellipsoid renderer's oversampled
# relief body (working-grid shading with the relief tilt interpolated
# from the detector grid), the defaulted PSF kernel size at
# oversample, and the stray-light center_v/center_u scaling onto the
# oversampled grid.  A change to that mapping moves the rendered image;
# it does not necessarily move the recorded result, which is what this
# baseline pins -- a half-pixel shift of the bump leaves the fused
# offset where it was.  All of relief, PSF, and stray light are truth-side: the
# navigator fits its smooth sharp Lambert template against the blurred
# ragged limb and the relief's slope shading over a sloped background.
# Measured behavior: all three body techniques survive the blur and the
# sloped background, but the fused offset is (1.5, -1.5) against the
# planted (2.37, -1.62), a miss of 0.88 px, nearly all in v.  The limb fit
# lands at (1.67, -1.68), about 0.70 px from the planted value, and over the 16
# noise draws below it lands 0.66 to 0.70 px away.  It was 0.27 px while the
# predicted limb ran along the whole outline, unlit part included, and the night
# side glowed at 1% of full brightness (#894, #1056); it now fits only the lit
# limb, where the brightness gradient just inside the ragged limb draws it.  Each
# pixel reads the terrain where its line of sight meets the relief (#875), which
# sets the shading near the limb that both the limb fit and the correlation
# follow.  The disc correlation reports (1.5, -1.5), the edge of its sub-pixel
# refinement window, which searches only +-0.5 px around the integer NCC peak
# (#791); its smooth template doesn't carry the relief shading the frame does.
# Before either, it answered 1.59 px in v.  The black night side alone moved it
# to 1.54 px and the line-of-sight read alone to 1.55 px; together they put it on
# the edge.  The
# ensemble fuses the limb fit and the correlation as one witness and takes
# the correlation's offset, so the scene pins a medium-confidence success
# whose error is the correlation's.
# Known error: over 16 draws of the detector noise alone (the committed draw
# and noise_seed 101, 202, ..., 1515), which keep this scene's limb relief,
# the fused error is 0.878 px on every draw (spread 0 px), because the
# correlation stops at the window edge on all of them.  Each end of the band
# sits a margin of max(0.05 px, a fifth of the spread) = 0.05 px outside, giving
# [0.828, 0.929] px.  A worse miss fails, and so does a fix that brings the
# error under 0.828 px.  The relief decides the error: over 16 values of
# random_seed, which redraw the relief too, it runs 0.716 to 2.402 px on the 15
# that succeed (random_seed 909 ends conflicted), because which window edge the
# correlation stops at depends on the relief drawn (#791).
bodies:
  - name: RUGGED
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 128.0
    semi_a_px: 70.0
    semi_b_px: 70.0
    semi_c_px: 70.0
    illumination_angle: 20.0
    phase_angle: 35.0
    limb_relief_rms: 0.02
    limb_relief_corr_deg: 12.0
optics:
  psf:
    sigma_v: 0.7
    sigma_u: 0.7
  stray_light:
    amplitude: 0.35
    model: radial
    center_v: 40.0
    center_u: 210.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 2.37
offset_u: -1.62
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 0.8785
  known_offset_error_tol_px: 0.0505
