schema_version: 2
scene_name: low_phase_limb_misconverge
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 1.0
# A well-resolved sphere at phase 10 deg on black sky, noise-free, with a
# small planted sub-pixel offset.  Near zero phase the lit arc spans almost
# the whole silhouette and the limb-darkening roll-off is nearly symmetric,
# so the across-limb gradient that constrains the limb fit is weakest exactly
# where the geometry offers the least leverage.  The scene was built when the
# limb fit mis-locked here: a false overlap peak several pixels from the true
# limb seeded the Levenberg-Marquardt stage in the wrong basin, and the fit,
# pinned against its trust region, was flagged spurious.  That mis-lock came
# from the predicted limb running along the unlit outline, where the night side
# then glowed at 1% of full brightness; with a black night side and a lit-only
# predicted limb (#894, #1056) it no longer happens.  The body shades with the
# default Lommel-Seeliger law, and the navigator's Lambert template pulls its
# answers toward the Sun (#1110).  Measured behavior: the limb fit converges
# 0.21 px from the planted offset and is not flagged, the disc correlation lands
# 0.70 px from it, and the fused ensemble result is a success 0.54 px from the
# planted offset, which the expected block holds to a band.  The mis-lock gate
# itself is covered by the limb technique's unit tests.
bodies:
  - name: RHEA
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    semi_a_px: 80.0
    semi_b_px: 80.0
    semi_c_px: 80.0
    illumination_angle: 25.0
    phase_angle: 10.0
noise:
  poisson: false
  read_noise_dn: 0.0
offset_v: 0.3
offset_u: 0.3
offset_rotation_deg: 0.0
expected:
  status: success
  # The body shades with the default Lommel-Seeliger law, and the navigator's
  # Lambert template pulls the answer toward the Sun (#1110).  The band holds the
  # fused error over the seeds, measured as sim_truth.py describes.
  known_offset_error_px: 0.5385
  known_offset_error_tol_px: 0.0505
