schema_version: 2
scene_name: mutual_deep
instrument: coiss_nac
size_v: 256
size_u: 256
random_seed: 42
exposure_sec: 1.0
# Mutual event, near-total occultation: a larger near body (radius 65 px)
# 15 px off the far body's center hides almost all of it.  Rendered truth
# (body_occlusion): FAR visible_fraction ~0.09, occluded limb arc ~206 deg
# (over half the limb circle); NEAR fully visible.  Measured ensemble
# behavior (2026-07-18, occlusion-aware sim limb): the navigator drops
# FAR's hidden arc from the predicted polyline -- its idealized view knows
# NEAR's geometry and explicit nearer range_km -- so FAR's LIMB_ARC
# reports visible_arc_fraction 0.41 (reliability 0.64) instead of
# claiming 1.0, and the joint limb fit runs on arcs that exist in the image
# and lands within ~0.1 px.  FAR's residual terminator arc is occlusion-
# reduced too (fraction 0.27) and stays below the 0.30 reliability gate.
# FAR is below the 40% visible lit fraction a disc template needs, so the
# disc correlation's template holds NEAR alone, and FAR's bright crescent
# against NEAR's dim limb pulls the correlation's high-pass refinement
# about 0.6 px (#1050).  The fused answer takes the correlation's offset,
# a medium-tier success 0.60 px off; over the committed seed and 101,
# 202, ..., 1515 it runs 0.595 to 0.611 px, and the expected block holds
# it to that range plus a 0.05 px margin on each side.  No double-
# counting conflict was observed at any overlap depth.
bodies:
  - name: FAR
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 95.0
    semi_a_px: 60.0
    semi_b_px: 60.0
    semi_c_px: 60.0
    illumination_angle: 20.0
    phase_angle: 30.0
    range_km: 700000.0
  - name: NEAR
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 110.0
    semi_a_px: 65.0
    semi_b_px: 65.0
    semi_c_px: 65.0
    illumination_angle: 20.0
    phase_angle: 30.0
    range_km: 500000.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 2.37
offset_u: -1.62
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 0.6035
  known_offset_error_tol_px: 0.0585
