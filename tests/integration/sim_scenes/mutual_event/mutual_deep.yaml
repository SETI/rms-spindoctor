schema_version: 2
scene_name: mutual_deep
instrument: coiss_nac
size_v: 256
size_u: 256
random_seed: 42
exposure_sec: 1.0
# Mutual event, near-total occultation: a larger near body (radius 65 px)
# 15 px off the far body's center hides almost all of it.  Rendered truth
# (body_occlusion): FAR visible_fraction ~0.09, occluded limb arc ~206 deg
# (over half the limb circle); NEAR fully visible.  Measured ensemble
# behavior (2026-11-24, occlusion-aware lit sim limb): the navigator drops
# FAR's hidden arc from the predicted polyline -- its idealized view knows
# NEAR's geometry and explicit nearer range_km -- so FAR's LIMB_ARC
# reports visible_arc_fraction 0.31 of its lit limb (reliability 0.56) instead
# of claiming 1.0, and the joint limb fit runs on arcs that exist in the
# image.  FAR's residual terminator arc is occlusion-reduced too
# (fraction 0.28) and stays below the 0.30 reliability gate.  FAR is left
# out of the disc template, and its crescent beside NEAR's limb, which the
# template doesn't carry, pulls the disc correlation's high-pass refinement
# (#1050).  Both bodies shade with the default lunar-Lambert law, and the
# navigator's Lambert template pulls the answer toward the Sun (#1110): the disc
# correlation lands 0.51 px off and sets a medium-tier success alone, since the
# limb fit, 0.21 to 0.23 px off, flags itself spurious on every draw.  On Lambert
# bodies the disc correlation landed 0.25 px off, within 0.012 px without FAR in
# the scene, and the limb fit flagged itself spurious on every draw too.
# Known error: over the committed seed and random_seed 101, 202, ..., 1515
# the fused error is 0.509 px on every draw.  Each end of the band sits a
# margin of max(0.05 px, a fifth of the spread) = 0.05 px outside, giving
# [0.459, 0.560] px.  A worse miss fails, and so does a fix that brings the
# error under 0.459 px.
bodies:
  - name: FAR
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 95.0
    semi_a_px: 60.0
    semi_b_px: 60.0
    semi_c_px: 60.0
    illumination_angle: 20.0
    phase_angle: 30.0
    range_km: 700000.0
  - name: NEAR
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 110.0
    semi_a_px: 65.0
    semi_b_px: 65.0
    semi_c_px: 65.0
    illumination_angle: 20.0
    phase_angle: 30.0
    range_km: 500000.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 2.37
offset_u: -1.62
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 0.5095
  known_offset_error_tol_px: 0.0505
