schema_version: 2
scene_name: mutual_deep
instrument: coiss_nac
size_v: 256
size_u: 256
random_seed: 42
exposure_sec: 1.0
# Mutual event, near-total occultation: a larger near body (radius 65 px)
# 15 px off the far body's center hides almost all of it.  Rendered truth
# (body_occlusion): FAR visible_fraction ~0.09, occluded limb arc ~206 deg
# (over half the limb circle); NEAR fully visible.  Measured ensemble
# behavior (2026-07-18, occlusion-aware sim limb): the navigator drops
# FAR's hidden arc from the predicted polyline -- its idealized view knows
# NEAR's geometry and explicit nearer range_km -- so FAR's LIMB_ARC
# reports visible_arc_fraction 0.41 (reliability 0.64) instead of
# claiming 1.0, and the joint limb fit runs on arcs that exist in the
# image.  FAR's residual terminator arc is occlusion-reduced too
# (fraction 0.27) and stays below the 0.30 reliability gate.  FAR is left
# out of the disc template, and its crescent beside NEAR's limb, which the
# template doesn't carry, pulls the disc correlation's high-pass refinement
# to (2.40, -1.38), 0.24 px from the planted offset (#1050).  Without FAR in
# the scene the disc correlation lands within 0.012 px.  On the committed
# draw the limb fit stops unconverged with polarity rejection and flags
# itself spurious, so the disc correlation alone sets the medium-tier
# success; on the 10 of 16 draws where the limb fit survives, the two fuse
# 0.20 to 0.21 px off.
# Known error: over the committed seed and random_seed 101, 202, ..., 1515
# the fused error runs 0.201 to 0.239 px (spread 0.038 px).  Each end of
# the band sits a margin of max(0.05 px, a fifth of the spread) = 0.05 px
# outside, giving [0.151, 0.289] px.  A worse miss fails, and so does a
# fix that brings the error under 0.151 px.
bodies:
  - name: FAR
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 95.0
    semi_a_px: 60.0
    semi_b_px: 60.0
    semi_c_px: 60.0
    illumination_angle: 20.0
    phase_angle: 30.0
    range_km: 700000.0
  - name: NEAR
    shape_model: ellipsoid
    center_v: 128.0
    center_u: 110.0
    semi_a_px: 65.0
    semi_b_px: 65.0
    semi_c_px: 65.0
    illumination_angle: 20.0
    phase_angle: 30.0
    range_km: 500000.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 2.37
offset_u: -1.62
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 0.22
  known_offset_error_tol_px: 0.069
