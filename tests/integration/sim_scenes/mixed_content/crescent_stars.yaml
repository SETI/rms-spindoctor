schema_version: 2
scene_name: crescent_stars
instrument: coiss_nac
size_v: 512
size_u: 512
random_seed: 7
exposure_sec: 0.68
# A crescent and a sparse star field on a Cassini NAC frame read out summed 2 by 2
# (SUM2), the camera's 512 px readout: Tethys 120 px across at 135 degrees phase, lit
# from the left, with seven stars whose magnitudes, 8.9 to 10.7, were chosen for this
# scene.  Here the body and the stars agree on the pointing, unlike
# stars_body_ephemeris_error, and the terminator takes up most of the body's outline.
#
# The simulated body model emits no limb arc above 60 degrees phase, so the body is
# navigated by BodyDiscCorrelateNav, which lands 0.03 px from the truth.
# StarFieldFromCatalogNav finds too few stars on every draw, but StarUniqueMatchNav
# and StarRefineNav navigate on the stars, 0.01 to 0.30 px and 0.02 to 0.22 px off.
# The fused answer follows the stars, 0.02 to 0.18 px from the truth over the 16
# draws, within 0.52 of its reported sigmas.  BodyBlobNav lands 1.9 to 2.2 px off
# without flagging it (#975); it landed 0.01 to 0.09 px off when the body shaded
# with the Lambert law.
#
# The body is as bright as Tethys in N1633925572, 126 px across at 136 deg phase
# through RED+CL2: normal_albedo, 0.085, is that disc's median I/F over the
# Lommel-Seeliger law's value, counting the pixels where the Sun and the camera are
# both within about 73 deg of overhead, as the realism match measures it.  The
# crescent's brightest pixel reads 647 DN, far below the 4,095 DN top of the range,
# and no pixel of the real crescent reads full scale in its raw product.
#
# The pointing error is the size real NAC frames carry, halved for the summed pixels
# and pointing down and to the right, and the twist is the NAC's measured 0.0115
# degrees, unfit, as the camera ships.
artifacts:
  instrument_defaults: true
detector:
  binning: 2
bodies:
  - name: TETHYS
    center_v: 290.0
    center_u: 230.0
    semi_a_px: 60.0
    semi_b_px: 60.0
    semi_c_px: 60.0
    illumination_angle: 250.0
    phase_angle: 135.0
    normal_albedo: 0.085
    range_km: 700000.0
stars:
  - {name: S01, v: 61.3, u: 88.7, vmag: 8.91}
  - {name: S02, v: 432.6, u: 61.4, vmag: 9.37}
  - {name: S03, v: 118.8, u: 447.1, vmag: 9.63}
  - {name: S04, v: 455.2, u: 401.9, vmag: 9.95}
  - {name: S05, v: 197.4, u: 380.6, vmag: 10.21}
  - {name: S06, v: 33.9, u: 300.3, vmag: 10.48}
  - {name: S07, v: 353.7, u: 476.2, vmag: 10.66}
offset_v: 7.71
offset_u: 12.39
offset_rotation_deg: 0.0115
