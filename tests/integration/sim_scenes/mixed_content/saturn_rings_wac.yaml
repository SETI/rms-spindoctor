schema_version: 2
scene_name: saturn_rings_wac
instrument: coiss_wac
size_v: 512
size_u: 512
random_seed: 7
exposure_sec: 0.3
# A whole-system frame on the Cassini WAC read out summed 2 by 2 (SUM2): Saturn 178 px
# across, flattened to its real 0.902 polar ratio, with its C, B, and A rings at their
# real radii relative to the planet, seen at a 20 degree opening.  The planet hides
# the rings' far side and the rings cross in front of its near side.  The B and A
# rings' edges are navigable; the faint C ring is not.  This is the distant,
# correctly sized planet of the whole-system frames, so the shadows the simulator
# does not draw between rings and planet (#896) would cover only a small part of it.
#
# RingEdgeNav carries the fused answer and lands 0.02 to 0.09 px off over the 16
# draws, 0.5 to 2.2 of its reported sigmas.  The simulated rings are about 4 times
# too faint against Saturn (#895).
#
# The planet shades with the default lunar-Lambert law, which the navigator's
# Lambert template does not match (#1110): BodyDiscCorrelateNav lands 0.47 to
# 0.48 px off and BodyLimbNav 0.12 to 0.23 px off, both with wider sigmas.
# BodyBlobNav lands 8.63 to 8.64 px off at confidence 0 and does not flag it (#975),
# and RingAnnulusNav flags its answer spurious on every draw.  The frame is a
# high-tier success on every draw.
#
# The pointing error is a WAC-sized one, pointing up and to the right, and the twist
# is the WAC's measured -0.0115 degrees, unfit, as the camera ships.
artifacts:
  instrument_defaults: true
detector:
  binning: 2
bodies:
  - name: SATURN
    center_v: 270.0
    center_u: 250.0
    semi_a_px: 80.3
    semi_b_px: 89.0
    semi_c_px: 89.0
    sub_observer_lat_deg: -20.0
    illumination_angle: 200.0
    phase_angle: 30.0
    range_km: 5600000.0
ring_system:
  range_km: 5600000.0
  km_per_pixel: 677.0
  phase_deg: 30.0
  geometry:
    center_v: 270.0
    center_u: 250.0
    opening_deg_obs: 20.0
    opening_deg_sun: 18.0
    node_deg: 0.0
  features:
    - name: C_RING
      kind: ringlet
      tau: 0.1
      width_px: 25.2
      orbit: {a_px: 123.5, ae_px: 0.0, long_peri_deg: 0.0, rate_peri_deg_per_day: 0.0}
    - name: B_RING
      kind: ringlet
      tau: 1.5
      width_px: 37.7
      navigable: true
      orbit: {a_px: 154.8, ae_px: 0.0, long_peri_deg: 0.0, rate_peri_deg_per_day: 0.0}
    - name: A_RING
      kind: ringlet
      tau: 0.6
      width_px: 21.8
      navigable: true
      orbit: {a_px: 191.1, ae_px: 0.0, long_peri_deg: 0.0, rate_peri_deg_per_day: 0.0}
offset_v: -1.21
offset_u: 1.73
offset_rotation_deg: -0.0115
