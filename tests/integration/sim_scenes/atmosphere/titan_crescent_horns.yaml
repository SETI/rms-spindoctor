schema_version: 2
scene_name: titan_crescent_horns
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 1.0
# The body is named HAZEMOON, not TITAN, deliberately: this scene is a
# body-navigation fidelity record for a haze-BLIND navigator.  A body named
# TITAN routes to the haze model and its symmetry technique instead, which
# measures something else entirely.
bodies:
  - name: HAZEMOON
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    semi_a_px: 85.0
    semi_b_px: 85.0
    semi_c_px: 85.0
    illumination_angle: 90.0
    phase_angle: 155.0
    atmosphere:
      scale_height_px: 10.0
      tau_ref: 3.0
      ref_altitude_px: 0.0
      g: 0.75
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.2
offset_u: -0.8
offset_rotation_deg: 0.0
# At 155 deg phase the forward-scattering haze defeats every body technique.
# The ring of light drags the lit-weighted blob centroid 25 px from the planted
# offset.  The predicted TERMINATOR_ARC is emitted but never fitted: with its
# reliability computed as the SPICE-backed model does (visible-arc fraction
# ~1.0, the albedo penalty, and the sin(155 deg) = 0.42 phase cap), it scores
# 0.26 against the 0.30 TERMINATOR_ARC reliability gate.  The ring of light is
# brighter than a white disc lit face-on, and the detector saturates on it.
# The disc correlation is pulled by the ring of light, which its hard-limbed
# template leaves out (#1050): it answers (1.20, -5.61), 4.81 px from the
# planted offset, and flags that answer spurious on every draw.  The blob is
# then the lone surviving body offset beside a geometric fit that flagged
# itself, so the body-witness veto declines the frame
# (lone_blob_in_collapsed_regime) on the committed seed and on random_seed 101,
# 202, ..., 1515 and noise_seed 101 to 808.  On the same frame with a Lambert
# surface, the disc correlation lands 3.00 px off without flagging it and the
# frame ends a low-tier success that far wrong; the Lommel-Seeliger surface
# moves the correlation further and makes it flag itself (#1110).
# The ring of light saturates because the simulated haze is about four times
# too bright: its single-scattering source lacks the factor of 1/4 (#1101).
# The outcome may change when #1101 is fixed.
expected:
  # Depends on the haze brightness #1101 corrects.
  status: failed
  confidence_tier: failed
  status_reason: lone_blob_in_collapsed_regime
