schema_version: 2
scene_name: titan_crescent_horns
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 1.0
# The body is named HAZEMOON, not TITAN, deliberately: this scene is a
# body-navigation fidelity record for a haze-BLIND navigator.  A body named
# TITAN routes to the haze model and its symmetry technique instead, which
# measures something else entirely.
bodies:
  - name: HAZEMOON
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    semi_a_px: 85.0
    semi_b_px: 85.0
    semi_c_px: 85.0
    illumination_angle: 90.0
    phase_angle: 155.0
    atmosphere:
      scale_height_px: 10.0
      tau_ref: 3.0
      ref_altitude_px: 0.0
      g: 0.75
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.2
offset_u: -0.8
offset_rotation_deg: 0.0
# At 155 deg phase the forward-scattering haze defeats every body technique.
# The ring of light drags the lit-weighted blob centroid 24 px from the planted
# offset.  The predicted TERMINATOR_ARC is emitted but never fitted: with its
# reliability computed as the SPICE-backed model does (visible-arc fraction
# ~1.0, the albedo penalty, and the sin(155 deg) = 0.42 phase cap), it scores
# 0.26 against the 0.30 TERMINATOR_ARC reliability gate.  The ring of light
# peaks at about 0.9 of a white disc lit face-on, below the full well.
# The disc correlation is pulled by the ring of light, which its hard-limbed
# template leaves out (#1050): it answers (1.19, -3.67), 2.87 px from the
# planted offset, at the edge of its half-pixel refinement window along u
# (#1061).  It does not flag that answer spurious, so the body-witness veto
# has nothing to read, the blob is dropped as a fallback, and the disc
# correlation alone sets a low-tier success.  The status: success asserted
# below is a hazard held in view, not an endorsement.
# Known error: over the committed seed and random_seed 101, 202, ..., 1515
# the fused error runs 2.864 to 2.911 px (spread 0.047 px).  Each end of the
# band sits a margin of max(0.05 px, a fifth of the spread) = 0.05 px
# outside, giving [2.814, 2.961] px.
expected:
  status: success
  confidence_tier: low
  known_offset_error_px: 2.8875
  known_offset_error_tol_px: 0.0735
