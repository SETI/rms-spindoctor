schema_version: 2
scene_name: titan_crescent_horns
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 1.0
# The body is named HAZEMOON, not TITAN, deliberately: this scene is a
# body-navigation fidelity record for a haze-BLIND navigator.  A body named
# TITAN routes to the haze model and its symmetry technique instead, which
# measures something else entirely.
bodies:
  - name: HAZEMOON
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    semi_a_px: 85.0
    semi_b_px: 85.0
    semi_c_px: 85.0
    illumination_angle: 90.0
    phase_angle: 155.0
    atmosphere:
      scale_height_px: 10.0
      tau_ref: 3.0
      ref_altitude_px: 0.0
      g: 0.75
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.2
offset_u: -0.8
offset_rotation_deg: 0.0
# At 155 deg phase the forward-scattering haze defeats most body techniques.
# The ring of light drags the lit-weighted blob centroid 25 px from the planted
# offset.  The predicted TERMINATOR_ARC is emitted but never fitted: with its
# reliability computed as the SPICE-backed model does (visible-arc fraction
# ~1.0, the albedo penalty, and the sin(155 deg) = 0.42 phase cap), it scores
# 0.26 against the 0.30 TERMINATOR_ARC reliability gate.  The ring of light is
# brighter than a white disc lit face-on, and the detector saturates on it (it
# was capped at that brightness before #894).  The disc correlation is no longer
# flagged spurious against it: it reports (0.5, -0.5) for the planted
# (1.2, -0.8), stopping at the edge of its +-0.5 px sub-pixel window (#791), and
# carries a low-tier success 0.76 px wrong.  Because the disc correlation
# survives, the lone-blob-in-collapsed-regime veto no longer declines the frame
# (it did while the correlation self-flagged spurious); the veto keeps its unit
# tests in tests/spindoctor/nav_orchestrator/test_ensemble.py.
# Known error: over the committed draw and random_seed 101, 202, ..., 1515 the
# fused error is 0.762 px on every draw (spread under 0.001 px).  Each end of the
# band sits a margin of max(0.05 px, a fifth of the spread) = 0.05 px outside,
# giving [0.711, 0.812] px.
expected:
  status: success
  confidence_tier: low
  known_offset_error_px: 0.7615
  known_offset_error_tol_px: 0.0505
