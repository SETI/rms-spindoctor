schema_version: 2
scene_name: titan_crescent_horns
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 1.0
# The body is named HAZEMOON, not TITAN, deliberately: this scene is a
# body-navigation fidelity record for a haze-BLIND navigator.  A body named
# TITAN routes to the haze model and its symmetry technique instead, which
# measures something else entirely.
bodies:
  - name: HAZEMOON
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    semi_a_px: 85.0
    semi_b_px: 85.0
    semi_c_px: 85.0
    illumination_angle: 90.0
    phase_angle: 155.0
    atmosphere:
      scale_height_px: 1.49
      tau_ref: 14.3
      ref_altitude_px: 4.62
      g: 0.886
      g2: -0.164
      g2_fraction: 0.091
      albedo: 0.95
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.2
offset_u: -0.8
offset_rotation_deg: 0.0
# The haze is Titan's published haze with the 85 px radius standing for Titan's
# 2575 km (30.3 km/px): see titan_haze for the values and their sources.  It hides
# the surface, so the only light is the haze's own, and at 155 deg phase that is
# the ring of light, which peaks at 0.39 of a white disc lit face-on about 7 px
# above the solid limb.
# At this phase the haze defeats every body technique.  The ring of light drags
# the lit-weighted blob centroid 16 to 19 px from the planted offset.  The
# predicted TERMINATOR_ARC is emitted but never fitted: with its reliability
# computed as the SPICE-backed model does (visible-arc fraction ~1.0, the albedo
# penalty, and the sin(155 deg) = 0.42 phase cap), it scores 0.26 against the
# 0.30 TERMINATOR_ARC reliability gate.
# The disc correlation's hard-limbed template leaves the ring of light out
# (#1050), and on every draw it answers a point of its half-pixel coarse grid,
# (2.5, 0.5), (0.5, 0.5), or (-0.5, 0.5), 1.48 to 2.14 px from the planted offset.
# It does not flag that answer spurious, so the body-witness veto has nothing to
# read, the blob is dropped as a fallback, and the disc correlation alone sets a
# low-tier success.  The status: success asserted below is a hazard held in view,
# not an endorsement.
# Known error: over the committed seed and random_seed 101, 202, ..., 1515
# the fused error runs 1.476 to 2.140 px (spread 0.664 px).  Each end of the
# band sits a margin of max(0.05 px, a fifth of the spread) = 0.133 px
# outside, giving [1.343, 2.273] px.
expected:
  status: success
  confidence_tier: low
  known_offset_error_px: 1.808
  known_offset_error_tol_px: 0.465
