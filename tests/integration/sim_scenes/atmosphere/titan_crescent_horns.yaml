schema_version: 2
scene_name: titan_crescent_horns
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 1.0
# The body is named HAZEMOON, not TITAN, deliberately: this scene is a
# body-navigation fidelity record for a haze-BLIND navigator.  A body named
# TITAN routes to the haze model and its symmetry technique instead, which
# measures something else entirely.
bodies:
  - name: HAZEMOON
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    axis1: 170.0
    axis2: 170.0
    axis3: 170.0
    illumination_angle: 90.0
    phase_angle: 155.0
    atmosphere:
      scale_height_px: 10.0
      tau_ref: 3.0
      ref_altitude_px: 0.0
      g: 0.75
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.2
offset_u: -0.8
offset_rotation_deg: 0.0
# At 155 deg phase the forward-scattering haze defeats every body technique: the
# disc correlation is spurious (no full lit disc to correlate), and the ring of
# light drags the lit-weighted blob centroid ~30 px in du from the planted
# offset.  The predicted TERMINATOR_ARC is emitted but never fitted: with its
# reliability computed as the SPICE-backed model does (visible-arc fraction
# ~1.0, the albedo penalty, and the sin(155 deg) = 0.42 phase cap), it scores
# 0.26 against the 0.30 TERMINATOR_ARC reliability gate, so BodyBlobNav is the
# only surviving technique.  Its centroid carries a systematic photometric bias
# no blob diagnostic can see, and the disc correlation on the same body
# self-flagged spurious, so the lone-blob-in-collapsed-regime body-witness veto
# declines the frame rather than reporting a low-tier success ~30 px wrong: a
# wrong offset that passed the acceptance gate was worse than a declared
# failure.  This scene asserts that decline -- a haze crescent whose only surviving
# technique is the bias-prone centroid is correctly refused.
expected:
  status: failed
  status_reason: lone_blob_in_collapsed_regime
