schema_version: 2
scene_name: titan_crescent_horns_noiseless
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 1.0
# The body is named HAZEMOON, not TITAN, deliberately: this scene is a
# body-navigation fidelity record for a haze-BLIND navigator.  A body named
# TITAN routes to the haze model and its symmetry technique instead, which
# measures something else entirely.
bodies:
  - name: HAZEMOON
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    semi_a_px: 85.0
    semi_b_px: 85.0
    semi_c_px: 85.0
    illumination_angle: 90.0
    phase_angle: 155.0
    atmosphere:
      scale_height_px: 10.0
      tau_ref: 3.0
      ref_altitude_px: 0.0
      g: 0.75
noise:
  poisson: false
  read_noise_dn: 0.0
offset_v: 1.2
offset_u: -0.8
offset_rotation_deg: 0.0
# See titan_crescent_horns: the ring of light drags the blob centroid 25 px,
# the terminator feature is dropped by the reliability gate (0.26 vs the 0.30
# threshold, the sin(155 deg) phase cap doing most of the capping), and the
# disc correlation, no longer flagged spurious, stops at the edge of its
# sub-pixel window (#791) and carries a low-tier success 0.76 px wrong.  The
# noiseless twin removes read and Poisson noise as a confound and pins the
# outcome deterministically: the haze alone, not the noise, decides it.
# Known error: 0.762 px on the committed draw and on random_seed 101, 202, ...,
# 1515 alike, giving the band [0.711, 0.812] px with the 0.05 px margin.
# The ring of light saturates because the simulated haze is about four times too
# bright: its single-scattering source lacks the factor of 1/4 (#1101).  This
# recorded outcome rests on that brightness and moves when #1101 is fixed.
expected:
  # Depends on the haze brightness #1101 corrects.
  status: success
  confidence_tier: low
  known_offset_error_px: 0.7615
  known_offset_error_tol_px: 0.0505
