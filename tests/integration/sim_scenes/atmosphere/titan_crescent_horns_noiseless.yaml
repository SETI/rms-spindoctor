schema_version: 2
scene_name: titan_crescent_horns_noiseless
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 1.0
# The body is named HAZEMOON, not TITAN, deliberately: this scene is a
# body-navigation fidelity record for a haze-BLIND navigator.  A body named
# TITAN routes to the haze model and its symmetry technique instead, which
# measures something else entirely.
bodies:
  - name: HAZEMOON
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    semi_a_px: 85.0
    semi_b_px: 85.0
    semi_c_px: 85.0
    illumination_angle: 90.0
    phase_angle: 155.0
    atmosphere:
      scale_height_px: 10.0
      tau_ref: 3.0
      ref_altitude_px: 0.0
      g: 0.75
noise:
  poisson: false
  read_noise_dn: 0.0
offset_v: 1.2
offset_u: -0.8
offset_rotation_deg: 0.0
# See titan_crescent_horns: the ring of light drags the blob centroid ~30 px,
# the terminator feature is dropped by the reliability gate (0.26 vs the 0.30
# threshold, the sin(155 deg) phase cap doing most of the capping), and the
# disc correlation, pulled by the ring of light its template leaves out
# (#1050), answers (1.20, -7.5) without flagging it spurious.  The noiseless
# twin removes read/Poisson noise as a confound and pins both biases
# deterministically (the blob's du ~28.9 vs planted -0.8, and the disc
# correlation's 6.70 px): the haze alone, not the noise, carries the answers
# that far.  The disc correlation sets a low-tier success 6.700 px from the
# planted offset on every seed, held to the band [6.650, 6.751] px (a margin
# of 0.05 px each side).
expected:
  status: success
  confidence_tier: low
  known_offset_error_px: 6.7005
  known_offset_error_tol_px: 0.0505
