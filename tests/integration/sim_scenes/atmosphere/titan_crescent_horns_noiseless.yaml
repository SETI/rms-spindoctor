schema_version: 2
scene_name: titan_crescent_horns_noiseless
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 3.6
# The exposure is titan_crescent_horns', set from the real frame cited there.
# The body is named HAZEMOON, not TITAN, deliberately: this scene is a
# body-navigation fidelity record for a haze-BLIND navigator.  A body named
# TITAN routes to the haze model and its symmetry technique instead, which
# measures something else entirely.
bodies:
  - name: HAZEMOON
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    semi_a_px: 85.0
    semi_b_px: 85.0
    semi_c_px: 85.0
    illumination_angle: 90.0
    phase_angle: 155.0
    atmosphere:
      haze_model: titan
noise:
  poisson: false
  read_noise_dn: 0.0
offset_v: 1.2
offset_u: -0.8
offset_rotation_deg: 0.0
# See titan_crescent_horns: the body takes Titan's published haze, the ring of
# light drags the blob centroid 19.3 px, the terminator feature is dropped by the
# reliability gate (0.26 vs the 0.30 threshold, the sin(155 deg) phase cap doing
# most of the capping), and the disc correlation, whose template leaves the ring
# of light out (#1050), locks onto that ring 10.19 px toward the sun without
# flagging it spurious, a medium-tier success 9.9 sigma off.  The noiseless twin
# removes read and Poisson noise as a confound and pins both biases
# deterministically: the haze alone, not the noise, decides them.
# Known error: 10.191 px on the committed draw and on random_seed 101, 202, ...,
# 1515 alike, giving the band [10.140, 10.241] px with the 0.05 px margin.
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 10.1905
  known_offset_error_tol_px: 0.0505
