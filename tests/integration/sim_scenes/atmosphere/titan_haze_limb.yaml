# The body is named HAZEMOON, not TITAN, deliberately: this scene is a
# body-navigation fidelity record for a haze-BLIND navigator -- what the
# ellipsoid limb / disc / blob techniques do when a soft haze limb sits above
# the hard limb they predict.  A body named TITAN routes to the haze model and
# its symmetry technique instead, which is a different measurement; the sim
# Titan scenes live alongside this one under their own base scene.
