schema_version: 2
scene_name: titan_haze
instrument: coiss_nac
size_v: 360
size_u: 360
random_seed: 7
exposure_sec: 1.0
# The Titan base scene: the reference geometry the haze-symmetry technique's
# standing offset sweeps and its response curves are measured from.  Unlike the
# HAZEMOON scenes beside it -- body-navigation fidelity records for a haze-blind
# navigator -- this body IS named TITAN, so the haze model claims it and
# TitanHazeNav is the only technique that runs.
#
# The scale is real Titan: a 60 px solid radius at 42.917 km/px is the
# published 2575 km mean radius, so the configured 700 km atmosphere height
# lands the predicted envelope 16.3 px above the surface and the whole envelope
# (dilated by the 50 px extfov search window) sits inside the extended frame at
# every offset the sweeps plant.  The rendered haze is deliberately NOT that
# envelope: it is Titan's published haze at this scale.  The scale height is 45 km
# above 140 km (Doose et al. 2016, Icarus 270, 355), 1.05 px; the tangent optical
# depth at 140 km is 14.3, from the optical depth above 80 km at 650 nm, 2.66
# (Tomasko et al. 2008, Planet. Space Sci. 56, 669), carried up from 80 km with
# their 65 km scale height; the single-scattering albedo is 0.95 (Doose et al.
# 2016); and the phase function is the two-term Henyey-Greenstein fit to the DISR
# haze phase function at 650 nm (see sim/render/bodies/haze_scattering.py).  The
# haze hides the surface, and the optical limb sits about 6 px above the solid
# radius, well inside the predicted envelope: the altitude mismatch the free-radius
# arc fit exists to absorb.  The fit lands 0.28 to 0.53 px off along the sun axis,
# toward the night side, and the error grows with the rendered scale height.
#
# Phase 60 deg is chosen, not incidental.  A smooth haze disc near full
# illumination is close to rotationally symmetric, so the mirror-correlation
# scan grows side lobes about 15 px either side of the true axis whose
# normalized height approaches the 0.90 competing-peak threshold; the technique
# then refuses the frame rather than risk locking onto one.  Measured at this
# body size, with a thicker and more extended haze, the strongest rival lobe runs
# 0.91 at phase 20, 0.89 at phase 40, 0.74 at phase 60, and vanishes by phase 90
# -- so a base scene at low phase would characterize the gate, not the
# estimator.  The phase dependence itself is a real property of the method and
# is swept in the util/ campaign.
bodies:
  - name: TITAN
    shape_model: ellipsoid
    center_v: 180.0
    center_u: 180.0
    semi_a_px: 60.0
    semi_b_px: 60.0
    semi_c_px: 60.0
    illumination_angle: 90.0
    phase_angle: 60.0
    km_per_pixel: 42.917
    range_km: 1200000.0
    atmosphere:
      scale_height_px: 1.05
      tau_ref: 14.3
      ref_altitude_px: 3.26
      g: 0.886
      g2: -0.164
      g2_fraction: 0.091
      albedo: 0.95
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 0.37
offset_u: -0.58
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
