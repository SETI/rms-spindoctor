schema_version: 2
scene_name: titan_haze
instrument: coiss_nac
size_v: 360
size_u: 360
random_seed: 7
exposure_sec: 7.3
# The exposure puts the haze's peak 2117 DN above the sky, 52% of the 12-bit
# range, where the cohort frames at this phase put it: W1552216540 (CL1+RED),
# W1552216646 (CL1+VIO), and W1822132529 (CL1+BL1), at 60.6 to 63.1 deg, peak
# 2150, 1933, and 2696 DN above their sky, a median of 2150 DN.  The read noise is
# the camera's own, 12 e- at the 30 e-/DN of gain state 2, which is 0.4 DN.
# The Titan base scene: the reference geometry the haze-symmetry technique's
# standing offset sweeps and its response curves are measured from.  Unlike the
# HAZEMOON scenes beside it -- body-navigation fidelity records for a haze-blind
# navigator -- this body IS named TITAN, so the haze model claims it and
# TitanHazeNav is the only technique that runs.
#
# The scale is real Titan: a 60 px solid radius at 42.917 km/px is the
# published 2575 km mean radius, so the configured 700 km atmosphere height
# lands the predicted envelope 16.3 px above the surface and the whole envelope
# (dilated by the 50 px extfov search window) sits inside the extended frame at
# every offset the sweeps plant.  The rendered haze is deliberately NOT that
# envelope: it is Titan's published haze at this scale, which the body takes by
# name (haze_model: titan) and the renderer evaluates over the camera's clear
# passband (see sim/render/bodies/titan_haze.py for the values and their
# sources): a 45 km scale height above 140 km, here 1.05 px, a tangent optical
# depth of 15.1 at 140 km, an albedo of 0.92, and a two-term phase function fitted
# to the Huygens measurements.  The haze hides the surface, and the optical limb
# sits about 6 px above the solid radius, well inside the predicted envelope: the
# altitude mismatch the free-radius arc fit exists to absorb.  The fit lands 0.49
# to 0.54 px off along the sun axis, toward the night side, on all 16 distinct
# draws (the committed seed and random_seed 101 to 1515; with no random content
# but the detector noise, noise_seed 101 to 808 repeat random_seed draws), and the
# error grows with the rendered scale height.
#
# Phase 60 deg is the reference geometry.  A smooth haze disc near full
# illumination is close to rotationally symmetric, so the mirror-correlation scan
# can grow side lobes either side of the true axis, and the technique refuses a
# frame whose strongest rival peak passes the 0.90 competing-peak threshold.
# Under this haze, on the committed draw and random_seed 101 to 505, the strongest
# rival peak stays at or below 0.06 at phase 20, 40, 60, and 90 deg, so the scene
# measures the estimator at any of those phases.  The phase dependence itself is
# a real property of the method and is swept in the util/ campaign.
bodies:
  - name: TITAN
    shape_model: ellipsoid
    center_v: 180.0
    center_u: 180.0
    semi_a_px: 60.0
    semi_b_px: 60.0
    semi_c_px: 60.0
    illumination_angle: 90.0
    phase_angle: 60.0
    km_per_pixel: 42.917
    range_km: 1200000.0
    atmosphere:
      haze_model: titan
noise:
  poisson: true
  read_noise_dn: 0.4
offset_v: 0.37
offset_u: -0.58
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: medium
