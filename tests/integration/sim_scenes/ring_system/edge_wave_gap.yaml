schema_version: 2
scene_name: edge_wave_gap
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 11
exposure_sec: 1.0
# A Keeler-style navigable gap carved into a broad sheet, viewed inclined
# (B = 50, node 30), whose orbit carries a satellite edge wave (amp_px 2,
# wavelength_px 10 of arc, damping_rad 0.6 downstream of lam0_deg = 45).
# The wave is part of the catalog orbit, so the navigator predicts the same
# scalloped edges the renderer draws and RingEdgeNav recovers the planted
# offset from two curved, wave-perturbed arcs under projection.
bodies: []
ring_system:
  geometry:
    center_v: 110.0
    center_u: 110.0
    opening_deg_obs: 50.0
    opening_deg_sun: 50.0
    node_deg: 30.0
  features:
    - name: SHEET
      kind: edge
      side: in
      tau: 1.2
      orbit: {a_px: 95.0}
    - name: WAVYGAP
      kind: gap
      tau: 1.2
      width_px: 6.0
      navigable: true
      orbit:
        a_px: 60.0
        ae_px: 0.0
        long_peri_deg: 0.0
        rate_peri_deg_per_day: 0.0
        edge_wave: {amp_px: 2.0, wavelength_px: 10.0, damping_rad: 0.6, lam0_deg: 45.0}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.2
offset_u: -0.9
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: high
