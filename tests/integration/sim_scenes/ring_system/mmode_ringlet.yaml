schema_version: 2
scene_name: mmode_ringlet
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 12
exposure_sec: 1.0
# A resonantly forced m = 2 ringlet (the B-ring outer-edge shape:
# r = a_px - amp_px*cos(2*(lam - long_peri_deg)) with amp_px 5 at
# long_peri_deg 40 in the ring-plane frame), viewed inclined at B = 65
# with a rotated node.  The mode is catalog knowledge in the navigable
# feature's orbit, so both sides place the same two-lobed edges and the
# planted offset is recoverable through the projection.
bodies: []
ring_system:
  geometry:
    center_v: 110.0
    center_u: 110.0
    opening_deg_obs: 65.0
    opening_deg_sun: 65.0
    node_deg: 15.0
  features:
    - name: BRINGEDGE
      kind: ringlet
      tau: 2.0
      width_px: 12.0
      navigable: true
      orbit:
        a_px: 70.0
        ae_px: 0.0
        long_peri_deg: 0.0
        rate_peri_deg_per_day: 0.0
        modes:
          - {m: 2, amp_px: 5.0, long_peri_deg: 40.0}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: -1.7
offset_u: 0.8
offset_rotation_deg: 0.0
expected:
  status: success
  confidence_tier: high
