schema_version: 2
scene_name: orbit_error_ringlet
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 15
exposure_sec: 1.0
# The planted-ephemeris-error axis: a centred navigable ringlet whose
# rendered orbit is displaced 2.5 px outward of the catalog orbit the
# navigator predicts from (delta_a_px, a truth key).  A uniform radial
# misplacement has no exact translational equivalent, but the robust
# edge fit down-weights the far arc and locks onto one side of the
# annulus, absorbing the ephemeris error into the recovered offset
# instead of the residuals -- through 2026-07-18 that recovery fused as
# a CONFIDENT high-tier success (conf 0.89, sigma 0.17 px, ~3 px wrong),
# this scene's standing ensemble-gap evidence.
# Both ring techniques consume the declared sigma_a_px error bar.  The
# declared radial uncertainty is added to each technique's reported
# covariance through the translation such a displacement is absorbed
# into: RingEdgeNav from its fit vertices, RingAnnulusNav from the same
# edge normals painted into its composite template.  On this CLOSED
# ringlet the linearized absorption is near zero for both (a uniform
# radial error dilates a full ring rather than translating it), yet the
# nonlinear acquisition demonstrably does lock onto a translation, so the
# term is reported isotropically -- the bound on every axis, since which
# direction it locks is exactly what cannot be predicted.  Measured
# outcome: success/MEDIUM at (-1.26, -1.95) px against the planted
# (1.0, -1.5), fused error 2.31 px, fused sigma (1.79, 1.77) px -- above
# the high tier's 0.5 px cap, so the tier demotes honestly, and the fused
# sigma now COVERS the error at ~1.3 sigma (it was ~2.8 sigma when only
# the edge inflated and the tight annulus carried the fused radial axis).
# That covering error bar is the point: the frame reports a radial
# precision consistent with how far it can actually be from truth.
# The scalar confidence RISES to 0.99, which is the correlated-witness
# artifact: both ring techniques observe the same misplaced
# annulus, so inflating both isotropically re-couples their weights and
# unlocks the two-member agreement boost.  The tier (governed by the
# fused sigma, not the scalar) stays medium, and the scalar artifact is
# tracked separately; it is documented here rather than masked.
# NOTE ON WHAT THIS SCENE GUARDS: the recovered error staying in the
# 2.3 +/- 1.0 band, the fused sigma covering it, and the tier staying out
# of high.  It no longer guards the original ~3 px confident-wrong
# recovery -- that behavior no longer occurs, and a future change that
# reintroduced it would show up as the error leaving the band from ABOVE,
# not as this pin passing.  The standing hazard it documents is that a
# planted radial catalog error is still absorbed into the offset at all.
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 2.3
  known_offset_error_tol_px: 1.0
bodies: []
ring_system:
  geometry:
    center_v: 110.0
    center_u: 110.0
    opening_deg_obs: 90.0
    opening_deg_sun: 90.0
    node_deg: 0.0
  features:
    - name: MISPLACED
      kind: ringlet
      tau: 2.0
      width: 20.0
      navigable: true
      orbit: {a: 60.0, ae: 0.0, long_peri: 0.0, rate_peri: 0.0}
      orbit_error: {delta_a_px: 2.5}
      declared_orbit_sigma: {sigma_a_px: 2.5}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.0
offset_u: -1.5
offset_rotation_deg: 0.0
