schema_version: 2
scene_name: orbit_error_ringlet
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 15
exposure_sec: 1.0
# The planted-ephemeris-error axis: a centered navigable ringlet whose
# rendered orbit is displaced 2.5 px outward of the catalog orbit the
# navigator predicts from (delta_a_px, a truth key).  A uniform radial
# misplacement has no exact translational equivalent, but the robust
# edge fit down-weights the far arc and locks onto one side of the
# annulus, absorbing the ephemeris error into the recovered offset
# instead of the residuals -- through 2026-07-18 that recovery fused as
# a CONFIDENT high-tier success (conf 0.89, sigma 0.17 px, ~3 px wrong),
# this scene's standing ensemble-gap evidence.
# Both ring techniques consume the declared sigma_a_px error bar.  The
# declared radial uncertainty is added to each technique's reported
# covariance through the translation such a displacement is absorbed
# into: RingEdgeNav from its fit vertices, RingAnnulusNav from the same
# edge normals painted into its composite template.  On this CLOSED
# ringlet the linearized absorption is near zero for both (a uniform
# radial error dilates a full ring rather than translating it), yet the
# nonlinear acquisition demonstrably does lock onto a translation, so the
# term is reported isotropically -- the bound on every axis, since which
# direction it locks is exactly what cannot be predicted.  Because the
# two ring techniques read one catalog model, the ensemble collapses them
# to a single witness before the fuse, so the declared error bar isn't
# shrunk by a second, correlated view of the same misplaced annulus.
# Measured outcome (2026-11-11): success/LOW at (1.72, -3.04) px against
# the planted (1.13, -1.37), fused error 1.77 px, fused sigma (2.49, 2.50) px,
# confidence 0.84 -- the sigma covers the error at ~0.7 sigma and holds the
# tier at low.  That covering error bar is the point: the frame reports a
# radial precision consistent with how far it can actually be from truth.
# Which arc of the annulus the fit locks onto depends on the noise draw: over
# 16 noise seeds (the committed one and 101, 202, ..., 1515) the error is
# 1.77 px on three seeds, 1.90 px on nine, and 3.14 to 3.18 px on four.  The
# band covers that spread (#960): each end sits a margin of max(0.05 px, a
# fifth of the end) outside the measured range, giving [1.41, 3.82] px.  The
# fused sigma covers the error on every seed, at 1.3 sigma at most.
# NOTE ON WHAT THIS SCENE GUARDS: the recovered error staying in the
# [1.41, 3.82] px band and the tier staying at low.  The tier is a coarse
# sigma check: the frame rises to medium only once the fused sigma falls to
# the medium tier's 2.0 px bound.  The truth checks add a finer one: the fused
# error must stay within 3 sigma (test_sim_truth_checks).  The original
# recovery was confidently wrong: about 3 px off, with an error bar that did
# not cover that error.  Both sigma checks catch that coming back.  The
# standing hazard it documents is that a planted radial catalog error is
# still absorbed into the offset at all.
expected:
  status: success
  confidence_tier: low
  known_offset_error_px: 2.615
  known_offset_error_tol_px: 1.205
bodies: []
ring_system:
  geometry:
    center_v: 110.0
    center_u: 110.0
    opening_deg_obs: 90.0
    opening_deg_sun: 90.0
    node_deg: 0.0
  features:
    - name: MISPLACED
      kind: ringlet
      tau: 2.0
      width_px: 20.0
      navigable: true
      orbit: {a_px: 60.0, ae_px: 0.0, long_peri_deg: 0.0, rate_peri_deg_per_day: 0.0}
      orbit_error: {delta_a_px: 2.5}
      declared_orbit_sigma: {sigma_a_px: 2.5}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.13
offset_u: -1.37
offset_rotation_deg: 0.0
