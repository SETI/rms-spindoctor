schema_version: 2
scene_name: star_field_structured_loss
instrument: coiss_nac
size_v: 128
size_u: 128
random_seed: 7
exposure_sec: 1.0
# A clean multi-star field under modest structured telemetry loss: a few whole
# missing lines and a few truncated lines per frame.  A scattered loss knocks
# out a star only when a lost line crosses it; at this expected count the field keeps
# enough surviving stars for the pattern matcher's triplet geometry, so the star
# techniques recover the planted translation within tolerance.  The adversarial
# sibling biases the same expected count onto the star rows.
# The loss pattern is a stress axis, not a real form.  A real Cassini frame loses
# groups of whole lines when packets are lost on the way to the ground, and the
# ends of every second line when line pairs will not compress enough (the
# downlink_gaps and compression_truncated_lines modes draw those).  It does not
# lose scattered single lines, or lines cut at random columns.
# Stars deposit as point masses; an explicit navigator-matched PSF gives them a
# finite (floor-form) profile instead of a 1-pixel spike.
optics:
  psf:
    match_navigator: true
bodies: []
stars:
  - {name: F1, v: 30.5, u: 40.5, vmag: 6.2}
  - {name: F2, v: 80.5, u: 35.5, vmag: 6.8}
  - {name: F3, v: 55.5, u: 90.5, vmag: 6.5}
  - {name: F4, v: 95.5, u: 95.5, vmag: 7.2}
  - {name: F5, v: 40.5, u: 100.5, vmag: 7.0}
  - {name: F6, v: 100.5, u: 50.5, vmag: 6.7}
noise:
  poisson: true
  read_noise_dn: 4.0
artifacts:
  adversarial: false
  missing_lines:
    expected_events: 3.0
  partial_lines:
    expected_events: 3.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
