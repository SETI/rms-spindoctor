schema_version: 2
scene_name: disc_structured_loss_adversarial
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 7
exposure_sec: 1.0
# The adversarial sibling of disc_structured_loss: the same missing-line and
# partial-line expected counts, but with adversarial placement on, so the loss biases
# onto the disc's own rows rather than falling uniformly across the frame.  This
# is the worst-case placement of a survivable loss; the disc correlation
# still recovers the planted offset within tolerance because the surviving disc
# edge remains well-conditioned.
bodies:
  - name: RHEA
    center_v: 110.0
    center_u: 110.0
    axis1: 90.0
    axis2: 90.0
    axis3: 90.0
    illumination_angle: 25.0
    phase_angle: 30.0
noise:
  poisson: true
  read_noise_dn: 4.0
artifacts:
  adversarial: true
  missing_lines:
    expected_events: 3.0
  partial_lines:
    expected_events: 3.0
offset_v: 1.5
offset_u: -0.5
offset_rotation_deg: 0.0
