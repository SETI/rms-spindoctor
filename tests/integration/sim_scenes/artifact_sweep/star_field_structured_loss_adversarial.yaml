schema_version: 2
scene_name: star_field_structured_loss_adversarial
instrument: coiss_nac
size_v: 128
size_u: 128
random_seed: 7
exposure_sec: 1.0
# The adversarial sibling of star_field_structured_loss: the same missing-line
# and partial-line incidence, but with adversarial placement on, so the loss
# biases onto the star rows rather than the empty sky.  This is the worst-case
# placement of a survivable incidence; enough stars survive that the field
# matcher still recovers the planted translation within tolerance.
# Stars deposit as point masses; an explicit navigator-matched PSF gives them a
# finite (floor-form) profile instead of a 1-pixel spike.
optics:
  psf:
    match_navigator: true
bodies: []
stars:
  - {name: F1, v: 30.5, u: 40.5, vmag: 3.0}
  - {name: F2, v: 80.5, u: 35.5, vmag: 3.6}
  - {name: F3, v: 55.5, u: 90.5, vmag: 3.3}
  - {name: F4, v: 95.5, u: 95.5, vmag: 4.0}
  - {name: F5, v: 40.5, u: 100.5, vmag: 3.8}
  - {name: F6, v: 100.5, u: 50.5, vmag: 3.5}
noise:
  poisson: true
  read_noise_dn: 4.0
artifacts:
  adversarial: true
  missing_lines:
    incidence: 3.0
  partial_lines:
    incidence: 3.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
