schema_version: 2
scene_name: disc_structured_loss
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 7
exposure_sec: 1.0
# A well-resolved disc under modest structured telemetry loss: a few whole
# missing lines and a few truncated (partial) lines per frame, the shapes a
# downlink dropout plants.  At this expected count the loss is a small fraction of
# the 220-line frame, so the disc correlation still recovers the planted offset
# within tolerance -- the artifact stress axis at a survivable level.  The
# adversarial sibling plants the same expected count biased onto the disc.
bodies:
  - name: RHEA
    center_v: 110.0
    center_u: 110.0
    axis1: 90.0
    axis2: 90.0
    axis3: 90.0
    illumination_angle: 25.0
    phase_angle: 30.0
noise:
  poisson: true
  read_noise_dn: 4.0
artifacts:
  adversarial: false
  missing_lines:
    expected_events: 3.0
  partial_lines:
    expected_events: 3.0
offset_v: 1.5
offset_u: -0.5
offset_rotation_deg: 0.0
