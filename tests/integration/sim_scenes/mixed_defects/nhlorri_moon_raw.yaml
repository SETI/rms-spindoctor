schema_version: 2
scene_name: nhlorri_moon_raw
instrument: nhlorri
size_v: 1024
size_u: 1024
random_seed: 7
exposure_sec: 0.085
# A raw New Horizons LORRI frame of a moon at the full 1x1 frame, with the
# camera's whole raw chain and the defects of its raw (_eng) products.  It
# follows lor_0034849319_0x630_eng (Europa 197 px across at 28 deg phase, 5 ms,
# lossless, Jupiter flyby).
#
# instrument_defaults turns on the frame-transfer smear, the random row striping
# and amplifier ringing, and the bias structure.  The scene adds:
# - the embedded header: the first 34 pixels of row 0 are housekeeping in every
#   raw frame, as in lor_0034849319, whose row 0 holds housekeeping values as
#   high as 4,038 DN in its first 34 pixels and the 543 DN bias after them.  The
#   simulated header holds random values from 0 to 255, and the header key cannot
#   set their range;
# - the fixed pattern (vignetting, response pattern, jail bars, dust donuts),
#   which the raw product keeps;
# - radiation hits in the Jovian environment, 16 expected in the frame from the
#   catalog's estimate of about 16 per short exposure (188 per second over the
#   85 ms exposure; illustrative).
#
# The exposure runs 85 ms, 17 times the real frame's, because simulated
# brightness has no shared scale with real frames (#895), and normal_albedo, 0.925,
# makes the disc as bright as the real one: the brightest 1% of the disc reads
# 2,310 DN above the bias, and that of lor_0034849319 2,309 DN.  The middle third
# reads 2,070 DN, where the real one reads 1,801 DN, because the real Europa
# brightens toward its sunlit limb more than the lunar-Lambert law does.  Neither
# disc reaches the 4,095 DN top of the range; the brightest disc pixel reads
# 3,256 DN above the bias here and 2,446 DN on the real frame.
# The smear timings are set here instead of taken from the catalog, because the
# exposure stands in for the real 5 ms frame and only the share of each column's
# charge the smear carries can match it.  Against a per-row sky, the rows above
# the disc on lor_0034849319 carry 2.115e-3 of their column's charge and the rows
# below it 1.937e-3.  The camera collects light for its catalog's 0.63 ms beyond
# the exposure, so this frame collects for 85.63 ms, and each timing is that
# share times 1,024 rows times 85.63 ms: t_transfer_sec 0.1855 above the disc and
# t_scrub_sec 0.1698 below it.  They carry 2.113e-3 and 1.934e-3 of their
# column's charge, measured the same way.  The extra 0.63 ms is not scaled with
# the exposure: it is part of the camera, and a 10.7 ms stand-in would only make
# the disc 12% brighter while leaving those shares as set.  The radiation rate is
# scaled down by the exposure's factor to keep about 16 hits.
#
# The planted offset, 1.21 px, is the size of the image library's LORRI offsets
# (about 1.2 px each).  The roll is the camera's measured twist, +0.1912 deg,
# planted with roll fitting off as the camera ships.
#
# The fused answer lands 0.55 px off over 24 draws, toward the Sun, at medium
# tier, from the disc correlation and the limb fit together.  The disc correlation
# lands 0.64 to 0.65 px off on every draw without flagging it, and the limb fit 0.29
# to 0.30 px off; the Lambert template's bias on the lunar-Lambert body (#1110)
# sets most of those errors.  On a Lambert surface the fused answer landed 0.11 to
# 0.12 px off, the disc correlation 0.18 to 0.19 px off, with the smear removed too,
# and 0.004 to 0.022 px off without the roll, and the limb fit 0.25 to 0.32 px off,
# and 0.43 to 0.48 px without the roll, so the twist offsets part of its own error.
#
# BodyBlobNav lands 7.3 to 7.6 px off without flagging it (#975).  On a Lambert
# surface it landed 6.8 to 7.1 px off, and 0.16 to 0.19 px off without the smear,
# so the smear causes it.  Real raw frames
# carry the smear too, but the simulated smear is a step at each column's
# centroid where the real one builds up across the disc (#920).  The fixed
# pattern and the radiation hits are realistic, and on a Lambert surface each moved
# the fused answer by at most 0.01 px, so the scene shows the navigator unaffected
# by them.  The simulated header also moved it by at most 0.01 px, but its values
# reach only
# 255 DN where the real header reaches 4,038 DN, so the scene shows only that the
# navigator ignores this approximation of the header.
artifacts:
  instrument_defaults: true
  embedded_header: {probability: 1.0}
  fixed_pattern: {probability: 1.0}
  frame_transfer_smear: {probability: 1.0, t_scrub_sec: 0.1698, t_transfer_sec: 0.1855}
  radiation_transients: {expected_events_per_sec: 188.0}
bodies:
  - name: EUROPA
    center_v: 461.0
    center_u: 488.0
    semi_a_px: 98.5
    semi_b_px: 98.5
    semi_c_px: 98.5
    illumination_angle: 230.0
    phase_angle: 28.0
    normal_albedo: 0.925
offset_v: 0.77
offset_u: -0.94
offset_rotation_deg: 0.1912
expected:
  status: success
  # The body shades with the default lunar-Lambert law, and the navigator's
  # Lambert template pulls the answer toward the Sun (#1110).  The band holds the
  # fused error over the seeds, measured as sim_truth.py describes.
  known_offset_error_px: 0.551
  known_offset_error_tol_px: 0.052
