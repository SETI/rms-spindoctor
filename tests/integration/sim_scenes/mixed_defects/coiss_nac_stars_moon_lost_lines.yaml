schema_version: 2
scene_name: coiss_nac_stars_moon_lost_lines
instrument: coiss_nac
size_v: 1024
size_u: 1024
random_seed: 3
exposure_sec: 1.0
# A raw Cassini NAC frame of stars and a moon whose readout lost lines and whose
# pointing drifted during the exposure, over the camera's whole raw chain.
#
# The content follows the image library's stars_plus_body frame N1686349893
# (Iapetus 252 px across at 81 deg phase, eight stars of V 7.29 to 11.68).  The
# star magnitudes are that frame's; their positions were drawn at random off the
# disc.  The real frame ran 3.8 s through CL1+UV3; the scene sets no filter and
# runs 1.0 s, which keeps the disc below the full well (99th percentile 1,445 DN)
# and the stars at the camera's clear-filter brightness, closer to real stars
# than the simulator draws them through UV3 (#895).
#
# The lost lines follow two 12-bit lossless NAC frames of COISS_2023, read with
# their line prefixes, which give each line's valid samples.  N1526130404's
# readout window closed early: it lost its last 41 lines (983-1023) whole, and
# line 982 kept only its first 384 samples, which makes the index's
# MISSING_LINES 42.  The lines above them hold dark sky.  N1526044304 lost
# packets on the ground link (its label says "DSN gap truncation"): 43 whole
# lines in six groups spread down the frame, lines 311-315, 327-330, 338-348,
# 369-376, 473-480, and 816-822 (5, 4, 11, 8, 8, and 7 lines), across the bright
# planet.  The ISS User's Guide (section 3.6, "Truncated Images") gives both
# causes, and a third: a lossless line pair that will not compress 2:1 loses
# the end of its second line, so such a frame loses the ends of alternating lines.
#
# In the metadata indexes of COISS_2010, 2023, 2050, and 2068, 321 of the 5,489
# 12-bit NAC frames lost lines; all 321 are among the 5,473 lossless ones, and
# none of the 16 uncompressed ones lost any.  Read line by line, 195 of the 321
# lose lines at the bottom, 62 lose groups of whole lines inside the frame, and
# 61 lose the ends of alternating lines (some frames show two of these).  The 62
# frames lose a median of 1.5 groups each, 1 on half of them and up to 59; a
# group is 2 to 15 lines (10th to 90th percentile, median 5).
#
# The scene truncates the last 41 lines, as on N1526130404, and loses groups of
# whole lines with downlink_gaps, a Poisson-drawn number of them, 6 expected, as
# N1526044304 lost six.  The group sizes, the starts, and the losses on the line
# just above a group are the camera's measured defaults: a size is drawn
# log-normal about the census median of 5 lines, a group starts on any line, and
# 35% of the groups also lose the end of the line just above.  None of
# N1526044304's lines is partial, so the scene draws no compression-truncated
# lines.  The committed seed, 3, loses eight groups, lines 69-75, 218-224,
# 327-332, 421-438, 629-634, 648-653, 780-784, and 829-831 (7, 7, 6, 18, 6, 6,
# 5, and 3 lines), and lines 217 and 326 lose their ends.  Three of the groups
# cross the disc, 30 lines in all, as groups crossed the planet on N1526044304;
# groups cross the disc on 11 of the other 15 seeds too.  The truncated lines
# hold dark sky, as on N1526130404.
#
# The whole scene drifts 2.0 px during the exposure.  Measured streaks on real
# NAC frames run under 2 px on sequences predicted at 6 px, and about 0.6 times
# predictions of 4.5 to 8 px (#768).  The navigator's star model predicts
# unsmeared stars here, as it does on a real frame whose predicted smear is
# wrong.
#
# The planted offset, 30.3 px, lies just below the 90th percentile of the
# operator-verified NAC offsets in the image library (33.9 px), pointing up and
# left.  The roll is the camera's measured twist, +0.0115 deg, planted with roll
# fitting off as the camera ships.
#
# The fused answer lands 0.028 to 0.27 px off over 24 distinct draws, carried by
# the disc correlation (0.019 to 0.21 px off) and the star refinement (0.032 to
# 0.31 px).  The worst draw, 0.27 px, is random seed 808, which loses lines
# 278-291 across the brightest star, S1: StarUniqueMatchNav returns spurious and
# StarRefineNav lands 0.31 px off, at 0.57 times the fused sigma.  The tier is
# high on 6 of the 24 draws and medium on 18.  The high draws are the committed
# seed, its noise draws 505 and 808, and random seeds 505, 1212, and 1313, with
# a fused confidence of 0.88 to 0.93, against 0.79 to 0.85 on the rest.  On the
# committed seed the lost groups move the disc correlation from 0.026 to 0.16 px
# off, and the fused answer from 0.043 to 0.028 px.  On the committed seed and
# seeds 101 to 303, which land 0.028 to 0.088 px off, removing any one defect
# (the truncation, the lost groups, the smear, the hot pixels, or the cosmic
# rays) leaves the fused answer 0.028 to 0.088 px off.  The truncation is
# realistic but does not move the fused answer, so the scene shows the navigator
# unaffected by it.
#
# StarFieldFromCatalogNav returns spurious on every draw, which is #1146: the hot
# pixels and cosmic rays together crowd the stars out of the 30 sources it
# matches.  With both removed it navigates on the committed seed and seeds 101 to
# 303 (0.070 to 0.16 px off); with either one removed alone it stays spurious,
# except on seed 303 without the cosmic rays (0.048 px).  StarUniqueMatchNav
# returns spurious on 4 of the 24 draws: random seeds 808 and 1313 and noise
# seeds 505 and 808.  BodyBlobNav lands 3.3 to 15.7 px off the gibbous disc
# without flagging it (#975), and 4.1 to 8.5 px off with each defect removed in
# turn.  The lost groups move it: on the committed seed it lands 4.6 px off with
# them and 7.4 px off without.  sim_truth holds it to a band.
artifacts:
  instrument_defaults: true
  truncated_frame: {probability: 1.0, lines: 41, from: bottom}
  downlink_gaps: {expected_events: 6.0}
optics:
  smear:
    - {dv_px: 1.2, du_px: 1.6, object_class: all}
bodies:
  - name: IAPETUS
    center_v: 560.0
    center_u: 430.0
    semi_a_px: 126.0
    semi_b_px: 126.0
    semi_c_px: 126.0
    illumination_angle: 250.0
    phase_angle: 81.0
stars:
  - {name: S1, v: 313.10, u: 631.06, vmag: 7.29}
  - {name: S2, v: 499.64, u: 252.43, vmag: 9.11}
  - {name: S3, v: 451.70, u: 57.41, vmag: 10.0}
  - {name: S4, v: 271.37, u: 138.02, vmag: 10.6}
  - {name: S5, v: 324.39, u: 79.96, vmag: 10.88}
  - {name: S6, v: 564.20, u: 741.43, vmag: 11.29}
  - {name: S7, v: 802.35, u: 840.90, vmag: 11.56}
  - {name: S8, v: 119.53, u: 890.93, vmag: 11.68}
offset_v: -27.71
offset_u: -12.38
offset_rotation_deg: 0.0115
