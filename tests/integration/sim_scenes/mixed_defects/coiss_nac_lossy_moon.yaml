schema_version: 2
scene_name: coiss_nac_lossy_moon
instrument: coiss_nac
size_v: 1024
size_u: 1024
random_seed: 7
exposure_sec: 0.06
# A raw Cassini NAC frame of a moon, lossy-compressed after the 12-to-8-bit
# downlink table, over the camera's whole raw chain.  It follows N1488892945
# (Rhea, 143 px across at 29 deg phase, CL1+CL2, 100 ms, gain state 2,
# DATA_CONVERSION_TYPE TABLE, INST_CMPRS_TYPE LOSSY, compression ratio 52.8).
# In the metadata indexes of COISS_2010, 2023, 2050, and 2068, all 375 lossy NAC
# frames and all 255 lossy WAC frames are 8-bit: TABLE, except 52 NAC frames
# that are 8LSB.  Their labels give no count of
# lost lines (MISSING_LINES N/A), and N1488892945 has none, so the scene loses
# none.  instrument_defaults turns on shot, read, and readout-dark noise, hot
# pixels, cosmic rays, banding, bias structure, bloom, and the fitted PSF and
# distortion residual.
#
# The scene exposes for 60 ms, and normal_albedo, 0.722, makes the disc as bright
# as N1488892945's once the real frame's codes are decoded through the table: the
# brightest 1% of the disc reads 2,930 DN above the sky on both frames.  Neither
# disc fills the full well or reaches the table's top code; the brightest disc
# pixel reads 3,085 DN here and 3,082 DN on the real frame.  The middle third of
# the disc reads 2,010 DN, where the real one reads 2,600 DN, because the real
# Rhea brightens toward its sunlit limb less than the Lommel-Seeliger law does.
#
# The simulator's codec steps every DCT frequency alike, where the real one does
# not, so its step is illustrative.  The step is set by one figure, the contrast
# across block edges inside the disc divided by the contrast inside the blocks,
# aimed at the middle of three real lossy Rhea frames (N1488892945, N1489304826,
# and N1489436684), which show 1.51, 1.10, and 1.04, a mean of 1.22.  The figure
# depends on how much fine detail each disc carries, so the step follows all three
# frames and not N1488892945 alone.  A step of 80 DN gives 1.21 on the committed
# draw and 1.18 to 1.24 on noise draws 101, 404, and 808, and the disc without
# compression shows 0.85 to 0.89.  Steps of 64 and 96 DN give 1.15 and 1.37, and
# 128 DN gives 1.72, sharper than any of the real frames.  The step also zeroes more
# coefficients than the real codec does: 95% of the disc's AC coefficients fall
# below 5 DN, against 41 to 52% on those frames.
#
# The planted offset, 20.8 px, lies between the median and the 90th percentile
# of the operator-verified NAC offsets in the image library (15.9 and 33.9 px),
# pointing down and right.  The roll is the camera's measured twist,
# +0.0115 deg, planted with roll fitting off as the camera ships.
#
# The fused answer lands 0.48 to 0.49 px off over 16 distinct draws, toward the
# Sun, at medium tier on all of them: the scene seeds nothing but the noise, so its
# noise_seed draws repeat random_seed 101 to 808.  The disc correlation lands 0.55 px
# off and BodyLimbNav 0.26 to 0.30 px off, and the Lambert template's bias on the
# Lommel-Seeliger body (#1110) sets those errors.  The table and the compression
# are realistic but leave the answer where it is: on a Lambert surface the fused
# answer lands 0.043 to 0.054 px off, and on four draws 0.046 to 0.047 px off with
# the compression removed and 0.046 to 0.057 px off with the table removed.
artifacts:
  instrument_defaults: true
  compression_dct: {probability: 1.0, scale_factor: 80.0}
detector:
  filter: CL1+CL2
  quantization: sqrt_lut
bodies:
  - name: RHEA
    center_v: 470.0
    center_u: 560.0
    semi_a_px: 72.0
    semi_b_px: 72.0
    semi_c_px: 72.0
    illumination_angle: 70.0
    phase_angle: 29.0
    normal_albedo: 0.901
offset_v: 18.43
offset_u: 9.67
offset_rotation_deg: 0.0115
expected:
  status: success
  # The body shades with the default Lommel-Seeliger law, and the navigator's
  # Lambert template pulls the answer toward the Sun (#1110).  The band holds the
  # fused error over the seeds, measured as sim_truth.py describes.
  known_offset_error_px: 0.483
  known_offset_error_tol_px: 0.056
