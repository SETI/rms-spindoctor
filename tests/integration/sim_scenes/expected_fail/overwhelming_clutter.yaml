schema_version: 2
scene_name: overwhelming_clutter
instrument: coiss_nac
size_v: 200
size_u: 200
random_seed: 7
exposure_sec: 1.0
# A single navigable star drowned in confounders.  The lone catalog star is
# embedded in a background-sky field raised to comparable brightness
# (sky_counts a = -0.5) and crowded to density_factor 400 -- far past the
# breakdown density the lock_single_dense scene sits just below.  With comparable
# confounders packed into the one-star search window, the brightness-uniqueness
# gate can no longer single out the true star, so StarUniqueMatchNav returns a
# spurious result and the navigation fails.  This is the correct outcome: an
# overwhelmed field yields failure, not a confident lock onto a confounder.  The
# expected block asserts it through the sim expected-outcome machinery.
optics:
  psf:
    match_navigator: true
bodies: []
stars:
  - {name: N1, v: 100.5, u: 110.5, vmag: 3.0}
sky_counts:
  a: -0.5
  b: 0.34
  density_factor: 400.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
expected:
  status: failed
  confidence_tier: failed
  status_reason: all_techniques_spurious
