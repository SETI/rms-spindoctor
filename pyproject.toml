[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-spindoctor"
dynamic = ["version"]
description = "Navigation system for spacecraft imagery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "astropy>=6.0",
  "cspyce>=2.3.5",
  "elementpath>=5.0.4",
  "lxml>=6.0.4",
  "matplotlib",
  "numpy>=2.2.0",
  "PyQt6",
  "rms-cloud-tasks>=0.2.0",
  "rms-filecache>=3.0.0",
  "rms-imgdisp",
  "rms-julian>=3.0.1",
  "rms-pdslogger>=3.2.1",
  "rms-pdstable>=1.0.1",
  "rms-pdstemplate>=2.3.0",
  "rms-polymath>=2.1.0",
  "rms-psfmodel",
  "rms-oops>=0.1.5",
  "rms-starcat>=1.0.1",
  "ruamel.yaml",
  "scipy",
  "sqlalchemy>=2.0",
  "xmlschema>=4.1.0"
]
license = {text = "Apache-2.0"}
maintainers = [
  {name = "Robert S. French", email = "rfrench@seti.org"}
]
keywords = ["Voyager", "Galileo", "New Horizons", "Cassini", "image navigation", "spice"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows"
]

[project.optional-dependencies]
dev = [
  # The spelling gate's configuration below leans on behavior that is not
  # ancient: two builtin dictionaries at once, a custom dictionary that extends
  # rather than replaces them, a narrowed word pattern, and inline
  # `# codespell:ignore`.  Exercised with 2.4.3.
  "codespell>=2.4",
  "coverage",
  "mypy",
  "pyinstrument",
  "pymarkdownlnt>=0.9.35",
  "pytest",
  "pytest-cov",
  "pytest-profiling",
  "pytest-xdist",
  "ruff",
  # The Cassini ISS label tests read a VICAR label directly, which is the only
  # direct use of rms-vicar; the runtime reaches VICAR files through rms-oops.
  "rms-vicar>=1.2.1",
  "rms-spindoctor[docs]",
  "rms-spindoctor[postgres]",
  "threadpoolctl",
]
# Sphinx stack only. ``pip install -e ".[docs]"`` (ReadTheDocs: ``path: .`` +
# ``extra_requirements: [docs]``) installs these *plus* ``[project] dependencies``.
docs = [
  "myst-parser>=3.0.1",
  "sphinx>=7.4.7",
  "sphinxcontrib-mermaid>=0.9.2",
  "sphinx-rtd-theme>=2.0.0",
]
# PostgreSQL driver for the results index. A SQLite index needs nothing beyond
# the runtime dependencies; PostgreSQL is what a results index shared across
# machines runs on. The ``dev`` extra pulls this in so that the postgres test
# tier type-checks and runs from a development checkout; the tier still skips
# itself unless ``SPINDOCTOR_TEST_POSTGRES_URL`` names a server.
postgres = [
  "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://github.com/SETI/rms-spindoctor"
Documentation = "https://rms-spindoctor.readthedocs.io/en/latest"
Repository = "https://github.com/SETI/rms-spindoctor"
Source = "https://github.com/SETI/rms-spindoctor"
Issues = "https://github.com/SETI/rms-spindoctor/issues"

[tool.mypy]
strict = true
disallow_subclassing_any = false
exclude = ["^experiments/", "^build/"]
mypy_path = "src"
# Third-party science stack is largely untyped or stub-incomplete; per-module
# ``ignore_missing_imports`` below covers missing packages.

[[tool.mypy.overrides]]
module = "spindoctor._version"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "astropy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cspyce.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "imgdisp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "julian.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "oops.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdslogger.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdstable.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdstemplate.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psfmodel.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "starcat.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "threadpoolctl"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vicar.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-m", "not integration and not postgres"]
filterwarnings = [
  "error",
  # Astropy's FITS reader can leave a file handle open while the cache
  # owns the underlying path; the resulting unraisable exception is
  # outside our control.  Allow it through as a non-fatal warning.
  "default::pytest.PytestUnraisableExceptionWarning",
  # Astropy emits this on import when XDG_CONFIG_HOME is set but
  # ~/.astropy/config already exists (CI image state).  Benign env-var
  # precedence note; do not let it fail collection.
  "default:XDG_CONFIG_HOME is set to:UserWarning",
  # On Python 3.11, the opentelemetry -> google-cloud-storage import chain
  # (pulled in via filecache/pdslogger) hits importlib.metadata's deprecated
  # SelectableGroups dict interface and emits this DeprecationWarning at import
  # time.  It originates in third-party code and is absent on 3.12+; allow it
  # through so it cannot fail conftest collection.
  "default:SelectableGroups dict interface is deprecated:DeprecationWarning",
  # NumPy 2.5 deprecated setting ``arr.dtype`` in place; the rms-pdstable
  # dependency still does this when parsing fixed-width PDS3 index tables
  # (pdstable/__init__.py). It is outside our control, so allow it through as
  # a non-fatal warning until a pdstable release adopts ``arr.view(dtype)``.
  "default:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning",
]
markers = [
  "integration: requires PDS3_HOLDINGS_DIR (real holdings on disk or via filecache)",
  "postgres: requires a PostgreSQL server named by SPINDOCTOR_TEST_POSTGRES_URL",
  "slow: per-image library regression test",
]

[tool.codespell]
# Two dictionaries: the default typo list, and the British-to-American list that
# enforces `.cursor/rules/doc_python.mdc`'s spelling rule.
builtin = "clear,en-GB_to_en-US"
# The builtin British list carries a base word but not every inflection, so it
# catches `catalogue` and lets `catalogued` through.  `.codespell-dictionary.txt`
# adds the ones this tree actually uses, in codespell's `wrong->right` format --
# one pair per line, no comments or blanks, which that parser rejects.  The `-`
# is what keeps the builtins above: naming a dictionary without it replaces them
# rather than extending them, and it trails the filename because a value opening
# with `-` reads as another flag.
dictionary = ".codespell-dictionary.txt,-"
# Split on everything that is not an ASCII letter.  The default word pattern
# keeps hyphens and apostrophes, which hides two whole classes: a compound like
# `optical-centre` is one unknown token, and -- because this project's format
# uses single quotes -- so is every string literal, `'colour'` included.
regex = "[a-zA-Z]+"
# Generated JSON only.  A blanket `*.json` also hid hand-written prose that
# belongs in the gate -- the `rationale` fields in the Titan nominations
# manifest, the notes in the SPICE coverage and body-radii tables, and the
# metadata fixtures under the stats results tree.
skip = "*/.git/*,*/_build/*,*/venv/*,*.lock,*.png,*.fits,*.img,*.lbl,*/tests/integration/sim_baselines/*,*/tests/integration/baselines/*,*/tests/integration/realism_results/*,*/experiments/backplanes/*.json"
# Words the dictionaries flag that are right here.  Each is a term of art, an
# identifier, or a spelling both dictionaries accept -- not an exception granted
# to avoid a fix.
#   fom            figure of merit
#   precess*       orbital precession, not processing
#   trough         a ring trough is a feature, not a preposition
#   retuned        re-tuned, which is what the sentence means
#   commnt         the NAIF utility is spelled that way
#   uncorrect      a public method: the inverse of `correct`
#   disjointness   the set-theoretic property
#   unparseable    a spelling standard dictionaries accept
#   writeable      numpy spells its array flag that way
#   bu, nd, emiss  identifiers (a u-axis pair, `scipy.ndimage as nd`, emission)
#   dialogue       a conversation with the operator; the widget sense is
#                  already spelled `dialog` throughout the UI package
#   checkin        the SQLAlchemy pool event is named that
#   ser            a ring key: the single-edge ringlet the fixtures build
# The rest are fragments the word pattern above creates, not words anyone
# wrote -- it splits on every character that is not an ASCII letter:
#   mis            the prefix in `mis-lock`, `mis-convergence`, `mis-aligned`
#   ons            the tail of `follow-ons`
#   ue             the u-axis half of a pixel pair written `(ve, ue)`
#   atleast        the tail of `np.atleast_1d`
#   wasn           the head of `wasn't`
#   caf            the head of `cafe` written with its accent
ignore-words-list = "fom,precess,precessed,precesses,precessing,trough,retuned,commnt,uncorrect,disjointness,unparseable,bu,nd,emiss,dialogue,writeable,checkin,ser,mis,ons,ue,atleast,wasn,caf"

[tool.ruff]
src = ["src", "tests"]
extend-exclude = [
  "experiments",
]
line-length = 100

[tool.ruff.lint]
# Explicit rule set (recommended for library projects). Categories:
# E, W = pycodestyle errors/warnings; F = Pyflakes; I = isort; UP = pyupgrade;
# B = bugbear; SIM = simplify; C4 = comprehensions; A = builtins (no shadowing);
# N = pep8-naming; PT = pytest-style; RUF = Ruff-specific (e.g. unused noqa).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "A", "N", "PT", "RUF"]
# N802 - Function name should be lowercase.
# N803 - Argument name should be lowercase.
# N806 - Variable name should be lowercase.
# PT011 - pytest.raises is too broad.
# SIM105 - Use contextlib.suppress for suppressions.
# SIM108 - Use ternary operator for simple if/else.
extend-ignore = ["N802", "N803", "N806", "PT011", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Entry-point scripts add package to path before importing spindoctor
"src/spindoctor/cli/sd_*.py" = ["E402"]
# Sphinx reads ``copyright`` from conf by name (builtin shadowing is unavoidable).
"docs/conf.py" = ["A001"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
order-by-type = true

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spindoctor" = ["py.typed"]
"spindoctor.cli.pds4" = ["templates/**/*", "schemas/*"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/spindoctor/_version.py"

[project.scripts]
sd_offset = "spindoctor.cli.sd_offset:main"
sd_offset_cloud_tasks = "spindoctor.cli.sd_offset_cloud_tasks:main"
sd_consolidate_metadata = "spindoctor.cli.sd_consolidate_metadata:main"
sd_create_simulated_image = "spindoctor.cli.sd_create_simulated_image:main"
sd_backplanes = "spindoctor.cli.sd_backplanes:main"
sd_backplanes_cloud_tasks = "spindoctor.cli.sd_backplanes_cloud_tasks:main"
sd_backplane_viewer = "spindoctor.cli.sd_backplane_viewer:main"
sd_create_bundle = "spindoctor.cli.sd_create_bundle:main"
sd_create_bundle_cloud_tasks = "spindoctor.cli.sd_create_bundle_cloud_tasks:main"
sd_create_ck = "spindoctor.cli.sd_create_ck:main"
sd_mosaic = "spindoctor.cli.sd_mosaic:main"
sd_mosaic_rings = "spindoctor.cli.sd_mosaic:rings_main"
sd_mosaic_body = "spindoctor.cli.sd_mosaic:body_main"
sd_mosaic_cloud_tasks = "spindoctor.cli.sd_mosaic_cloud_tasks:main"
sd_mosaic_display = "spindoctor.cli.sd_mosaic_display:main"
sd_mosaic_display_rings = "spindoctor.cli.sd_mosaic_display:rings_main"
sd_mosaic_display_body = "spindoctor.cli.sd_mosaic_display:body_main"
sd_results_index = "spindoctor.cli.sd_results_index:main"
sd_results_index_cloud_tasks = "spindoctor.cli.sd_results_index_cloud_tasks:main"
sd_stats_report = "spindoctor.cli.sd_stats_report:main"
