# New Horizons LORRI, raw DN (sci) products.
#
# A value marked "published" comes from Cheng et al. 2008 (Space Science
# Reviews 140, 189-215), Weaver et al. 2020 (PASP 132, 035003), the New
# Horizons SOC-to-Instrument Pipeline ICD (SwRI 05310-SOCINST-01, PDS Small
# Bodies Node), or the PDS LORRI instrument overview.  A value marked
# "estimated" stands for a behavior those sources describe without a figure.
# Neither has been fitted to flight frames; a measured or fitted value says so,
# with the date and the frames.  The keys are described in the simulator
# chapter of the developer guide.
nhlorri:
  # Frames are raw DN, which is what the navigator block below expects.
  data_units: raw_dn

  navigator:
    section: newhorizons_lorri

  # A full frame binned by b is this size over b, which is how the realism match
  # tells a cohort frame's readout mode from its shape.
  native_frame_size_px: 1024

  psf:
    # The published in-flight FWHMs over 2.355 (Y 2.65 px, X 2.06 px, 1x1 mode;
    # Weaver et al. 2020), kept.  The cohort's two star frames are 4x4-binned; a
    # binned frame renders with this kernel rescaled to binned pixels, so those
    # frames test the 1x1 kernel only through the 4x4 rescaling.  Rendered that
    # way the core matches the cohort (EE50 0.50 vs 0.59 binned px) and the wing
    # is too weak (EE80 0.66 vs 1.23; #848).  Radii in native detector pixels.
    kernel: {sigma_v: 1.13, sigma_u: 0.87, w: 1.2e-2, r0: 2.0, n: 3.0}
    truncation_px: 16

  # The residual geometric distortion left after the navigator's distortion
  # model, from the star-field FOV distortion analysis: near its noise floor.
  distortion_residual: {k1: 8.13e-04, k2: -1.10e-03, nonradial_rms_px: 0.0}

  # Electrons a magnitude-0 star deposits per second.  Measured 2026-11-26 (#1213)
  # by aperture photometry of catalog stars at pointing refitted to each frame's
  # own stars, on sci frames of NHLALO_2001, NHJULO_2001, NHPCLO_2001, and
  # NHPELO_2001 (the library's two 4x4 frames among them), with the light
  # collected over the exposure plus extra_integration_sec.  Field stars of
  # Johnson V 10 to 14 (APASS) give, at B-V 0.65 and in total (the light within
  # 5 px at 1x1 or 3 px at 4x4, times its measured ratio to twice that radius,
  # 1.064 and 1.024):
  # - 1x1 at 21 e-/DN: 6.8e8 (173 stars on 27 frames of 0.05 to 0.97 s, 0.11 mag
  #   rms, 0.05 mag frame to frame).
  # - 4x4 at 19.4 e-/DN: 7.2e8 (444 stars on 65 frames of 0.03 to 10 s, 0.18 mag
  #   rms, 0.11 mag frame to frame).
  # The one value lies within 0.03 mag of both, and within 0.1 mag of the 3.6e7
  # DN/s at 1x1 of the navigator's own star photometry (#130).  Redder stars read
  # brighter, by 0.10 (1x1) to 0.23 (4x4) mag per magnitude of B-V; the simulator
  # draws every star at this one value.
  star_flux:
    e_per_s_vmag0: 7.0e+8

  # Plate scale from the published value, ~5 urad/px (1x1).
  sky_pixel_scale_arcsec: 1.023

  detector:
    detector_model: ccd
    # ADC-limited full well: the 4095 DN clip times the published 21 e-/DN.
    full_well_e: 86.0e+3
    exposure_ref_sec: 0.1  # estimated (a typical encounter exposure)
    # Published: a single gain state, ~21 e-/DN (1x1); 4x4 binning reads ~19.4.
    gain_e_per_dn_by_state: {0: 21.0}
    default_gain_state: 0
    read_noise_e: 23.0  # published (~1.1 DN)
    # Published: ~545 DN, which the pipeline estimates per image from the dark
    # columns.
    bias_dn: 545.0
    saturation_dn: 4095.0  # 12-bit ADC
    # The DN full scale of the vidicon chain, for a scene that selects it.
    full_well_dn: 4095.0
    signal_full_scale_frac: 0.5
    missing_data_rate: 0.0
    dark_current_e_per_sec: 0.04  # published (negligible dark current)
    # Measured 2026-11-25 on raw (_eng) frames: the camera collects light for
    # about 0.63 ms beyond the commanded exposure t.  Each row above or below a
    # bright source carries a share of its column's charge, the frame-transfer
    # smear.  On 14 unsaturated 1x1 frames of Io, Europa, Ganymede, and Callisto
    # at 3 to 16 ms, whose smear is 34 to 510 DN a row, the share follows
    # T / (1024 (t + d)) with the transfer time T fixed.  The fit gives T = 11.66 ms
    # and d = 0.63 ms, with residuals of at most 0.09 ms (0.04 ms rms), and
    # leaving out any one frame moves d within 0.61 to 0.64 ms.  Four Charon
    # frames at 100 and 150 ms carry only 2 to 5 DN of smear a row, so a sky
    # error of 0.1 DN moves them by 2% to 5%.  They read 1% to 3% above the fit,
    # and fitting them too gives d = 0.70 ms and T = 11.83 ms, so d lies
    # between 0.6 and 0.7 ms.  On three Europa pairs at 5 and 10 ms
    # (lor_0034849319 and _9322, lor_0034866659 and _6662, lor_0034732619 and
    # _2622) the smear in DN agrees within 0.4% while the exposure doubles, so the
    # transfer time is fixed and the extra time is in the collected light.  The
    # 10 ms frames, measured on their unsaturated edge columns and left out of
    # the fit, match it within 0.2%.  The pipeline's desmear times for short
    # exposures (SOC-to-Instrument Pipeline ICD, Table 9-4: 7.1, 8.75, 9.65, and
    # 10.5 ms at 1, 2, 3, and 6 ms) show the same effect; the fit predicts 7.16,
    # 8.87, 9.64, and 10.55 ms.
    extra_integration_sec: 6.3e-4
    # Kept at zero 2026-07-17: the realism match measured a 3.36e-4 per-frame
    # transient spike fraction (two 5 s frames), but both cohort frames are
    # 4x4-binned star fields and a binned faint star is indistinguishable from a
    # transient to the single-pixel spike detector -- the cohort has no
    # star-free frame to bound that contamination, so the measured rate is not
    # adoptable.  Unblocked by any non-star LORRI frame entering the library;
    # scenes can still plant the radiation_transients mode explicitly.
    cosmic_ray_events_per_pixel_per_sec: 0.0
    quantization: exact

  # The 4x4 binned mode reads about 19.4 e-/DN (published; 21 at 1x1).
  readout_modes:
    1: {}
    4: {gain_e_per_dn_by_state: {0: 19.4}}

  artifact_modes:
    offered:
      - missing_lines
      - dead_pixels
      - dead_columns
      - embedded_header
      - cutout_window
      - banding
      - bias_structure
      - readout_dark
      - radiation_transients
      - frame_transfer_smear
      - serial_tail
      - fixed_pattern
      - compression_dct
    # Why validation fails a scene that asks for one of these modes.  The PDS hot-
    # and dead-pixel maps are all zeroes.
    unavailable_reasons:
      hot_pixels: explicitly disabled for LORRI, which has none
      shutter_shading: not offered for LORRI, a frame-transfer camera with no shutter
      bloom: explicitly disabled for LORRI, an antiblooming CCD with no column bloom
    # The modes every frame of the camera shows, which a scene's
    # instrument_defaults turns on.
    instrument_defaults:
      # The defining LORRI artifact: vertical full-column pedestals through bright
      # targets, about 10% of the column at the nominal 100 ms exposure.
      frame_transfer_smear: {probability: 1.0}
      banding: {probability: 1.0}
      bias_structure: {probability: 1.0}
    # Per-mode shape defaults, published or estimated like the detector values.
    shape_defaults:
      # Measured 2026-11-25 on the 14 frames fitted at extra_integration_sec: the
      # two frame transfers average 11.66 ms.  On those frames the rows above a
      # source (small line numbers) carry 1.090 to 1.093 times the share of the
      # rows below, and on the four faint Charon frames 1.088 to 1.096.  That is
      # the ratio of Cheng et al. 2008 (section 3.3.5: 1.044 and 0.956 of the
      # mean), which splits the mean into 12.17 ms above and 11.15 ms below.  The
      # simulator draws t_transfer_sec above the source, so the entry gives it the
      # larger time, although Cheng et al. attribute the larger time to the scrub.
      # The ICD's desmear time for nominal exposures, 10.7 ms, lies below the
      # 11.6 ms the fit gives at 100 ms, for a reason not known.
      frame_transfer_smear: {t_scrub_sec: 0.01115, t_transfer_sec: 0.01217}
      # Saturated compact sources undershoot up to ~12 DN along readout.
      serial_tail: {amplitude_dn: 12.0, length_px: 8, direction: right}
      # Published (Weaver et al. 2020): random horizontal striping of at most 1 DN
      # that moves from frame to frame.  Each row takes its own offset, uniform
      # within 21 e- (1 DN at the 1x1 gain) of zero; the uniform spread is
      # estimated.  Published (Cheng et al. 2008): amplifier ringing gives vertical
      # banding near the low column numbers, at most ~0.8 DN peak to trough, the
      # same in every frame, since it survives the average that makes the
      # pipeline's bias frame.  Its period (103 native columns) and its decay (71
      # native columns to fall by a factor of e) are estimated from that bias frame
      # as Weaver et al. 2020 show it (Figure 8): a damped sine starting at column 0
      # fits the figure's column profile to 0.02 DN.  The figure's first swing reads
      # about 1.05 DN; the envelope of 15.8 e- gives the wave the published 0.8 DN
      # first swing at the 1x1 gain.
      banding:
        amplitude: 21.0
        orientation: horizontal
        horizontal_pattern: random
        ringing_amplitude: 15.8
        ringing_period_px: 103.0
        ringing_decay_px: 71.0
      bias_structure: {pedestal_sigma_dn: 1.0, row_gradient_dn: 0.5, col_gradient_dn: 0.5}
      # ~4% corner vignetting, 0.9% PRNU, <=0.5 DN even/odd jail bars, ~1% dust
      # donuts.
      fixed_pattern:
        vignetting_frac: 0.04
        prnu_rms: 0.009
        jail_bar_dn: 0.5
        dust_donut_count: 3
      # ~16 hits per readout-dominated short exposure; mostly single px.  A scene
      # plants the hits as a rate, with expected_events_per_sec.
      radiation_transients: {amplitude_e: 8.6e+4}
      # The first 34 pixels of row 0 of every image are binary housekeeping, never
      # scene data (SOC-to-Instrument Pipeline ICD).
      embedded_header: {header_px: 34}

  # The image library's sci frames are matched against this instrument by the
  # realism match.
  realism_cohort:
    - {mission: NHLORRI, camera: LORRI}
