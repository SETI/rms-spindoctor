# Galileo SSI, raw DN (REDR) products.
#
# A value marked "published" comes from Belton et al. 1992 (Space Science
# Reviews 60, 413-455), the Galileo SSI Calibration Report Part 2 (Klaasen,
# JPL D-5880, 1993), or the SSI REDR Software Interface Specification (PDS).  A
# value marked "estimated" stands for a behavior those sources describe without
# a figure.  Neither has been fitted to flight frames; a measured or fitted
# value says so, with the date and the frames.  The keys are described in the
# simulator chapter of the developer guide.
gossi:
  # Frames are raw DN, which is what the navigator block below expects.
  data_units: raw_dn

  navigator:
    section: galileo_ssi

  # A full frame binned by b is this size over b, which is how the realism match
  # tells a cohort frame's readout mode from its shape.
  native_frame_size_px: 800

  psf:
    # The published core sigma, kept: the Galileo cohort holds no star frames
    # (negative cases only), so there is no independent PSF evidence; sim
    # accuracy is bounded by unverified PSF fidelity until the
    # star-calibration frames land.  Radii in native detector pixels.
    kernel: {sigma_v: 0.80, sigma_u: 0.80, w: 1.2e-2, r0: 2.0, n: 3.0}
    truncation_px: 16

  # The residual geometric distortion left after the navigator's distortion
  # model, from the star-field FOV distortion analysis: a pincushion term
  # reaching ~0.5 px at the corner.
  distortion_residual: {k1: -3.47e-04, k2: 1.72e-03, nonradial_rms_px: 0.0}

  # Electrons a magnitude-0 star deposits per second.  Estimated: sized so a star
  # at the camera's published limiting magnitude reaches SNR ~5, near the
  # matched-filter detection boundary.
  star_flux:
    e_per_s_vmag0: 4.0e+6

  # Plate scale from the published value, ~10.2 urad/px.
  sky_pixel_scale_arcsec: 2.095

  detector:
    detector_model: ccd
    full_well_e: 108.0e+3  # published (~108k e-; 432k summed)
    exposure_ref_sec: 0.2  # estimated (a typical science exposure)
    # Published gain states ~1822/377/187/39 e-/DN; state 2 is the common
    # science state.
    gain_e_per_dn_by_state: {0: 1822.0, 1: 377.0, 2: 187.0, 3: 39.0}
    default_gain_state: 2
    read_noise_e: 31.0  # published (full resolution; 44 e- in summation mode)
    bias_dn: 20.0
    saturation_dn: 255.0  # 8-bit ADC
    # The DN full scale of the vidicon chain, for a scene that selects it.
    full_well_dn: 255.0
    signal_full_scale_frac: 0.5
    missing_data_rate: 0.0
    dark_current_e_per_sec: 10.0  # estimated (dark spikes from RTG neutrons)
    # Fitted 2026-11-06 in closed loop against the cohort's transient spikes
    # (all negative cases, so no scene point sources contaminate the split):
    # 57-129 per 800x800 frame at 50-100 ms, peaking at 33/58/150 DN
    # (10th/50th/90th percentile).  Rendered dark frames flag 91 at 33/51/127
    # DN, with a saturated fraction of 3e-6 (the cohort's 1.3e-5 includes its
    # scenes); the earlier full-well deposits pushed it to 2.3e-4.  The count
    # barely moves with exposure, so the hits arrive during the readout: the
    # dwell is half the 8 2/3 s full-frame readout.
    cosmic_ray_events_per_pixel_per_sec: 2.0e-5
    cosmic_ray_readout_dwell_sec: 4.33
    cosmic_ray_amplitude_e: 6000.0
    cosmic_ray_spread_px: 0.4
    # The 8-bit ADC contours worst at DN multiples of 8, which a scene gets from the
    # contour_8bit quantization at its default step.
    quantization: exact

  # The 2x2 summation mode reads 44 e- (published; 31 e- at full resolution).
  readout_modes:
    1: {}
    2: {read_noise_e: 44.0}

  artifact_modes:
    offered:
      - missing_lines
      - alternating_lines
      - edited_frame
      - truncated_frame
      - missing_blocks
      - line_garble
      - dead_pixels
      - dead_columns
      - truth_window
      - cutout_window
      - hot_pixels
      - banding
      - bias_structure
      - readout_dark
      - shutter_shading
      - bloom
      - radiation_transients
      - fixed_pattern
      - compression_dct
    # The modes every frame of the camera shows, which a scene's
    # instrument_defaults turns on.
    instrument_defaults:
      # Fitted 2026-11-23 with the hot-pixel charge in the shape defaults below,
      # from the 60 2/3 s frames described there.
      hot_pixels: {pixel_fraction: 9.0e-5}
      banding: {probability: 1.0}
      bias_structure: {probability: 1.0}
      bloom: {probability: 1.0}
    # Per-mode shape defaults, published or estimated like the detector values.
    shape_defaults:
      # Fitted 2026-11-23 on raw frames at the 10K gain state (39 e-/DN), with
      # recurring spikes taken as hot pixels:
      # - Nine dark frames of zero exposure in the 60 2/3 s frame mode, the mode of
      #   most of the image-library frames (GO_0002 1990-11-28 and 1990-11-30, GO_0006
      #   1990-12-17): 8 pixels of 640,000 hold 300 e- or more, 2 hold 500 e-, and 1
      #   holds 1,000 e-, an exponential population of fraction 9e-5 and mean 150 e-.
      # - 47 dark-sky frames in the 8 2/3 s mode at exposures from 0.1 to 0.8 s
      #   (GO_0007 and GO_0008, 1992-12-03): the same counts at every exposure (435
      #   pixels at 300 e- or more, 89 at 500 e-, 6 at 1,000 e-), so the charge
      #   does not come from the exposure.  Its mean is about 150 e- too.
      #   That is readout_e.  A dark rate at relative amplitude 1 above 8 e-/s would
      #   have raised the 500 e- count by a tenth from 0.1 to 0.8 s, so the rate is
      #   set to zero.  These frames hold 50 times the 60 2/3 s mode's hot pixels.
      # - Longer exposures use the extended-exposure mode, whose longer frame cycle
      #   the simulator does not model, so they are not used.
      # - The rows read after a hot pixel carry a flat streak of 1.15% of its charge
      #   per row (the 8 2/3 s frames), and the rows read before it none.  That is
      #   streak_e.  The pixel to the right of a strong hot pixel also holds up to a
      #   tenth of its charge, a trail along the row that is left out.
      hot_pixels: {rate_e_per_sec: 0.0, readout_e: 150.0, streak_e: 1.7}
      # Published: vertical bands every 42 px from the 2400 Hz supply (~0.35 DN raw
      # at gain state 2, ~65 e-).  In high gain the camera also shows a horizontal
      # component below 8 Hz, which a scene adds with orientation both.
      banding: {amplitude: 65.0, period_px: 42.0, orientation: vertical}
      # The row gradient is an estimated amplitude of the published left-to-right
      # shading ramp that summation mode adds.
      bias_structure: {pedestal_sigma_dn: 1.0, row_gradient_dn: 1.0, col_gradient_dn: 0.5}
      # Shutter line-dependent exposure offset (~1.5 -> ~1.05 ms, line 1->800).
      shutter_shading: {top_factor: 1.5, bottom_factor: 1.05}
      # Estimated (early-blooming columns).
      bloom: {bloom_length: 6}
      # Ganymede-distance regime: ~1e4 spikes/frame scale in the readout,
      # amplitudes few DN steeply falling (near full well at the top).  A scene
      # plants the hits as a rate, with expected_events_per_sec.
      radiation_transients: {amplitude_e: 4.0e+4}
      # 33-px photolithography stitch comb plus corner vignetting.
      fixed_pattern:
        stitch_period_px: 33
        stitch_amplitude_dn: 1.0
        vignetting_frac: 0.03
        dust_donut_count: 4
      # The HMA and HCA telemetry formats decimate vertically, with valid data on
      # every 2nd or every 4th line only, so the periodic-line default is 'keep'.
      alternating_lines: {mode: keep}
      # ICT/Huffman slice loss zero-fills bands exactly 8 lines tall: each packet
      # is an 8-line slice of 8x8 blocks (SSI REDR Software Interface
      # Specification).
      missing_blocks: {block_lines: 8}
      # One 96x96 losslessly coded square with visibly cleaner texture than the
      # ICT remainder (SSI REDR Software Interface Specification).
      truth_window: {size: 96}

  # The image library's REDR frames are matched against this instrument by the
  # realism match.
  realism_cohort:
    - {mission: GOSSI, camera: SSI}
