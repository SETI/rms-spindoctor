# The Cassini ISS cameras: the narrow-angle and wide-angle cameras, each as raw DN
# products and as calibrated (CALIB, I/F) products.  Each top-level key is one
# simulated instrument.

# Cassini ISS narrow-angle camera, raw DN products.
#
# A value marked "published" comes from Porco et al. 2004 (Space Science
# Reviews 115, 363-497), the ISS Data User's Guide (Knowles 2018, PDS Imaging
# Node), or West et al. 2010 (Planetary and Space Science 58, 1475-1488).  A
# value marked "estimated" stands for a behavior those sources describe without
# a figure.  Neither has been fitted to flight frames; a measured or fitted
# value says so, with the date and the frames.  The keys are described in the
# simulator chapter of the developer guide.
coiss_nac:
  # Frames are raw DN, which is what the navigator block below expects.
  data_units: raw_dn

  navigator:
    section: cassini_iss
    detector: nac

  # A full frame binned by b is this size over b, which is how the realism match
  # tells a cohort frame's readout mode from its shape.
  native_frame_size_px: 1024

  psf:
    # TUNED 2026-07-17 by the realism match against the Cassini CALIB
    # image-library cohort (brightest unsaturated stars over the 11 contributing
    # NAC star frames): cohort encircled-energy radii EE50 = 0.91 px, EE80 = 1.79
    # px; these parameters reproduce EE50/EE80 = 0.90/1.72 px through the same
    # estimator.  The EE80/EE50 ratio (1.97 vs 1.52 for a pure Gaussian) requires
    # substantial mid-range wing energy, so this is an *effective* in-window
    # kernel: the fitted w = 0.12 carries the measured 1-8 px halo energy that
    # the earlier core (sigma 0.55 from the published FWHM over 2.355, w 0.025)
    # put nowhere.  A first fit at w = 0.20 matched the encircled energy but
    # measurably over-lifted the wide-field halo (sky-patch means and
    # mid-size-body limb widths); w = 0.12 with the softer core matches the stars
    # without that excess.  The far halo beyond the truncation window remains
    # stray-light scope.  Radii in native detector pixels; the wing parameters are
    # an energy fraction, so the kernel conserves flux.
    kernel: {sigma_v: 0.70, sigma_u: 0.70, w: 0.12, r0: 3.0, n: 4.0}
    # Cassini's documented long wings get a wider window than the generic 16 px;
    # the far halo beyond the window is stray-light scope, not kernel scope.
    truncation_px: 32

  # The residual geometric distortion left after the navigator applies the
  # camera's known distortion model: a radial polynomial in the normalized field
  # radius (k1 on rho^2, k2 on rho^4) plus a non-radial wander RMS, measured by
  # the star-field FOV distortion analysis.  The corrected field is sub-pixel and
  # close to radially symmetric.
  distortion_residual: {k1: 3.17e-04, k2: -3.51e-04, nonradial_rms_px: 0.0}

  # Electrons a magnitude-0 star deposits per second.  Estimated: sized so a star
  # at the camera's published clear-filter limiting magnitude reaches SNR ~5,
  # near the matched-filter detection boundary at the camera's read noise and PSF
  # core.
  star_flux:
    e_per_s_vmag0: 1.0e+7

  # Plate scale from the published value, ~6 urad/px.
  sky_pixel_scale_arcsec: 1.237

  detector:
    detector_model: ccd
    # Published: full well ~110k e- (saturates ~3600 DN at gain state 2, below
    # the 4095 ADC clip).
    full_well_e: 110.0e+3
    # Estimated: a typical NAC science exposure, so a converted scene at this
    # exposure keeps its brightness scale.
    exposure_ref_sec: 1.0
    # Published gain states ~233/95/30/13 e-/DN; state 2 is the standard science
    # state of the Saturn tour.
    gain_e_per_dn_by_state: {0: 233.0, 1: 95.0, 2: 30.0, 3: 13.0}
    default_gain_state: 2
    read_noise_e: 12.0  # published (~12 e-)
    bias_dn: 20.0
    saturation_dn: 4095.0  # 12-bit ADC
    # The DN full scale of the vidicon chain, for a scene that selects it.
    full_well_dn: 4095.0
    signal_full_scale_frac: 0.5
    missing_data_rate: 0.0
    dark_current_e_per_sec: 5.0  # estimated (dark dominated by residual bulk image)
    # Fitted 2026-11-06 in closed loop: dark raw NAC frames rendered at the
    # cohort's exposures and run through the FOM 6 spike detector match the
    # 12-bit dark-sky cohort frames.  Those frames flag about 120-270 spikes per
    # megapixel at every exposure from 60 ms to 2.6 s and 650 at 18 s, so most
    # hits arrive while the frame waits to be read (6 s of dwell); the spikes
    # peak at a median 800-1,300 e- over 4-8 pixels, so the deposits are modest
    # and diffused, not full-well points.  The simulated amplitude tail is
    # shorter (90th percentile ~1,800 e- against 4,000-7,000 e- real).  At gain
    # state 3 the sim flags 4-6x the two real frames, whose stronger line noise
    # raises the detector's threshold.
    cosmic_ray_events_per_pixel_per_sec: 2.0e-5
    cosmic_ray_readout_dwell_sec: 6.0
    cosmic_ray_amplitude_e: 1000.0
    cosmic_ray_spread_px: 0.6
    quantization: exact

  # The downlink tables the sqrt_lut quantization decodes through.  The camera has
  # one: the 12-to-8-bit table (DATA_CONVERSION_TYPE TABLE), which the NAC and WAC
  # share.  Measured 2026-11-06 from the 26 TABLE frames of the CALIB cohort: the
  # calibrated DN-equivalent step between consecutive raw codes is an integer that
  # grows by one about every ten codes (3 near code 10, 5 near 25, 8 near 55, 13
  # near 100, 24 near 200), which round(2 * code + 0.055 * code**2) reproduces,
  # alternations included, and which tops out at 4086 DN at code 255.
  downlink_tables:
    default: table_12_to_8
    tables:
      table_12_to_8: {codes: 256, linear_dn: 2.0, quadratic_dn: 0.055, whole_dn: true}

  # SUM2 and SUM4 summation modes, on-chip; the sources give no separate read
  # noise, gain, or well for them, so each inherits the 1x1 values.
  readout_modes:
    1: {}
    2: {}
    4: {}

  # Electrons per second per native pixel at I/F 1.0, by filter combination.
  #
  # Measured 2026-11-06 from Cassini ISS raw/CALIB pairs.  CISSCAL writes the
  # conversion it applied into every CALIB label (RADIOMETRIC_CORRECTION_TEXT:
  # an efficiency factor and an absolute correction factor per filter
  # combination), and the camera constant comes from fitting raw DN against
  # CALIB I/F on the bright pixels of 12-bit frames, converted to electrons by
  # the label's GAIN_CORRECTION, divided by the exposure less EXPOSURE_OFFSET
  # and by the summation factor.  The fits put the constant at 16,800 e-/s per
  # I/F per unit efficiency for the NAC (31 frames, scatter about 15%) and
  # 193,000 for the WAC (16 frames), a ratio of 11.5 that the cameras' apertures
  # and pixel solid angles predict to within 30%.
  #
  # An entry tagged 'measured' is the median of two or more 12-bit pair fits for
  # that combination; every other entry is the camera constant times the label's
  # efficiency and absolute correction.  Two measured filters depart from that
  # model by more than the fit scatter: UV3 (0.32x, two frames at two gains) and
  # IR3 (0.74x, three frames).  The 8-bit TABLE frames are excluded: their LUT
  # encoding breaks the linear raw/CALIB fit.
  filters:
    throughput_e_per_s_per_if:
      BL1+CL2: 110000.0
      BL1+GRN: 5750.0
      CL1+BL2: 24700.0
      CL1+CB1: 62300.0
      CL1+CB2: 31300.0
      CL1+CB3: 6380.0
      CL1+CL2: 1450000.0  # measured, 9 frames
      CL1+GRN: 413000.0  # measured, 8 frames
      CL1+IR1: 471000.0  # measured, 2 frames
      CL1+IR3: 65300.0  # measured, 3 frames
      CL1+MT1: 11000.0
      CL1+MT2: 13400.0
      CL1+MT3: 13900.0
      CL1+UV3: 19600.0  # measured, 2 frames
      HAL+CL2: 28700.0
      IR2+CL2: 167000.0
      IR2+IR1: 56400.0
      IR2+IR3: 51400.0
      IR4+CL2: 11800.0
      IR4+IR3: 9630.0
      RED+CL2: 445000.0
      RED+GRN: 141000.0
      RED+IR1: 141000.0
      UV1+CL2: 13100.0
      UV2+CL2: 20800.0
      UV2+UV3: 6700.0
    # The combination the star zero point refers to: it is sized from the
    # published clear-filter limiting magnitude.
    clear: CL1+CL2
    # CISSCAL gives the polarizers the efficiency of the clear element they
    # replace, so the real products carry the same DN-to-I/F scale with or
    # without a polarizer; each folds onto that clear element.  The NAC
    # polarizers sit in wheel 1.
    polarizer_clear: {P0: CL1, P60: CL1, P120: CL1, IRP0: CL1}
    # System transmission against wavelength for every combination above, from the
    # CISSCAL calibration tables (see util/passbands/build_passbands.py).
    passbands: coiss_nac

  artifact_modes:
    offered:
      - missing_lines
      - partial_lines
      - alternating_lines
      - compression_truncated_lines
      - truncated_frame
      - missing_blocks
      - downlink_gaps
      - dead_pixels
      - dead_columns
      - hot_pixels
      - banding
      - bias_structure
      - readout_dark
      - shutter_shading
      - bloom
      - radiation_transients
      - bright_dark_pairs
      - fixed_pattern
      - compression_dct
    # The modes every frame of the camera shows, which a scene's
    # instrument_defaults turns on.
    instrument_defaults:
      # Fitted 2026-11-23 with the hot-pixel law in the shape defaults below, from
      # the dark frames described there: the fraction of pixels hotter than 1 e-/s
      # in 2008.  The published 0.15% of pixels in 2004, growing to ~0.28% by
      # 2008-2009, counts the pixels hotter than about 4 e-/s, as the dark frames do:
      # 2.8e-3 of them in 2008.
      hot_pixels: {pixel_fraction: 1.0e-2}
      banding: {probability: 1.0}
      readout_dark: {probability: 1.0}
      bias_structure: {probability: 1.0}
      bloom: {probability: 1.0}
    # Per-mode shape defaults, published or estimated like the detector values.
    # An activation key is never cataloged: a mode activates only when a scene
    # sets it.  Shapes here are the values a scene inherits when it sets a mode
    # without spelling out every parameter.
    shape_defaults:
      # Fitted 2026-11-23 on raw 12-bit full-frame dark frames (shutter disabled),
      # median-stacked over the 5-7 frames at each exposure of 0, 10, 32, 100, 320,
      # 560, and 1200 s, in four series: COISS_2019 (2006-005), COISS_2041
      # (2008-021), COISS_2069 (2011-182), and COISS_2114 (2017-171).
      # - A hot pixel's charge grows in proportion to the exposure from 10 to 1200 s,
      #   to within 3%.  A frame of zero exposure holds the charge of 0.09 s more
      #   (0.083-0.091 s over the four series), which is readout_sec.
      # - The rates follow a truncated power law.  Fitted on the COISS_2041 frames
      #   (2008-021), with each rate read from the shortest exposure that holds it
      #   10 sigma above the stack noise (30 e-/DN, 13 at gain state 3): 1.0e-2 of
      #   the pixels are hotter than 1 e-/s (rate_e_per_sec, the law's lower rate),
      #   and the count hotter than x falls as x^-0.94 up to 1,100 e-/s, where it
      #   ends (amplitude_max, 1,100 times the lower rate).  The fit is within 15% of
      #   the real counts from 1 to 200 e-/s, and within 45% from there to 1,000
      #   e-/s, where the counts are 30 pixels or fewer.
      # - The population grows over the mission: 7.6e-3 of the pixels are hotter
      #   than 1 e-/s in 2006, 1.8e-2 in 2011, and 2.3e-2 in 2017, at about the same
      #   index (0.94-1.01), and the cutoff rises to 2,000-5,000 e-/s.
      # - The rows read after a hot pixel carry a flat streak: each packet passing
      #   through it picks up 0.0146 s of its dark rate, the same at every exposure,
      #   which is streak_sec.  The rows read before it carry none.
      # - Rows one to three after a hot pixel also carry a short trail that grows
      #   about as the square root of the pixel's charge: 2.5% of the charge on the
      #   first row at 1,000 e- and 0.4% at 70,000 e-.  It is left out.
      hot_pixels:
        amplitude_law: power_law
        amplitude_index: 0.94
        amplitude_max: 1100.0
        rate_e_per_sec: 1.0
        readout_sec: 0.09
        streak_sec: 0.0146
      # Published: ~30 e- horizontal bands (2.1 and 2.5 Hz beating).  The period is
      # estimated; the line readout rate sets it.
      banding: {amplitude: 30.0, period_px: 64.0, orientation: horizontal}
      # Estimated: per-image pedestal jitter plus readout-direction gradients.
      bias_structure: {pedestal_sigma_dn: 2.0, row_gradient_dn: 1.0, col_gradient_dn: 0.5}
      # Measured 2026-11-06: the dark sky of 12-bit full-frame raw NAC frames rises
      # linearly from the first line to the last by a median 55 e- (1.8 DN at gain
      # state 2 over 21 frames, 4.0 DN at gain state 3 over 3), the same from 60 ms
      # to 2.6 s, so it accumulates during the readout, not the exposure.
      # CISSCAL's dark model subtracts it from the CALIB product; its shot noise
      # stays.
      readout_dark: {amplitude: 55.0}
      # Estimated (no antiblooming; column bleed above the well).
      bloom: {bloom_length: 4}
      # Anti-blooming vertical 2-px pairs in unsummed long exposures.
      bright_dark_pairs: {amplitude_e: 4.0e+3}
      # No published ISS rate; the interplanetary regime near full-well amp.
      radiation_transients: {amplitude_e: 4.0e+4}
      # Dust donuts (<1% each) accumulating over the mission.
      fixed_pattern: {dust_donut_count: 5}
      # The lossless compressor (ISS User's Guide sections 2.3 and 3.6; Calibration
      # Report section 5.5.2): block-adaptive Rice coding (Rice and Lee, JPL
      # Publication 83-17) of horizontal first differences of the 12-bit DN, packed
      # in 16-bit words, with at most one uncompressed line's bits for each pair of
      # lines; the end of the pair's second line is dropped where the pair does not
      # fit.  The 16-sample blocks, the 4 option bits, and the options 0 to 13 are
      # the model that reproduces the real cuts: on the 61 NAC frames and the one
      # WAC frame of the census below that lose the ends of alternating lines, 14,038
      # cut pairs code to 0.970 to 1.009 of the budget (99.9th percentile range) and
      # 5,245 whole pairs to at most 1.017 of it (util/coiss_line_loss).
      compression_truncated_lines: {block_samples: 16, word_bits: 16, id_bits: 4, max_split: 13}
      # Measured 2026-11-24 from the binary line prefixes, which give each line's
      # valid samples, of every lossless 12-bit NAC frame with lost lines in the
      # current metadata indexes of COISS_2010, 2023, 2050, and 2068: 321 frames,
      # 233 full and 88 summed 2x2.  No 12-bit uncompressed frame lost lines.  The
      # tables are at the 0, 5, 10, 25, 50, 75, 90, 95, 99, and 100th percentiles,
      # measured on the 260 frames whose line ends the compressor did not cut, where
      # 61 frames (39 full, 22 summed) lose 373 groups of whole lines inside the
      # frame (util/coiss_line_loss/gap_census.py).  Size and gap tables spread each
      # measured integer over its rounding interval, so a rounded draw gives each
      # integer its measured share.  One-line groups are 2.1% of the full-frame
      # groups, under the table's first 5%, so its 0th percentile is raised to 1.38,
      # where the logarithmic draw gives them that share.
      # - Sizes are in lines of their own frame: 192 groups on full frames, and 181
      #   on summed frames for the summed table.  145 of the summed groups come from
      #   13 frames of one 2008 sequence (N1606722214 to N1606787565); summed groups
      #   differ from full ones with or without it.  None of the 321 frames is
      #   summed 4x4, so 4x4 frames take the 2x2 table.
      # - A frame loses a mean 6.1 groups (variance 127): one on 49% of the frames,
      #   16 at the 90th percentile, and up to 59.  The count, the clustering, and
      #   the partial-line rates pool full and summed frames.  With them, every
      #   statistic of the full frames lies inside its 90% resampling interval; the
      #   summed frames miss on their gaps and head lines, but the 2008 sequence
      #   above holds 145 of their 181 groups and 132 of their 159 gaps, so they
      #   hold too few independent sequences for a law of their own.
      # - Groups cluster.  The gap table is the kept lines between neighboring
      #   groups 20 lines apart or less (241 of the 312 gaps).  cluster_probability
      #   is fitted so that simulated frames match the gaps' quartiles and 90th
      #   percentile and the quartiles of the share of the height that the groups
      #   of a frame span (0.14, 0.56, and 0.84), and the count law so that the
      #   simulated count has the measured mean and share of frames with one group
      #   after a crowded frame loses the groups that do not fit
      #   (util/coiss_line_loss/gap_fit.py).
      # - Of the lines just above one group, 36.6% lose their end, and of those just
      #   below, 12.7%.  Of the 51 single kept lines between two groups, 23 (45%)
      #   lost their end, as two independent draws predict, so a frame shows 38% of
      #   its groups with a head line and 17% with a tail line.  Each such line
      #   keeps a whole number of 16 samples, the share of the line in the kept
      #   tables.
      downlink_gaps:
        mean_groups: 6.11
        dispersion: 4.47
        size_percentiles: [1.38, 1.69, 2.01, 2.92, 5.11, 10.21, 21.3, 45.9, 88.58, 373.5]
        summed_size_percentiles: [0.5, 1.41, 2.76, 3.73, 4.42, 6.29, 11.48, 14.48, 113.69,
                                  197.5]
        cluster_probability: 0.4
        gap_percentiles: [0.5, 0.74, 0.97, 1.72, 3.92, 8.23, 13.68, 17.49, 20.02, 20.5]
        head_probability: 0.366
        head_kept_percentiles: [0.0156, 0.0312, 0.0781, 0.2031, 0.3438, 0.5625,
                                0.75, 0.875, 0.9688, 0.9688]
        tail_probability: 0.127
        tail_kept_percentiles: [0.0312, 0.0805, 0.125, 0.2188, 0.375, 0.6016,
                                0.7094, 0.8547, 0.875, 0.875]
        step_samples: 16

# Cassini ISS wide-angle camera, raw DN products.
#
# A value marked "published" comes from Porco et al. 2004 (Space Science
# Reviews 115, 363-497), the ISS Data User's Guide (Knowles 2018, PDS Imaging
# Node), or West et al. 2010 (Planetary and Space Science 58, 1475-1488).  A
# value marked "estimated" stands for a behavior those sources describe without
# a figure.  Neither has been fitted to flight frames; a measured or fitted
# value says so, with the date and the frames.  The keys are described in the
# simulator chapter of the developer guide.
coiss_wac:
  # Frames are raw DN, which is what the navigator block below expects.
  data_units: raw_dn

  navigator:
    section: cassini_iss
    detector: wac

  # A full frame binned by b is this size over b, which is how the realism match
  # tells a cohort frame's readout mode from its shape.
  native_frame_size_px: 1024

  psf:
    # TUNED 2026-07-17 from the cohort's two WAC star frames (9 usable star
    # cutouts): cohort EE50/EE80 = 1.33/2.16 px through the final estimator;
    # sigma follows the measured EE50 with the NAC wing shape.  Two-frame
    # evidence -- treat as cohort-limited, revisit when more WAC star frames
    # land.  Radii in native detector pixels.
    kernel: {sigma_v: 1.05, sigma_u: 1.05, w: 0.12, r0: 3.0, n: 4.0}
    # Cassini's documented long wings get a wider window than the generic 16 px;
    # the far halo beyond the window is stray-light scope, not kernel scope.
    truncation_px: 32

  # The residual geometric distortion left after the navigator's distortion
  # model, from the star-field FOV distortion analysis: sub-pixel and close to
  # radially symmetric.
  distortion_residual: {k1: 9.0e-06, k2: 5.48e-05, nonradial_rms_px: 0.0}

  # Electrons a magnitude-0 star deposits per second.  Estimated: sized so a star
  # at the camera's published limiting magnitude reaches SNR ~5, near the
  # matched-filter detection boundary.
  star_flux:
    e_per_s_vmag0: 2.6e+6

  # Plate scale from the published value, ~60 urad/px.
  sky_pixel_scale_arcsec: 12.37

  detector:
    detector_model: ccd
    full_well_e: 95.0e+3  # published (~95k e-, ~3400 DN at gain state 2)
    exposure_ref_sec: 1.0
    # Only gain state 2 is cataloged for the WAC, estimated from the NAC-to-WAC
    # gain ratios of the calibration reports; selecting another WAC state is a
    # validation error until the WAC's full table is sourced.
    gain_e_per_dn_by_state: {2: 28.0}
    default_gain_state: 2
    read_noise_e: 12.0  # published (~12 e-)
    bias_dn: 20.0
    saturation_dn: 4095.0  # 12-bit ADC
    # The DN full scale of the vidicon chain, for a scene that selects it.
    full_well_dn: 4095.0
    signal_full_scale_frac: 0.5
    missing_data_rate: 0.0
    dark_current_e_per_sec: 5.0
    # The NAC's fitted cosmic-ray terms: the two cameras share the CCD and its
    # readout.  The WAC's one 12-bit dark frame (a 26 s star field) flags 1,817
    # spikes per megapixel, above the ~640 these terms deposit, with its stars
    # adding to the count.
    cosmic_ray_events_per_pixel_per_sec: 2.0e-5
    cosmic_ray_readout_dwell_sec: 6.0
    cosmic_ray_amplitude_e: 1000.0
    cosmic_ray_spread_px: 0.6
    quantization: exact

  # The 12-to-8-bit downlink table the NAC and WAC share; its measurement is
  # described in the coiss_nac entry.
  downlink_tables:
    default: table_12_to_8
    tables:
      table_12_to_8: {codes: 256, linear_dn: 2.0, quadratic_dn: 0.055, whole_dn: true}

  # SUM2 and SUM4 summation modes, on-chip; the sources give no separate read
  # noise, gain, or well for them, so each inherits the 1x1 values.
  readout_modes:
    1: {}
    2: {}
    4: {}

  # Electrons per second per native pixel at I/F 1.0, by filter combination,
  # measured 2026-11-06 from Cassini ISS raw/CALIB pairs as described in the
  # coiss_nac entry: the WAC camera constant is 193,000 e-/s per I/F per unit
  # efficiency (16 frames).  VIO measures 0.67x the label model on two frames of
  # one sequence.
  filters:
    throughput_e_per_s_per_if:
      CB2+CL2: 279000.0
      CB3+CL2: 11700.0
      CL1+BL1: 1150000.0  # measured, 2 frames
      CL1+CL2: 13500000.0  # measured, 4 frames
      CL1+GRN: 4470000.0
      CL1+HAL: 323000.0
      CL1+IR1: 4100000.0
      CL1+RED: 5760000.0  # measured, 2 frames
      CL1+VIO: 115000.0  # measured, 2 frames
      IR2+CL2: 695000.0
      IR2+IR1: 293000.0
      IR3+CL2: 216000.0
      IR4+CL2: 11200.0
      IR5+CL2: 1320.0
      MT2+CL2: 135000.0
      MT3+CL2: 39300.0
    # The combination the star zero point refers to.
    clear: CL1+CL2
    # The WAC polarizers sit in wheel 2 and fold onto its clear element.
    polarizer_clear: {IRP0: CL2, IRP90: CL2}
    # System transmission against wavelength, as for the narrow angle camera.
    passbands: coiss_wac

  artifact_modes:
    offered:
      - missing_lines
      - partial_lines
      - alternating_lines
      - compression_truncated_lines
      - truncated_frame
      - missing_blocks
      - downlink_gaps
      - dead_pixels
      - dead_columns
      - hot_pixels
      - banding
      - bias_structure
      - readout_dark
      - shutter_shading
      - bloom
      - radiation_transients
      - bright_dark_pairs
      - fixed_pattern
      - compression_dct
    # The modes every frame of the camera shows, which a scene's
    # instrument_defaults turns on.
    instrument_defaults:
      # Fitted 2026-11-23 with the hot-pixel law in the shape defaults below: the
      # fraction of pixels hotter than 1 e-/s in 2008.
      hot_pixels: {pixel_fraction: 7.2e-3}
      banding: {probability: 1.0}
      readout_dark: {probability: 1.0}
      bias_structure: {probability: 1.0}
      bloom: {probability: 1.0}
    # Per-mode shape defaults, published or estimated like the detector values.
    shape_defaults:
      # Fitted 2026-11-23 as for the NAC, on the WAC dark frames of COISS_2019
      # (2006-005) and COISS_2041 (2008-021) at 0 to 1200 s, in electrons at 28
      # e-/DN (12.1 at gain state 3, scaled from the NAC's gain ratio).  The power
      # law fits the 2008 counts: 7.2e-3 of the pixels are hotter than 1 e-/s, the
      # count hotter than x falls as x^-0.98, and it ends at 1,260 e-/s.  The fit is
      # within 15% of the real counts from 1 to 100 e-/s, and within 45% from there
      # to 1,000 e-/s.  In 2006, 4.9e-3 of the pixels are hotter than 1 e-/s.  A
      # frame of zero exposure holds the charge of 0.10 s more, and each packet read
      # through a hot pixel picks up 0.0142 s of its rate.
      hot_pixels:
        amplitude_law: power_law
        amplitude_index: 0.98
        amplitude_max: 1260.0
        rate_e_per_sec: 1.0
        readout_sec: 0.10
        streak_sec: 0.0142
      # Published: ~6 e- horizontal bands at 4.0 Hz.  The period is the NAC's
      # estimate.
      banding: {amplitude: 6.0, period_px: 64.0, orientation: horizontal}
      bias_structure: {pedestal_sigma_dn: 2.0, row_gradient_dn: 1.0, col_gradient_dn: 0.5}
      # Measured 2026-11-06 on one 12-bit full-frame WAC star field (the other
      # 12-bit full frames carry scene light down the frame): the dark sky rises
      # 1.2 DN, 33 e-, from the first line to the last.
      readout_dark: {amplitude: 33.0}
      bloom: {bloom_length: 4}
      bright_dark_pairs: {amplitude_e: 3.5e+3}
      radiation_transients: {amplitude_e: 3.5e+4}
      fixed_pattern: {dust_donut_count: 5}
      # The NAC's lossless compressor; see the NAC entry.
      compression_truncated_lines: {block_samples: 16, word_bits: 16, id_bits: 4, max_split: 13}
      # Measured 2026-11-24 as for the NAC, on the 82 lossless 12-bit WAC frames with
      # lost lines in the same four volumes, of which 19 lose 83 groups of whole
      # lines inside the frame and one loses line ends to the compressor.  The tables
      # are made as for the NAC.
      # - Sizes: 43 groups on 13 full frames, and 40 on 6 summed frames (five 2x2,
      #   one 4x4) for the summed table, 23 of them from one 2011 sequence.  Summed
      #   groups are larger than full ones with or without that sequence.  Six summed
      #   frames are too few to split 2x2 from 4x4.
      # - A frame loses a mean 4.4 groups (variance 28.7): one on 47% of the frames
      #   and up to 20.  Like the NAC's, the count, the clustering, and the
      #   partial-line rates pool full and summed frames.  Per readout mode, the
      #   gaps miss their 90% resampling intervals at the 25th percentile, and the
      #   summed frames' share of one-line gaps misses too, but one 2011 sequence
      #   holds 26 of the 30 full-frame gaps and another 23 of the 40 summed-frame
      #   groups, so neither mode can support a law of its own.
      # - The gap table is the 42 gaps of 20 lines or less of the 64, and
      #   cluster_probability and the count law are fitted as for the NAC.  The
      #   quartiles of the span come from only 10 frames: 0.24, 0.80, and 0.87.
      # - Of the lines just above one group, 27.8% lose their end, and of those just
      #   below, 11.4%; with the shared lines, 28% of the groups show a head line and
      #   12% a tail line.  The kept shares of the 10 tail lines give their own
      #   table: they are smaller than the NAC's (median 20% against 38%, rank-sum
      #   p = 0.02).
      downlink_gaps:
        mean_groups: 4.37
        dispersion: 3.36
        size_percentiles: [0.5, 1.22, 1.83, 2.97, 5.31, 11.75, 19.2, 78.35, 504.07, 504.5]
        summed_size_percentiles: [1.5, 3.5, 4.5, 6.1, 14.5, 29.5, 51.5, 59.5, 102.1, 102.5]
        cluster_probability: 0.6
        gap_percentiles: [0.5, 1.02, 1.57, 3.38, 7.3, 11.25, 15.7, 16.23, 18.08, 18.5]
        head_probability: 0.278
        head_kept_percentiles: [0.0312, 0.0953, 0.1125, 0.2578, 0.4531, 0.6562,
                                0.8125, 0.8547, 0.9203, 0.9375]
        tail_probability: 0.114
        tail_kept_percentiles: [0.0156, 0.0367, 0.0578, 0.0781, 0.2031, 0.3359,
                                0.4922, 0.5273, 0.5555, 0.5625]
        step_samples: 16

# Cassini ISS narrow-angle camera, calibrated (CALIB, I/F) products.
#
# The same camera as coiss_nac run through CISSCAL, whose bias/dark
# subtraction, flat-fielding, and 2-Hz noise removal strip most of the raw
# chain's structure.  Every key not stated here is the raw camera's.  The keys
# are described in the simulator chapter of the developer guide.
coiss_calib_nac:
  base: coiss_nac

  # A CALIB product is in I/F, so this entry replaces the raw camera's raw_dn.
  # The navigator block below expects I/F too.
  data_units: calibrated_if

  navigator:
    section: cassini_iss_calib
    detector: nac

  # The physical detector, so the fixed hot-pixel map is the raw camera's.
  detector_id: coiss_nac

  detector:
    # The calibration residual: what CISSCAL's per-pixel corrections leave in a
    # CALIB product that the raw frame does not carry.  Measured 2026-11-06 as
    # the CALIB-minus-raw difference over sky pixels of 12-bit raw/CALIB pairs,
    # each line's mean removed (CISSCAL's 2-Hz and bias subtraction act per
    # line), in DN-equivalent through each frame's fitted DN-to-I/F scale:
    # - A column pattern, fixed per camera: frame-to-frame correlation 0.93
    #   (median over 319 pairs), 15 e- rms (26 frames, 14-18 e- on most, the
    #   same in electrons at gain states 2 and 3).
    # - A per-pixel term, mostly different per frame (pair correlation 0.33):
    #   9.4 e- rms.
    # The raw frames carry no column pattern above the per-pixel noise, so the
    # residual is CISSCAL's (its interpolated dark model is the likely source).
    # It is why a real CALIB sky is continuous rather than on the DN lattice,
    # and it lifts the calibrated sky noise from about 0.6 to 0.9 DN-equivalent
    # at gain state 2.
    calibration_column_residual_e: 15.0
    calibration_pixel_residual_e: 9.4
    # The dark-sky ceiling, in I/F above calibrated_sky_if.  The realism
    # comparison counts a sky patch of a real frame or of its matched frame as
    # dark sky only when the patch's mean is at most calibrated_sky_if plus this
    # value.  The test uses the level alone.  The levels below were measured on
    # 2026-11-11, on the darkest quarter of the uniform patches in the 58-frame
    # NAC cohort and its matched frames.  All are in I/F above calibrated_sky_if.
    # - On 12-bit frames, real dark sky lies at -9.4e-4 to 6.9e-4.  The TABLE
    #   frames' skies sit higher and reach 2.18e-3 (N1447064164, whose whole sky
    #   lies at 2.12e-3 to 2.18e-3).
    # - Ring and body material lies at 1.26e-2 and up.
    # - Sky brightened by scattered light spans 5.4e-4 to 7.7e-3, on both sides
    #   of the ceiling.  The light comes from ring glare, glow in the Encke and
    #   Keeler gaps, glow beside a limb, and halos around bright moons.
    # - The real patch levels leave one empty interval, 2.34e-3 to 2.78e-3, and
    #   the ceiling sits in it.
    # - On the matched frames, sky lies at 2.8e-5 or below, and body material at
    #   9.7e-3 and up.
    # Any ceiling from 6e-4 to 2.5e-3 compares the same 26 12-bit frames.
    # Brightened sky below the ceiling counts as dark sky, so a few frames'
    # brightened sky is compared with the matched frames' dark sky.  Two TABLE
    # skies below the ceiling are nearly flat, with sky sigmas of 2.3e-5
    # (N1447064164) and 4.4e-6 (N1492091163).  They are tracked with the TABLE
    # sky question (#977).
    dark_sky_ceiling_if: 2.5e-3

  artifact_modes:
    instrument_defaults:
      # Fitted 2026-11-23 with the residual law in the shape defaults below.
      hot_pixels: {pixel_fraction: 3.3e-5}
      # CISSCAL's 2-Hz noise removal strips the banding, and the cohort sky floor
      # sits below the level at which the raw chain's 30 e- bands would register.
      banding: null
      # CISSCAL subtracts the full 2-D bias structure, not just the constant
      # pedestal the calibration inverse already removes.
      bias_structure: null
    shape_defaults:
      # The hot pixels CISSCAL leaves in a CALIB product, fitted 2026-11-23 on the
      # 58-frame NAC cohort's stationary spikes (spikes the realism match flags at
      # one position in two or more frames of one size): 957 spikes, a mean
      # fraction of 1.57e-5 per frame.
      # - CISSCAL's dark subtraction removes the raw camera's hot pixels.  At the
      #   pixels hotter than 20 e-/s in the nearest dark series, a CALIB frame holds
      #   less than the frame around them, by 0.2 to 1.3 times the raw charge on
      #   the frames with the most such pixels.
      # - The stationary spikes do not grow with the exposure.  Frames of 0.08 to
      #   0.2 s show spikes of 2,000 to 9,000 e-, rates no raw hot pixel reaches,
      #   and two frames 14 days apart (N1487595731 at 0.18 s, N1488823805 at 1.2 s)
      #   share 192 spikes at about the same charge, all in rows and columns 512 to
      #   767 (48% of the cohort's stationary spikes).
      # - A population of fixed charge whatever the exposure fits the frames'
      #   spike counts better than charge in proportion to the exposure: a
      #   fraction of 3.3e-5 of the pixels holding 1,000 e- or more (readout_e),
      #   the count above a charge falling as its inverse (fitted index 0.97) up
      #   to the full well (amplitude_max, 110 times 1,000 e-).  At the real
      #   frames' spike thresholds it predicts the cohort's fraction, 1.57e-5.
      #   The frames' counts scatter far more than any one law allows, as scene
      #   content that repeats between frames adds to them.
      # - The realism match measures 2.8e-5 on the matched frames (2026-11-23).
      #   This detector's map holds 41 pixels of a full frame at this fraction,
      #   where 35 are expected, and the matched frames' own spike thresholds
      #   flag about 1.5 times more of the population than the real frames' do.
      # - The residual pixels' streaks are not measured, so the population has
      #   none.
      hot_pixels:
        amplitude_law: power_law
        amplitude_index: 1.0
        amplitude_max: 110.0
        rate_e_per_sec: 0.0
        readout_sec: null
        readout_e: 1000.0
        streak_sec: null

  # The image library's CALIB frames from this camera are matched against this
  # instrument by the realism match.
  realism_cohort:
    - {mission: COISS, camera: NAC}

# Cassini ISS wide-angle camera, calibrated (CALIB, I/F) products.
#
# The same camera as coiss_wac run through CISSCAL, whose bias/dark
# subtraction, flat-fielding, and 2-Hz noise removal strip most of the raw
# chain's structure.  Every key not stated here is the raw camera's.  The keys
# are described in the simulator chapter of the developer guide.
coiss_calib_wac:
  base: coiss_wac

  # A CALIB product is in I/F, so this entry replaces the raw camera's raw_dn.
  # The navigator block below expects I/F too.
  data_units: calibrated_if

  navigator:
    section: cassini_iss_calib
    detector: wac

  # The physical detector, so the fixed hot-pixel map is the raw camera's.
  detector_id: coiss_wac

  detector:
    # The calibration residual CISSCAL leaves in a CALIB product, measured
    # 2026-11-06 as described in the coiss_calib_nac entry: a fixed column pattern of
    # 30 e- rms (2 frames, both long exposures, frame-to-frame correlation 0.74)
    # and a per-pixel term of 30 e- rms (the same 2 frames).
    calibration_column_residual_e: 30.0
    calibration_pixel_residual_e: 30.0
    # The realism comparison's dark-sky ceiling, in I/F above calibrated_sky_if.
    # The coiss_calib_nac entry describes it.  The levels below were measured on
    # 2026-11-11 on the 4-frame WAC cohort.  Real dark sky lies at -1.4e-4 to
    # 6.5e-5, and the one TABLE frame's sky lies at 2.3e-5 to 6.5e-5.  The next
    # patches up are the halo sky around Rhea, at 4.88e-3 (W1637520502).  The
    # matched frames' sky lies below calibrated_sky_if.  The NAC value falls
    # inside this gap, so both cameras use it.
    dark_sky_ceiling_if: 2.5e-3

  artifact_modes:
    instrument_defaults:
      # Fitted 2026-11-23 with the residual law in the shape defaults below.
      hot_pixels: {pixel_fraction: 7.9e-7}
      # CISSCAL's 2-Hz noise removal strips the banding.
      banding: null
      # CISSCAL subtracts the full 2-D bias structure, not just the constant
      # pedestal the calibration inverse already removes.
      bias_structure: null
    shape_defaults:
      # The NAC's residual law (see the coiss_calib_nac entry), up to this camera's
      # full well (amplitude_max, 95 times 1,000 e-), with the fraction fitted
      # 2026-11-23 on the 4-frame WAC cohort.  Its stationary spikes are one pixel
      # in two frames, 2,314 e- at 1.8 s and 2,285 e- at 0.025 s: a mean fraction
      # of 4.8e-7 per frame, which the fraction predicts at the real frames' spike
      # thresholds.  One pixel says little, so the fraction is uncertain by a
      # factor of several.  This detector's map holds no pixel that rare in a full
      # frame (its rarest draw is 3.3e-6), so the realism match measures none.
      hot_pixels:
        amplitude_law: power_law
        amplitude_index: 1.0
        amplitude_max: 95.0
        rate_e_per_sec: 0.0
        readout_sec: null
        readout_e: 1000.0
        streak_sec: null

  # The image library's CALIB frames from this camera are matched against this
  # instrument by the realism match.
  realism_cohort:
    - {mission: COISS, camera: WAC}
