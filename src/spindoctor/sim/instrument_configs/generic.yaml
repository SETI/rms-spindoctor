# The instrument-agnostic simulated detector ('generic', also written 'sim').
#
# A scene that names no camera renders through this entry: an ideal 12-bit
# detector whose electron well equals its DN depth at unit gain, so a generic
# scene's electron chain reproduces the direct signal-to-DN mapping
# (electrons == DN) rather than imposing a specific camera's radiometry.  It
# offers every artifact mode, which keeps unit scenes free to exercise any
# shape, and emulates no frame-transfer camera, so it turns no mode on under
# instrument_defaults.
#
# The keys are described in the simulator chapter of the developer guide.

aliases: [sim]

# The navigator's flat 'sim' config block.
navigator:
  section: sim

detector:
  detector_model: ccd
  full_well_e: 4095.0
  exposure_ref_sec: 1.0
  gain_e_per_dn_by_state: {0: 1.0}
  default_gain_state: 0
  read_noise_e: 1.0
  bias_dn: 20.0
  dark_current_e_per_sec: 0.0
  hot_pixel_fraction: 0.0
  hot_pixel_amplitude_e: 0.0
  hot_pixel_column_factor: 0.0
  # The generic block is an ideal detector with no environment, so there is
  # no cosmic-ray flux to measure; explicitly zero.
  cosmic_ray_events_per_pixel_per_sec: 0.0
  banding_amplitude_e: 0.0
  banding_period_px: 64.0
  bias_pedestal_sigma_dn: 0.0
  bias_row_gradient_dn: 0.0
  bias_col_gradient_dn: 0.0
  bloom_length: 0
  quantization: exact
  # The calibrated sky residual (I/F) of every calibrated frame whose own entry
  # doesn't set one: the calibrated Cassini cameras, and any instrument a scene
  # pins to calibrated_if.  The calibration inverse adds it after subtracting
  # the bias and dark pedestals, so a noise-free (floor) calibrated dark sky
  # sits at this value instead of exactly 0 I/F, the missing-data marker of
  # every calibrated instrument.  MEASURED 2026-10-28 on 13 dark-sky Cassini
  # NAC CALIB frames (STAR targets with no missing lines, from COISS_2010,
  # 2030, 2050, and 2090): the per-frame sky median spans -5.8e-5 to 2.2e-4
  # I/F, median 4.0e-5, against a median sky sigma of 1.9e-4 I/F, so the real
  # sky scatters around 0 (36-57% of it negative on the darkest frames) and no
  # valid pixel is exactly 0.  The two darkest WAC star frames measure 7.5e-5
  # and 7.8e-5, the same order; the NAC value stands for both cameras.
  calibrated_sky_if: 4.0e-5

readout_modes:
  1: {}

# DERIVED, not measured: the zero point reproduces the prior peak-normalized
# brightness of a magnitude-4 star at the generic detector
# (signal_full_scale_frac 0.5, full_well 4095 e-, star_psf_sigma 1.0), whose
# integrated signal was (1 / 2.512**4) * 2*pi * 1.0**2 * 0.5 * 4095 ~ 324
# electrons; 1.3e4 * 10**(-0.4 * 4) ~ 326 matches it, so a generic scene's
# stars keep their sane DN range and the unit-test workhorse is undisturbed.
star_flux:
  e_per_s_vmag0: 1.3e+4

# A nominal 1 arcsec per pixel.
sky_pixel_scale_arcsec: 1.0

# No PSF kernel: a generic scene under instrument_defaults renders unblurred
# unless it states optics.psf.  The truncation radius applies to a scene's
# own kernel.
psf:
  truncation_px: 16

artifact_modes:
  offered: all
