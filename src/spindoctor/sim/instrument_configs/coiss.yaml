# The Cassini ISS cameras: the narrow-angle and wide-angle cameras, each as raw DN
# products and as calibrated (CALIB, I/F) products.  Each top-level key is one
# simulated instrument.

# Cassini ISS narrow-angle camera, raw DN products.
#
# A value marked "published" comes from Porco et al. 2004 (Space Science
# Reviews 115, 363-497), the ISS Data User's Guide (Knowles 2018, PDS Imaging
# Node), or West et al. 2010 (Planetary and Space Science 58, 1475-1488).  A
# value marked "estimated" stands for a behavior those sources describe without
# a figure.  Neither has been fitted to flight frames; a measured or fitted
# value says so, with the date and the frames.  The keys are described in the
# simulator chapter of the developer guide.
coiss_nac:
  # Frames are raw DN, which is what the navigator block below expects.
  data_units: raw_dn

  navigator:
    section: cassini_iss
    detector: nac

  # A full frame binned by b is this size over b, which is how the realism match
  # tells a cohort frame's readout mode from its shape.
  native_frame_size_px: 1024

  psf:
    # TUNED 2026-07-17 by the realism match against the Cassini CALIB
    # image-library cohort (brightest unsaturated stars over the 11 contributing
    # NAC star frames): cohort encircled-energy radii EE50 = 0.91 px, EE80 = 1.79
    # px; these parameters reproduce EE50/EE80 = 0.90/1.72 px through the same
    # estimator.  The EE80/EE50 ratio (1.97 vs 1.52 for a pure Gaussian) requires
    # substantial mid-range wing energy, so this is an *effective* in-window
    # kernel: the fitted w = 0.12 carries the measured 1-8 px halo energy that
    # the earlier core (sigma 0.55 from the published FWHM over 2.355, w 0.025)
    # put nowhere.  A first fit at w = 0.20 matched the encircled energy but
    # measurably over-lifted the wide-field halo (sky-patch means and
    # mid-size-body limb widths); w = 0.12 with the softer core matches the stars
    # without that excess.  The far halo beyond the truncation window remains
    # stray-light scope.  Radii in native detector pixels; the wing parameters are
    # an energy fraction, so the kernel conserves flux.
    kernel: {sigma_v: 0.70, sigma_u: 0.70, w: 0.12, r0: 3.0, n: 4.0}
    # Cassini's documented long wings get a wider window than the generic 16 px;
    # the far halo beyond the window is stray-light scope, not kernel scope.
    truncation_px: 32

  # The residual geometric distortion left after the navigator applies the
  # camera's known distortion model: a radial polynomial in the normalized field
  # radius (k1 on rho^2, k2 on rho^4) plus a non-radial wander RMS, measured by
  # the star-field FOV distortion analysis.  The corrected field is sub-pixel and
  # close to radially symmetric.
  distortion_residual: {k1: 3.17e-04, k2: -3.51e-04, nonradial_rms_px: 0.0}

  # Electrons a magnitude-0 star deposits per second.  Estimated: sized so a star
  # at the camera's published clear-filter limiting magnitude reaches SNR ~5,
  # near the matched-filter detection boundary at the camera's read noise and PSF
  # core.
  star_flux:
    e_per_s_vmag0: 1.0e+7

  # Plate scale from the published value, ~6 urad/px.
  sky_pixel_scale_arcsec: 1.237

  detector:
    detector_model: ccd
    # Published: full well ~110k e- (saturates ~3600 DN at gain state 2, below
    # the 4095 ADC clip).
    full_well_e: 110.0e+3
    # Estimated: a typical NAC science exposure, so a converted scene at this
    # exposure keeps its brightness scale.
    exposure_ref_sec: 1.0
    # Published gain states ~233/95/30/13 e-/DN; state 2 is the standard science
    # state of the Saturn tour.
    gain_e_per_dn_by_state: {0: 233.0, 1: 95.0, 2: 30.0, 3: 13.0}
    default_gain_state: 2
    read_noise_e: 12.0  # published (~12 e-)
    bias_dn: 20.0
    dark_current_e_per_sec: 5.0  # estimated (dark dominated by residual bulk image)
    # Measured 2026-11-06: the dark sky of 12-bit full-frame raw NAC frames rises
    # linearly from the first line to the last by a median 55 e- (1.8 DN at gain
    # state 2 over 21 frames, 4.0 DN at gain state 3 over 3), the same from 60 ms
    # to 2.6 s, so it accumulates during the readout, not the exposure.
    # CISSCAL's dark model subtracts it from the CALIB product; its shot noise
    # stays.
    readout_dark_e: 55.0
    # Published: 0.15% of pixels in 2004, growing to ~0.28% by 2008-2009.
    hot_pixel_fraction: 2.0e-3
    hot_pixel_amplitude_e: 4.0e+4  # estimated (near the full well)
    # Estimated: total-charge fraction bled into the warm column above a hot
    # pixel (the streak integral, not a per-pixel amplitude).
    hot_pixel_column_factor: 0.3
    # Fitted 2026-11-06 in closed loop: dark raw NAC frames rendered at the
    # cohort's exposures and run through the FOM 6 spike detector match the
    # 12-bit dark-sky cohort frames.  Those frames flag about 120-270 spikes per
    # megapixel at every exposure from 60 ms to 2.6 s and 650 at 18 s, so most
    # hits arrive while the frame waits to be read (6 s of dwell); the spikes
    # peak at a median 800-1,300 e- over 4-8 pixels, so the deposits are modest
    # and diffused, not full-well points.  The simulated amplitude tail is
    # shorter (90th percentile ~1,800 e- against 4,000-7,000 e- real).  At gain
    # state 3 the sim flags 4-6x the two real frames, whose stronger line noise
    # raises the detector's threshold.
    cosmic_ray_events_per_pixel_per_sec: 2.0e-5
    cosmic_ray_readout_dwell_sec: 6.0
    cosmic_ray_amplitude_e: 1000.0
    cosmic_ray_spread_px: 0.6
    banding_amplitude_e: 30.0  # published (~30 e-, 2.1 and 2.5 Hz beating)
    banding_period_px: 64.0  # estimated (the line readout rate sets the period)
    bias_pedestal_sigma_dn: 2.0  # estimated (per-image pedestal jitter)
    bias_row_gradient_dn: 1.0  # estimated (readout-direction gradient)
    bias_col_gradient_dn: 0.5  # estimated
    bloom_length: 4  # estimated (no antiblooming; column bleed above the well)
    quantization: exact

  # The downlink tables the sqrt_lut quantization decodes through.  The camera has
  # one: the 12-to-8-bit table (DATA_CONVERSION_TYPE TABLE), which the NAC and WAC
  # share.  Measured 2026-11-06 from the 26 TABLE frames of the CALIB cohort: the
  # calibrated DN-equivalent step between consecutive raw codes is an integer that
  # grows by one about every ten codes (3 near code 10, 5 near 25, 8 near 55, 13
  # near 100, 24 near 200), which round(2 * code + 0.055 * code**2) reproduces,
  # alternations included, and which tops out at 4086 DN at code 255.
  downlink_tables:
    default: table_12_to_8
    tables:
      table_12_to_8: {codes: 256, linear_dn: 2.0, quadratic_dn: 0.055, whole_dn: true}

  # SUM2 and SUM4 summation modes, on-chip; the sources give no separate read
  # noise, gain, or well for them, so each inherits the 1x1 values.
  readout_modes:
    1: {}
    2: {}
    4: {}

  # Electrons per second per native pixel at I/F 1.0, by filter combination.
  #
  # Measured 2026-11-06 from Cassini ISS raw/CALIB pairs.  CISSCAL writes the
  # conversion it applied into every CALIB label (RADIOMETRIC_CORRECTION_TEXT:
  # an efficiency factor and an absolute correction factor per filter
  # combination), and the camera constant comes from fitting raw DN against
  # CALIB I/F on the bright pixels of 12-bit frames, converted to electrons by
  # the label's GAIN_CORRECTION, divided by the exposure less EXPOSURE_OFFSET
  # and by the summation factor.  The fits put the constant at 16,800 e-/s per
  # I/F per unit efficiency for the NAC (31 frames, scatter about 15%) and
  # 193,000 for the WAC (16 frames), a ratio of 11.5 that the cameras' apertures
  # and pixel solid angles predict to within 30%.
  #
  # An entry tagged 'measured' is the median of two or more 12-bit pair fits for
  # that combination; every other entry is the camera constant times the label's
  # efficiency and absolute correction.  Two measured filters depart from that
  # model by more than the fit scatter: UV3 (0.32x, two frames at two gains) and
  # IR3 (0.74x, three frames).  The 8-bit TABLE frames are excluded: their LUT
  # encoding breaks the linear raw/CALIB fit.
  filters:
    throughput_e_per_s_per_if:
      BL1+CL2: 110000.0
      BL1+GRN: 5750.0
      CL1+BL2: 24700.0
      CL1+CB1: 62300.0
      CL1+CB2: 31300.0
      CL1+CB3: 6380.0
      CL1+CL2: 1450000.0  # measured, 9 frames
      CL1+GRN: 413000.0  # measured, 8 frames
      CL1+IR1: 471000.0  # measured, 2 frames
      CL1+IR3: 65300.0  # measured, 3 frames
      CL1+MT1: 11000.0
      CL1+MT2: 13400.0
      CL1+MT3: 13900.0
      CL1+UV3: 19600.0  # measured, 2 frames
      HAL+CL2: 28700.0
      IR2+CL2: 167000.0
      IR2+IR1: 56400.0
      IR2+IR3: 51400.0
      IR4+CL2: 11800.0
      IR4+IR3: 9630.0
      RED+CL2: 445000.0
      RED+GRN: 141000.0
      RED+IR1: 141000.0
      UV1+CL2: 13100.0
      UV2+CL2: 20800.0
      UV2+UV3: 6700.0
    # The combination the star zero point refers to: it is sized from the
    # published clear-filter limiting magnitude.
    clear: CL1+CL2
    # CISSCAL gives the polarizers the efficiency of the clear element they
    # replace, so the real products carry the same DN-to-I/F scale with or
    # without a polarizer; each folds onto that clear element.  The NAC
    # polarizers sit in wheel 1.
    polarizer_clear: {P0: CL1, P60: CL1, P120: CL1, IRP0: CL1}

  artifact_modes:
    offered:
      - missing_lines
      - partial_lines
      - alternating_lines
      - truncated_frame
      - missing_blocks
      - dead_pixels
      - dead_columns
      - hot_pixels
      - banding_coherent
      - bias_structure
      - dark_ramp
      - bloom
      - radiation_transients
      - bright_dark_pairs
      - quantization_sqrt_lut
      - quantization_ls8b
      - fixed_pattern
      - compression_dct
    # Per-mode shape defaults, published or estimated like the detector values.
    # An activation key is never cataloged: a mode activates only when a scene
    # sets it.  Shapes here are the values a scene inherits when it sets a mode
    # without spelling out every parameter.
    shape_defaults:
      # ~30 e- NAC 2 Hz horizontal banding, line-readout-rate period.
      banding_coherent: {amplitude_e: 30.0, period_px: 64.0, orientation: horizontal}
      # Per-image pedestal jitter plus readout-direction gradients.
      bias_structure: {pedestal_sigma_dn: 2.0, row_gradient_dn: 1.0, col_gradient_dn: 0.5}
      # RBI-dominated dark grows toward the last readout line.
      dark_ramp: {kind: dark_gradient, amplitude_e: 150.0}
      bloom: {bloom_length: 4}
      # Anti-blooming vertical 2-px pairs in unsummed long exposures.
      bright_dark_pairs: {amplitude_e: 4.0e+3}
      # No published ISS rate; the interplanetary regime near full-well amp.
      radiation_transients: {amplitude_e: 4.0e+4}
      # Dust donuts (<1% each) accumulating over the mission.
      fixed_pattern: {dust_donut_count: 5}

# Cassini ISS wide-angle camera, raw DN products.
#
# A value marked "published" comes from Porco et al. 2004 (Space Science
# Reviews 115, 363-497), the ISS Data User's Guide (Knowles 2018, PDS Imaging
# Node), or West et al. 2010 (Planetary and Space Science 58, 1475-1488).  A
# value marked "estimated" stands for a behavior those sources describe without
# a figure.  Neither has been fitted to flight frames; a measured or fitted
# value says so, with the date and the frames.  The keys are described in the
# simulator chapter of the developer guide.
coiss_wac:
  # Frames are raw DN, which is what the navigator block below expects.
  data_units: raw_dn

  navigator:
    section: cassini_iss
    detector: wac

  # A full frame binned by b is this size over b, which is how the realism match
  # tells a cohort frame's readout mode from its shape.
  native_frame_size_px: 1024

  psf:
    # TUNED 2026-07-17 from the cohort's two WAC star frames (9 usable star
    # cutouts): cohort EE50/EE80 = 1.33/2.16 px through the final estimator;
    # sigma follows the measured EE50 with the NAC wing shape.  Two-frame
    # evidence -- treat as cohort-limited, revisit when more WAC star frames
    # land.  Radii in native detector pixels.
    kernel: {sigma_v: 1.05, sigma_u: 1.05, w: 0.12, r0: 3.0, n: 4.0}
    # Cassini's documented long wings get a wider window than the generic 16 px;
    # the far halo beyond the window is stray-light scope, not kernel scope.
    truncation_px: 32

  # The residual geometric distortion left after the navigator's distortion
  # model, from the star-field FOV distortion analysis: sub-pixel and close to
  # radially symmetric.
  distortion_residual: {k1: 9.0e-06, k2: 5.48e-05, nonradial_rms_px: 0.0}

  # Electrons a magnitude-0 star deposits per second.  Estimated: sized so a star
  # at the camera's published limiting magnitude reaches SNR ~5, near the
  # matched-filter detection boundary.
  star_flux:
    e_per_s_vmag0: 2.6e+6

  # Plate scale from the published value, ~60 urad/px.
  sky_pixel_scale_arcsec: 12.37

  detector:
    detector_model: ccd
    full_well_e: 95.0e+3  # published (~95k e-, ~3400 DN at gain state 2)
    exposure_ref_sec: 1.0
    # Only gain state 2 is cataloged for the WAC, estimated from the NAC-to-WAC
    # gain ratios of the calibration reports; selecting another WAC state is a
    # validation error until the WAC's full table is sourced.
    gain_e_per_dn_by_state: {2: 28.0}
    default_gain_state: 2
    read_noise_e: 12.0  # published (~12 e-)
    bias_dn: 20.0
    dark_current_e_per_sec: 5.0
    # Measured 2026-11-06 on one 12-bit full-frame WAC star field (the other
    # 12-bit full frames carry scene light down the frame): the dark sky rises
    # 1.2 DN, 33 e-, from the first line to the last.
    readout_dark_e: 33.0
    hot_pixel_fraction: 2.0e-3
    hot_pixel_amplitude_e: 3.5e+4
    hot_pixel_column_factor: 0.3
    # The NAC's fitted cosmic-ray terms: the two cameras share the CCD and its
    # readout.  The WAC's one 12-bit dark frame (a 26 s star field) flags 1,817
    # spikes per megapixel, above the ~640 these terms deposit, with its stars
    # adding to the count.
    cosmic_ray_events_per_pixel_per_sec: 2.0e-5
    cosmic_ray_readout_dwell_sec: 6.0
    cosmic_ray_amplitude_e: 1000.0
    cosmic_ray_spread_px: 0.6
    banding_amplitude_e: 6.0  # published (~6 e- at 4.0 Hz)
    banding_period_px: 64.0
    bias_pedestal_sigma_dn: 2.0
    bias_row_gradient_dn: 1.0
    bias_col_gradient_dn: 0.5
    bloom_length: 4  # estimated (no antiblooming; column bleed above the well)
    quantization: exact

  # The 12-to-8-bit downlink table the NAC and WAC share; its measurement is
  # described in the coiss_nac entry.
  downlink_tables:
    default: table_12_to_8
    tables:
      table_12_to_8: {codes: 256, linear_dn: 2.0, quadratic_dn: 0.055, whole_dn: true}

  # SUM2 and SUM4 summation modes, on-chip; the sources give no separate read
  # noise, gain, or well for them, so each inherits the 1x1 values.
  readout_modes:
    1: {}
    2: {}
    4: {}

  # Electrons per second per native pixel at I/F 1.0, by filter combination,
  # measured 2026-11-06 from Cassini ISS raw/CALIB pairs as described in the
  # coiss_nac entry: the WAC camera constant is 193,000 e-/s per I/F per unit
  # efficiency (16 frames).  VIO measures 0.67x the label model on two frames of
  # one sequence.
  filters:
    throughput_e_per_s_per_if:
      CB2+CL2: 279000.0
      CB3+CL2: 11700.0
      CL1+BL1: 1150000.0  # measured, 2 frames
      CL1+CL2: 13500000.0  # measured, 4 frames
      CL1+GRN: 4470000.0
      CL1+HAL: 323000.0
      CL1+IR1: 4100000.0
      CL1+RED: 5760000.0  # measured, 2 frames
      CL1+VIO: 115000.0  # measured, 2 frames
      IR2+CL2: 695000.0
      IR2+IR1: 293000.0
      IR3+CL2: 216000.0
      IR4+CL2: 11200.0
      IR5+CL2: 1320.0
      MT2+CL2: 135000.0
      MT3+CL2: 39300.0
    # The combination the star zero point refers to.
    clear: CL1+CL2
    # The WAC polarizers sit in wheel 2 and fold onto its clear element.
    polarizer_clear: {IRP0: CL2, IRP90: CL2}

  artifact_modes:
    offered:
      - missing_lines
      - partial_lines
      - alternating_lines
      - truncated_frame
      - missing_blocks
      - dead_pixels
      - dead_columns
      - hot_pixels
      - banding_coherent
      - bias_structure
      - dark_ramp
      - bloom
      - radiation_transients
      - bright_dark_pairs
      - quantization_sqrt_lut
      - quantization_ls8b
      - fixed_pattern
      - compression_dct
    # Per-mode shape defaults, published or estimated like the detector values;
    # ~6 e- 4 Hz banding.
    shape_defaults:
      banding_coherent: {amplitude_e: 6.0, period_px: 64.0, orientation: horizontal}
      bias_structure: {pedestal_sigma_dn: 2.0, row_gradient_dn: 1.0, col_gradient_dn: 0.5}
      dark_ramp: {kind: dark_gradient, amplitude_e: 150.0}
      bloom: {bloom_length: 4}
      bright_dark_pairs: {amplitude_e: 3.5e+3}
      radiation_transients: {amplitude_e: 3.5e+4}
      fixed_pattern: {dust_donut_count: 5}

# Cassini ISS narrow-angle camera, calibrated (CALIB, I/F) products.
#
# The same camera as coiss_nac run through CISSCAL, whose bias/dark
# subtraction, flat-fielding, and 2-Hz noise removal strip most of the raw
# chain's structure.  Every key not stated here is the raw camera's.  The keys
# are described in the simulator chapter of the developer guide.
coiss_calib_nac:
  base: coiss_nac

  # A CALIB product is in I/F, so this entry replaces the raw camera's raw_dn.
  # The navigator block below expects I/F too.
  data_units: calibrated_if

  navigator:
    section: cassini_iss_calib
    detector: nac

  # The physical detector, so the fixed hot-pixel map is the raw camera's.
  detector_id: coiss_nac

  detector:
    # TUNED 2026-07-17 by the realism match against the 62-frame CALIB
    # image-library cohort: the measured stationary spike fraction 1.6e-5
    # (single-pixel spikes recurring at fixed positions across the 58-frame NAC
    # cohort; the raw camera's estimated 2e-3 overstated the calibrated products
    # by ~100x and dominated their p99 signal percentile).
    hot_pixel_fraction: 1.6e-5
    # CISSCAL's 2-Hz noise removal strips the coherent banding, and the cohort
    # sky floor sits below the level at which the raw chain's 30 e- banding
    # would register.
    banding_amplitude_e: 0.0
    # CISSCAL subtracts the full 2-D bias structure, not just the constant
    # pedestal the calibration inverse already removes.
    bias_pedestal_sigma_dn: 0.0
    bias_row_gradient_dn: 0.0
    bias_col_gradient_dn: 0.0
    # The calibration residual: what CISSCAL's per-pixel corrections leave in a
    # CALIB product that the raw frame does not carry.  Measured 2026-11-06 as
    # the CALIB-minus-raw difference over sky pixels of 12-bit raw/CALIB pairs,
    # each line's mean removed (CISSCAL's 2-Hz and bias subtraction act per
    # line), in DN-equivalent through each frame's fitted DN-to-I/F scale:
    # - A column pattern, fixed per camera: frame-to-frame correlation 0.93
    #   (median over 319 pairs), 15 e- rms (26 frames, 14-18 e- on most, the
    #   same in electrons at gain states 2 and 3).
    # - A per-pixel term, mostly different per frame (pair correlation 0.33):
    #   9.4 e- rms.
    # The raw frames carry no column pattern above the per-pixel noise, so the
    # residual is CISSCAL's (its interpolated dark model is the likely source).
    # It is why a real CALIB sky is continuous rather than on the DN lattice,
    # and it lifts the calibrated sky noise from about 0.6 to 0.9 DN-equivalent
    # at gain state 2.
    calibration_column_residual_e: 15.0
    calibration_pixel_residual_e: 9.4

  # The image library's CALIB frames from this camera are matched against this
  # instrument by the realism match.
  realism_cohort:
    - {mission: COISS, camera: NAC}

# Cassini ISS wide-angle camera, calibrated (CALIB, I/F) products.
#
# The same camera as coiss_wac run through CISSCAL, whose bias/dark
# subtraction, flat-fielding, and 2-Hz noise removal strip most of the raw
# chain's structure.  Every key not stated here is the raw camera's.  The keys
# are described in the simulator chapter of the developer guide.
coiss_calib_wac:
  base: coiss_wac

  # A CALIB product is in I/F, so this entry replaces the raw camera's raw_dn.
  # The navigator block below expects I/F too.
  data_units: calibrated_if

  navigator:
    section: cassini_iss_calib
    detector: wac

  # The physical detector, so the fixed hot-pixel map is the raw camera's.
  detector_id: coiss_wac

  detector:
    # TUNED 2026-07-17 by the realism match against the 62-frame CALIB
    # image-library cohort; the stationary spike fraction 1.6e-5 measured on the
    # NAC cohort stands for both cameras (see the coiss_calib_nac entry).
    hot_pixel_fraction: 1.6e-5
    # CISSCAL's 2-Hz noise removal strips the coherent banding.
    banding_amplitude_e: 0.0
    # CISSCAL subtracts the full 2-D bias structure, not just the constant
    # pedestal the calibration inverse already removes.
    bias_pedestal_sigma_dn: 0.0
    bias_row_gradient_dn: 0.0
    bias_col_gradient_dn: 0.0
    # The calibration residual CISSCAL leaves in a CALIB product, measured
    # 2026-11-06 as described in the coiss_calib_nac entry: a fixed column pattern of
    # 30 e- rms (2 frames, both long exposures, frame-to-frame correlation 0.74)
    # and a per-pixel term of 30 e- rms (the same 2 frames).
    calibration_column_residual_e: 30.0
    calibration_pixel_residual_e: 30.0

  # The image library's CALIB frames from this camera are matched against this
  # instrument by the realism match.
  realism_cohort:
    - {mission: COISS, camera: WAC}
