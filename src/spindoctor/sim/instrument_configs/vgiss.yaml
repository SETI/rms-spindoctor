# Voyager ISS vidicon, calibrated (GEOMED, I/F) products.
#
# Section numbers in the comments (5.3, 12, ...) refer to the simulator's
# instrument calibration references.  The keys are described in the simulator
# chapter of the developer guide.

navigator:
  section: voyager_iss

# The GEOMED product is a 1000 by 1000 resample of the 800 by 800 vidicon frame
# (LINES and LINE_SAMPLES 1000 in every GEOMED label of the image library's
# cohort and of VGISS_5101).  The camera has no binned readout, so this size
# only tells a full frame from a subframe.
native_frame_size_px: 1000

psf:
  # RETAINED interim estimate: the cohort's one star frame (8 usable star
  # cutouts, EE50 1.22 px) cannot constrain the kernel through GEOMED
  # resampling (the flat-top guard leaves two simulated cutouts to compare
  # against); the Voyager references publish no FWHM.  Radii in native
  # detector pixels.
  kernel: {sigma_v: 0.85, sigma_u: 0.85, w: 1.2e-2, r0: 2.0, n: 3.0}
  truncation_px: 16

# The residual geometric distortion left after the navigator's distortion
# model, from the star-field FOV distortion analysis: the GEOMED products
# carry several tenths of a pixel of both radial and non-radial distortion.
# The block is the Voyager 2 WAC measurement; the two Voyager missions and
# their narrow- and wide-angle cameras have distinct optics, so a single entry
# under-represents that spread until per-camera entries and locked frames for
# each are available.
distortion_residual: {k1: -6.88e-03, k2: 1.46e-02, nonradial_rms_px: 0.2}

# The vidicon has no electron domain, so its zero point is DN a magnitude-0
# star deposits per second, sized so the 5.3 vidicon limiting magnitudes land
# at the matched-filter boundary in the DN chain.  Interim.
star_flux:
  dn_per_s_vmag0: 3.0e+3

# Interim plate scale from the published value (Section 12): ~9.3 urad/px.
sky_pixel_scale_arcsec: 1.910

detector:
  detector_model: vidicon
  # The vidicon skips the electron conversion; signal maps straight to the
  # 8-bit DN full scale, then the DN-domain vidicon noise model applies.
  exposure_ref_sec: 1.0
  bias_dn: 20.0
  quantization: 8bit
  # The calibrated sky residual in I/F, added after the calibration inverse
  # (generic.yaml carries the value for an entry without its own).  Real
  # GEOMED sky sits above 0: inside the resample border of five archived
  # frames (four VGISS_8210 Voyager 2 star frames and one VGISS_5101 Voyager 1
  # dark frame) the sky's 1st percentile is positive, at most 0.03% of the
  # pixels are exactly 0, and the sky level spans 6.6e-4 to 3.2e-2 I/F (median
  # about 5e-3).  The vidicon's calibration scale is 127.5 DN per unit I/F
  # (signal_full_scale_frac 0.5 of the 255 DN full scale), so this value is
  # 1.5 / 127.5, 1.5 DN: half a DN off the integer DN grid, so no digitized
  # pixel lands on exactly 0, and one and a half steps up, so the
  # instrument_defaults noise (0.40 DN rms from the three vidicon terms below)
  # takes a -1.5 DN excursion (3.8 sigma, about 7e-5 of the pixels) to put a
  # sky pixel below 0.  0.5 DN (3.9e-3 I/F, nearer the cohort median) would
  # put about 10% of the noisy sky one step below 0.  The value sits inside
  # the cohort's range, 2.3x its median.
  calibrated_sky_if: 0.011764705882352941
  # Cosmic rays RETAINED at zero 2026-07-17.  The realism match measured a
  # 3.5e-5 transient spike fraction over the 3-frame GEOMED cohort --
  # GEOMED's reseau-anchored resampling interpolates most single-pixel
  # transients away, so the cohort cannot say how many hits the target took.
  # Unblocked by more Voyager frames (raw or CALIB, ahead of the resampling).
  cosmic_ray_events_per_pixel_per_sec: 0.0
  vidicon:
    # TUNED 2026-07-17 by the realism match: the 3-frame GEOMED cohort's
    # paired-difference sky sigma is ~0.22 DN equivalent (median 1.75e-3 I/F),
    # placing the products in the low-gain regime of the published 0.3-0.75
    # DN range after GEOMED resampling smoothing.  The interim 1.8 DN values
    # (the high-gain end) overstated the cohort's measured 0.22 DN sky sigma
    # about 9x.  0.25 DN per component (quadrature sum ~0.35 DN, the low end
    # of the published range): the sim's 8-bit quantization floors any sub-LSB
    # value, so the choice is anchored to the published low-gain range rather
    # than to the (unreachable) 0.22 DN cohort estimate -- see the realism
    # report's known-gaps list.  3 frames is limited evidence; revisit as
    # VGISS frames land.
    read_noise_line_dn: 0.25
    read_noise_pixel_dn: 0.25
    # 5.3: faint coherent periodic component (2.4 kHz vertical, ~0.5 DN
    # peak-to-peak).
    coherent_amplitude_dn: 0.25
    coherent_period_px: 8.0

# The vidicon has no binned readout.
readout_modes:
  1: {}

artifact_modes:
  offered:
    - missing_lines
    - partial_lines
    - edited_frame
    - line_garble
    - pixel_spikes
    - banding_coherent
    - bias_structure
    - dark_ramp
    - beam_bend
    - residual_image
    - quantization_contour_8bit
    - fixed_pattern
    - reseau_scars
    - resample_texture
  # Per-mode shape defaults (interim, 5.3), all GEOMED-level: the beam-bend
  # limb bias that survives reseau-anchored correction, the shortened
  # erase-cycle residual image, the readout dark-current line ramp, the
  # reseau-removal scars on the ~46-px lattice, and the GEOMED resample
  # texture (blank border + missing-line interpolation banding).
  shape_defaults:
    # The edited (IM) modes downlink a centered band of each line, 608, 440,
    # 272, 160, or 80 of the 800 px (5.3); 440 is the band a scene that sets
    # only a probability gets.
    edited_frame: {band_width_px: 440}
    beam_bend: {amplitude_px: 1.0}
    residual_image: {amplitude: 0.05, prior: self_offset, offset_px: [5, 5]}
    # 48 x n s readout ramp, nonlinear in wait time.
    dark_ramp: {kind: dark_gradient, amplitude_e: 6.0, nonlinear: 1.5}
    quantization_contour_8bit: {step: 8}
    # 202 reseau marks per camera on a ~46 px triangular lattice (5.3).
    reseau_scars: {spacing_px: 46, patch_radius_px: 4, mark_count: 202}
    resample_texture: {warp_amp_px: 0.3, blank_border_px: 2, missing_line_interp: false}

# The image library's GEOMED frames from both cameras are matched against this
# instrument by the realism match.
realism_cohort:
  - {mission: VGISS, camera: NA}
  - {mission: VGISS, camera: WA}
