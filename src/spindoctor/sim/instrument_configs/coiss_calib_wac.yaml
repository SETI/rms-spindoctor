# Cassini ISS wide-angle camera, calibrated (CALIB, I/F) products.
#
# The same camera as coiss_wac run through CISSCAL, whose bias/dark
# subtraction, flat-fielding, and 2-Hz noise removal strip most of the raw
# chain's structure.  Every key not stated here is the raw camera's.  The keys
# are described in the simulator chapter of the developer guide.

base: coiss_wac

navigator:
  section: cassini_iss_calib
  detector: wac

# The physical detector, so the fixed hot-pixel map is the raw camera's.
detector_id: coiss_wac

detector:
  # TUNED 2026-07-17 by the realism match against the 62-frame CALIB
  # image-library cohort; the stationary spike fraction 1.6e-5 measured on the
  # NAC cohort stands for both cameras (see coiss_calib_nac.yaml).
  hot_pixel_fraction: 1.6e-5
  # CISSCAL's 2-Hz noise removal strips the coherent banding.
  banding_amplitude_e: 0.0
  # CISSCAL subtracts the full 2-D bias structure, not just the constant
  # pedestal the calibration inverse already removes.
  bias_pedestal_sigma_dn: 0.0
  bias_row_gradient_dn: 0.0
  bias_col_gradient_dn: 0.0
  # The calibration residual CISSCAL leaves in a CALIB product, measured
  # 2026-11-06 as described in coiss_calib_nac.yaml: a fixed column pattern of
  # 30 e- rms (2 frames, both long exposures, frame-to-frame correlation 0.74)
  # and a per-pixel term of 30 e- rms (the same 2 frames).
  calibration_column_residual_e: 30.0
  calibration_pixel_residual_e: 30.0

# The image library's CALIB frames from this camera are matched against this
# instrument by the realism match.
realism_cohort:
  - {mission: COISS, camera: WAC}
