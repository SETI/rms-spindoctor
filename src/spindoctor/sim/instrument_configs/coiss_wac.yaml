# Cassini ISS wide-angle camera, raw DN products.
#
# A value marked "published" comes from Porco et al. 2004 (Space Science
# Reviews 115, 363-497), the ISS Data User's Guide (Knowles 2018, PDS Imaging
# Node), or West et al. 2010 (Planetary and Space Science 58, 1475-1488).  A
# value marked "estimated" stands for a behavior those sources describe without
# a figure.  Neither has been fitted to flight frames; a measured or fitted
# value says so, with the date and the frames.  The keys are described in the
# simulator chapter of the developer guide.

navigator:
  section: cassini_iss
  detector: wac

# A full frame binned by b is this size over b, which is how the realism match
# tells a cohort frame's readout mode from its shape.
native_frame_size_px: 1024

psf:
  # TUNED 2026-07-17 from the cohort's two WAC star frames (9 usable star
  # cutouts): cohort EE50/EE80 = 1.33/2.16 px through the final estimator;
  # sigma follows the measured EE50 with the NAC wing shape.  Two-frame
  # evidence -- treat as cohort-limited, revisit when more WAC star frames
  # land.  Radii in native detector pixels.
  kernel: {sigma_v: 1.05, sigma_u: 1.05, w: 0.12, r0: 3.0, n: 4.0}
  # Cassini's documented long wings get a wider window than the generic 16 px;
  # the far halo beyond the window is stray-light scope, not kernel scope.
  truncation_px: 32

# The residual geometric distortion left after the navigator's distortion
# model, from the star-field FOV distortion analysis: sub-pixel and close to
# radially symmetric.
distortion_residual: {k1: 9.0e-06, k2: 5.48e-05, nonradial_rms_px: 0.0}

# Electrons a magnitude-0 star deposits per second.  Estimated: sized so a star
# at the camera's published limiting magnitude reaches SNR ~5, near the
# matched-filter detection boundary.
star_flux:
  e_per_s_vmag0: 2.6e+6

# Plate scale from the published value, ~60 urad/px.
sky_pixel_scale_arcsec: 12.37

detector:
  detector_model: ccd
  full_well_e: 95.0e+3  # published (~95k e-, ~3400 DN at gain state 2)
  exposure_ref_sec: 1.0
  # Only gain state 2 is cataloged for the WAC, estimated from the NAC-to-WAC
  # gain ratios of the calibration reports; selecting another WAC state is a
  # validation error until the WAC's full table is sourced.
  gain_e_per_dn_by_state: {2: 28.0}
  default_gain_state: 2
  read_noise_e: 12.0  # published (~12 e-)
  bias_dn: 20.0
  dark_current_e_per_sec: 5.0
  # Measured 2026-11-06 on one 12-bit full-frame WAC star field (the other
  # 12-bit full frames carry scene light down the frame): the dark sky rises
  # 1.2 DN, 33 e-, from the first line to the last.
  readout_dark_e: 33.0
  hot_pixel_fraction: 2.0e-3
  hot_pixel_amplitude_e: 3.5e+4
  hot_pixel_column_factor: 0.3
  # The NAC's fitted cosmic-ray terms: the two cameras share the CCD and its
  # readout.  The WAC's one 12-bit dark frame (a 26 s star field) flags 1,817
  # spikes per megapixel, above the ~640 these terms deposit, with its stars
  # adding to the count.
  cosmic_ray_events_per_pixel_per_sec: 2.0e-5
  cosmic_ray_readout_dwell_sec: 6.0
  cosmic_ray_amplitude_e: 1000.0
  cosmic_ray_spread_px: 0.6
  banding_amplitude_e: 6.0  # published (~6 e- at 4.0 Hz)
  banding_period_px: 64.0
  bias_pedestal_sigma_dn: 2.0
  bias_row_gradient_dn: 1.0
  bias_col_gradient_dn: 0.5
  bloom_length: 4  # estimated (no antiblooming; column bleed above the well)
  quantization: exact

# The 12-to-8-bit downlink table the NAC and WAC share; its measurement is
# described in coiss_nac.yaml.
downlink_tables:
  default: table_12_to_8
  tables:
    table_12_to_8: {codes: 256, linear_dn: 2.0, quadratic_dn: 0.055, whole_dn: true}

# SUM2 and SUM4 summation modes, on-chip; the sources give no separate read
# noise, gain, or well for them, so each inherits the 1x1 values.
readout_modes:
  1: {}
  2: {}
  4: {}

# Electrons per second per native pixel at I/F 1.0, by filter combination,
# measured 2026-11-06 from Cassini ISS raw/CALIB pairs as described in
# coiss_nac.yaml: the WAC camera constant is 193,000 e-/s per I/F per unit
# efficiency (16 frames).  VIO measures 0.67x the label model on two frames of
# one sequence.
filters:
  throughput_e_per_s_per_if:
    CB2+CL2: 279000.0
    CB3+CL2: 11700.0
    CL1+BL1: 1150000.0  # measured, 2 frames
    CL1+CL2: 13500000.0  # measured, 4 frames
    CL1+GRN: 4470000.0
    CL1+HAL: 323000.0
    CL1+IR1: 4100000.0
    CL1+RED: 5760000.0  # measured, 2 frames
    CL1+VIO: 115000.0  # measured, 2 frames
    IR2+CL2: 695000.0
    IR2+IR1: 293000.0
    IR3+CL2: 216000.0
    IR4+CL2: 11200.0
    IR5+CL2: 1320.0
    MT2+CL2: 135000.0
    MT3+CL2: 39300.0
  # The combination the star zero point refers to.
  clear: CL1+CL2
  # The WAC polarizers sit in wheel 2 and fold onto its clear element.
  polarizer_clear: {IRP0: CL2, IRP90: CL2}

artifact_modes:
  offered:
    - missing_lines
    - partial_lines
    - alternating_lines
    - truncated_frame
    - missing_blocks
    - dead_pixels
    - dead_columns
    - hot_pixels
    - banding_coherent
    - bias_structure
    - dark_ramp
    - bloom
    - radiation_transients
    - bright_dark_pairs
    - quantization_sqrt_lut
    - quantization_ls8b
    - fixed_pattern
    - compression_dct
  # Per-mode shape defaults, published or estimated like the detector values;
  # ~6 e- 4 Hz banding.
  shape_defaults:
    banding_coherent: {amplitude_e: 6.0, period_px: 64.0, orientation: horizontal}
    bias_structure: {pedestal_sigma_dn: 2.0, row_gradient_dn: 1.0, col_gradient_dn: 0.5}
    dark_ramp: {kind: dark_gradient, amplitude_e: 150.0}
    bloom: {bloom_length: 4}
    bright_dark_pairs: {amplitude_e: 3.5e+3}
    radiation_transients: {amplitude_e: 3.5e+4}
    fixed_pattern: {dust_donut_count: 5}
