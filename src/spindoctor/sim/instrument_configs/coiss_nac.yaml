# Cassini ISS narrow-angle camera, raw DN products.
#
# Section numbers in the comments (5.2, 12, ...) refer to the simulator's
# instrument calibration references.  The keys are described in the simulator
# chapter of the developer guide.

navigator:
  section: cassini_iss
  detector: nac

# A full frame binned by b is this size over b, which is how the realism match
# tells a cohort frame's readout mode from its shape.
native_frame_size_px: 1024

psf:
  # TUNED 2026-07-17 by the realism match against the Cassini CALIB
  # image-library cohort (brightest unsaturated stars over the 11 contributing
  # NAC star frames): cohort encircled-energy radii EE50 = 0.91 px, EE80 = 1.79
  # px; these parameters reproduce EE50/EE80 = 0.90/1.72 px through the same
  # estimator.  The EE80/EE50 ratio (1.97 vs 1.52 for a pure Gaussian) requires
  # substantial mid-range wing energy, so this is an *effective* in-window
  # kernel: the fitted w = 0.12 carries the measured 1-8 px halo energy that
  # the interim FWHM-derived core (sigma 0.55, w 0.025) put nowhere.  A first
  # fit at w = 0.20 matched the encircled energy but measurably over-lifted the
  # wide-field halo (sky-patch means and mid-size-body limb widths); w = 0.12
  # with the softer core matches the stars without that excess.  The far halo
  # beyond the truncation window remains stray-light scope.  Replaces the
  # interim FWHM/2.355 value.  Radii in native detector pixels; the wing
  # parameters are an energy fraction, so the kernel conserves flux.
  kernel: {sigma_v: 0.70, sigma_u: 0.70, w: 0.12, r0: 3.0, n: 4.0}
  # Cassini's documented long wings get a wider window than the generic 16 px;
  # the far halo beyond the window is stray-light scope, not kernel scope.
  truncation_px: 32

# The residual geometric distortion left after the navigator applies the
# camera's known distortion model: a radial polynomial in the normalized field
# radius (k1 on rho^2, k2 on rho^4) plus a non-radial wander RMS, measured by
# the star-field FOV distortion analysis.  The corrected field is sub-pixel and
# close to radially symmetric.
distortion_residual: {k1: 3.17e-04, k2: -3.51e-04, nonradial_rms_px: 0.0}

# Electrons a magnitude-0 star deposits per second, sized from the camera's
# Section 5 limiting magnitude at SNR ~5 (a magnitude-0 star of this zero
# point lands the limiting magnitude near the matched-filter detection
# boundary at the camera's read noise and PSF core).  Interim.
star_flux:
  e_per_s_vmag0: 1.0e+7

# Interim plate scale from the published value (Section 12): ~6 urad/px.
sky_pixel_scale_arcsec: 1.237

detector:
  detector_model: ccd
  # 5.2 interim: full well ~110k e- (saturates ~3600 DN at gain 2, below the
  # 4095 ADC clip).
  full_well_e: 110.0e+3
  # 5.2 interim: a typical NAC science exposure, so a converted scene at this
  # exposure keeps today's brightness scale.
  exposure_ref_sec: 1.0
  # 5.2 interim gain states ~233/95/30/13 e-/DN; tour-standard state 2.
  gain_e_per_dn_by_state: {0: 233.0, 1: 95.0, 2: 30.0, 3: 13.0}
  default_gain_state: 2
  read_noise_e: 12.0  # 5.2 interim
  bias_dn: 20.0
  dark_current_e_per_sec: 5.0  # 5.2 interim (RBI-dominated dark)
  # Measured 2026-11-06: the dark sky of 12-bit full-frame raw NAC frames rises
  # linearly from the first line to the last by a median 55 e- (1.8 DN at gain
  # state 2 over 21 frames, 4.0 DN at gain state 3 over 3), the same from 60 ms
  # to 2.6 s, so it accumulates during the readout, not the exposure.
  # CISSCAL's dark model subtracts it from the CALIB product; its shot noise
  # stays.
  readout_dark_e: 55.0
  hot_pixel_fraction: 2.0e-3  # 5.2 interim (~0.15-0.28% of pixels)
  hot_pixel_amplitude_e: 4.0e+4  # 5.2 interim (near full well)
  # 5.2 interim: total-charge fraction bled into the warm column above a hot
  # pixel (the streak integral, not a per-pixel amplitude).
  hot_pixel_column_factor: 0.3
  # Fitted 2026-11-06 in closed loop: dark raw NAC frames rendered at the
  # cohort's exposures and run through the FOM 6 spike detector match the
  # 12-bit dark-sky cohort frames.  Those frames flag about 120-270 spikes per
  # megapixel at every exposure from 60 ms to 2.6 s and 650 at 18 s, so most
  # hits arrive while the frame waits to be read (6 s of dwell); the spikes
  # peak at a median 800-1,300 e- over 4-8 pixels, so the deposits are modest
  # and diffused, not full-well points.  The simulated amplitude tail is
  # shorter (90th percentile ~1,800 e- against 4,000-7,000 e- real).  At gain
  # state 3 the sim flags 4-6x the two real frames, whose stronger line noise
  # raises the detector's threshold.
  cosmic_ray_events_per_pixel_per_sec: 2.0e-5
  cosmic_ray_readout_dwell_sec: 6.0
  cosmic_ray_amplitude_e: 1000.0
  cosmic_ray_spread_px: 0.6
  banding_amplitude_e: 30.0  # 5.2 interim (~30 e- NAC 2 Hz)
  banding_period_px: 64.0  # 5.2 interim (line-readout-rate period)
  bias_pedestal_sigma_dn: 2.0  # 5.2 interim (per-image pedestal jitter)
  bias_row_gradient_dn: 1.0  # 5.2 interim (readout-direction gradient)
  bias_col_gradient_dn: 0.5  # 5.2 interim
  bloom_length: 4  # 5.2 interim (no antiblooming; column bleed above the well)
  quantization: exact
  # The Cassini 12-to-8-bit downlink table (DATA_CONVERSION_TYPE TABLE) the
  # sqrt_lut quantization decodes through; the NAC and WAC share it.  Measured
  # 2026-11-06 from the 26 TABLE frames of the CALIB cohort: the calibrated
  # DN-equivalent step between consecutive raw codes is an integer that grows
  # by one about every ten codes (3 near code 10, 5 near 25, 8 near 55, 13 near
  # 100, 24 near 200), which round(2 * code + 0.055 * code**2) reproduces,
  # alternations included, and which tops out at 4086 DN at code 255.
  sqrt_lut: {codes: 256, linear_dn: 2.0, quadratic_dn: 0.055, whole_dn: true}

# SUM2 and SUM4 summation modes, on-chip; the sources give no separate read
# noise, gain, or well for them, so each inherits the 1x1 values.
readout_modes:
  1: {}
  2: {}
  4: {}

# Electrons per second per native pixel at I/F 1.0, by filter combination.
#
# Measured 2026-11-06 from Cassini ISS raw/CALIB pairs.  CISSCAL writes the
# conversion it applied into every CALIB label (RADIOMETRIC_CORRECTION_TEXT:
# an efficiency factor and an absolute correction factor per filter
# combination), and the camera constant comes from fitting raw DN against
# CALIB I/F on the bright pixels of 12-bit frames, converted to electrons by
# the label's GAIN_CORRECTION, divided by the exposure less EXPOSURE_OFFSET
# and by the summation factor.  The fits put the constant at 16,800 e-/s per
# I/F per unit efficiency for the NAC (31 frames, scatter about 15%) and
# 193,000 for the WAC (16 frames), a ratio of 11.5 that the cameras' apertures
# and pixel solid angles predict to within 30%.
#
# An entry tagged 'measured' is the median of two or more 12-bit pair fits for
# that combination; every other entry is the camera constant times the label's
# efficiency and absolute correction.  Two measured filters depart from that
# model by more than the fit scatter: UV3 (0.32x, two frames at two gains) and
# IR3 (0.74x, three frames).  The 8-bit TABLE frames are excluded: their LUT
# encoding breaks the linear raw/CALIB fit.
filters:
  throughput_e_per_s_per_if:
    BL1+CL2: 110000.0
    BL1+GRN: 5750.0
    CL1+BL2: 24700.0
    CL1+CB1: 62300.0
    CL1+CB2: 31300.0
    CL1+CB3: 6380.0
    CL1+CL2: 1450000.0  # measured, 9 frames
    CL1+GRN: 413000.0  # measured, 8 frames
    CL1+IR1: 471000.0  # measured, 2 frames
    CL1+IR3: 65300.0  # measured, 3 frames
    CL1+MT1: 11000.0
    CL1+MT2: 13400.0
    CL1+MT3: 13900.0
    CL1+UV3: 19600.0  # measured, 2 frames
    HAL+CL2: 28700.0
    IR2+CL2: 167000.0
    IR2+IR1: 56400.0
    IR2+IR3: 51400.0
    IR4+CL2: 11800.0
    IR4+IR3: 9630.0
    RED+CL2: 445000.0
    RED+GRN: 141000.0
    RED+IR1: 141000.0
    UV1+CL2: 13100.0
    UV2+CL2: 20800.0
    UV2+UV3: 6700.0
  # The combination the star zero point refers to: it is sized from the
  # published clear-filter limiting magnitude.
  clear: CL1+CL2
  # CISSCAL gives the polarizers the efficiency of the clear element they
  # replace, so the real products carry the same DN-to-I/F scale with or
  # without a polarizer; each folds onto that clear element.  The NAC
  # polarizers sit in wheel 1.
  polarizer_clear: {P0: CL1, P60: CL1, P120: CL1, IRP0: CL1}

artifact_modes:
  offered:
    - missing_lines
    - partial_lines
    - alternating_lines
    - truncated_frame
    - missing_blocks
    - dead_pixels
    - dead_columns
    - hot_pixels
    - banding_coherent
    - bias_structure
    - dark_ramp
    - bloom
    - radiation_transients
    - bright_dark_pairs
    - quantization_sqrt_lut
    - quantization_ls8b
    - fixed_pattern
    - compression_dct
  # Per-mode shape defaults (interim, 5.2).  An activation key is never
  # cataloged: a mode activates only when a scene sets it.  Shapes here are the
  # values a scene inherits when it names a mode without spelling every
  # parameter.
  shape_defaults:
    # ~30 e- NAC 2 Hz horizontal banding, line-readout-rate period.
    banding_coherent: {amplitude_e: 30.0, period_px: 64.0, orientation: horizontal}
    # Per-image pedestal jitter plus readout-direction gradients.
    bias_structure: {pedestal_sigma_dn: 2.0, row_gradient_dn: 1.0, col_gradient_dn: 0.5}
    # RBI-dominated dark grows toward the last readout line.
    dark_ramp: {kind: dark_gradient, amplitude_e: 150.0}
    bloom: {bloom_length: 4}
    # Anti-blooming vertical 2-px pairs in unsummed long exposures.
    bright_dark_pairs: {amplitude_e: 4.0e+3}
    # No published ISS rate; the interplanetary regime near full-well amp.
    radiation_transients: {amplitude_e: 4.0e+4}
    # Dust donuts (<1% each) accumulating over the mission.
    fixed_pattern: {dust_donut_count: 5}
