offset:
  star_refinement_enabled: true
  star_refinement_nsigma: 3
  star_refinement_search_limit: [2.5, 2.5]
  star_refinement_max_reduced_chi2: 10.0  # reject fits with poor goodness-of-fit
  star_refinement_min_reduced_chi2: 0.1   # reject fits where background overfits the signal (chi2 near 0)
  star_refinement_min_peak_snr: 5.0       # reject fits below this amplitude SNR
  star_refinement_max_pos_err: 0.5        # reject if 1-sigma position uncertainty exceeds this (pixels)
  log_star_refinement_detail: false       # log all fit metrics and thresholds per star for rejection debugging
  correlation_fft_upsample_factor: 128
  default_gaussian_blur: 0.25   # (px) reserved; no code reads it
  maximum_blur: 100.0           # (px) local-maximum mask dilation; reserved, unread
  maximum_blur_error_bars: 60.0 # (px) as maximum_blur, for the error-bar pass;
                                # reserved, unread
  median_filter_size:           # (px) median window; no value set, and unread
  median_filter_blur: 1.2       # (px) reserved; no code reads it
  median_filter_footprint: circle
  num_bodies_threshold: 3
  bodies_cov_threshold: 0.0005
  model_cov_threshold: 25       # reserved; no code reads it and no unit is recorded
  model_edge_pixels: 5
  secondary_corr_search_size: [15, 15]
  lowest_confidence: 0.01
  stars_model_diff_threshold: 2
  stars_override_threshold: 6
  secondary_max_attempts: 10
  secondary_corr_threshold: 1
  secondary_corr_peak_threshold: 0.2
  secondary_corr_tweak_threshold: 0.7
  secondary_max_num_exhaustive: 9
