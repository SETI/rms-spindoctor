stars:
  catalogs: [ucac4, tycho2, ybsc]  # Order of most precise to least
  body_conflict_margin: 5  # (px) slop around a star when testing body overlap
  default_star_class: G0
  stellar_aberration: true
  proper_motion: true
  max_stars: 100
  max_movement_steps: 50
  label_font: liberation2/LiberationMono-Bold.ttf
  label_font_size: 18
  label_font_color: [255, 0, 0]  # Red
  label_star_color: [255, 0, 0]  # Red
  duplicate_ra_dec_threshold_arcsec: 5  # Closer than this - stars are true duplicates
  duplicate_vmag_threshold: 3  # Less than this - stars are true duplicates
  overlapping_vmag_threshold: 2  # Less than this - remove both stars when visually overlapping

  min_confidence: 0.9
  max_smear: 100  # (px) smear length above which a star is dropped
  # Scales the predicted_snr entry of a star's reported reliability breakdown:
  # the entry reaches 1.0 at this effective SNR and is snr / min_predicted_snr
  # below it.  This is a reporting value only.  It does not drop a star and it
  # does not change the reliability the per-type threshold compares, so it
  # cannot affect which features a run uses.  0.0 uses the default scale, where
  # an SNR of 50 saturates the entry.
  min_predicted_snr: 0.0
  ring_occlusion_enabled: true
  # Fraction of the star's conflict-window pixels that must fall inside an
  # opaque annulus before the star is marked ring-occluded. Membership is
  # tested per pixel, so a star sitting on a ringlet edge or straddling a gap
  # is judged by how much of its window is actually over opaque material
  # rather than by the window's median radius.
  ring_occlusion_min_opaque_fraction: 0.25
  ring_occlusion_radii_km:
    SATURN:
      - [74490.0, 91980.0]    # C ring
      - [91980.0, 117580.0]   # B ring
      - [122170.0, 136780.0]  # A ring
    URANUS:
      - [41837.0, 51149.0]    # main ring system (6, 5, 4, alpha, beta, eta, gamma, delta, epsilon)
    NEPTUNE:
      - [40900.0, 62933.0]    # Galle through Adams rings
