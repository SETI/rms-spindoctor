# Cassini ISS per-camera configuration (NAC + WAC).
#
# Numeric values placed before phase-10 calibration carry inline
# `# PLACEHOLDER` markers; the loader accepts them as the starting
# guess. Calibration phase replaces every PLACEHOLDER value with a
# fitted estimate.
cassini_iss:
  nac:
    data_units: raw_dn
    extfov_margin_vu:
      256: [13, 25]
      512: [25, 50]
      1024: [50, 140]
    star_psf_sigma: 0.54
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    # Height of a planet's visible limb above its reference ellipsoid, where the
    # limb fit places the predicted limb (nav_model/limb_placement.py).  Measured
    # 2026-10-26 on Cassini ISS frames: the image limb (the gradient ridge after the
    # navigation blur) above the 1-bar ellipsoid, from 95 full-disc frames (88 WAC,
    # 7 NAC) fit for translation and altitude together and 10 WAC spoke and ring
    # observations at star or F ring bundle pointing.  Broadband and continuum
    # filters follow the phase table; MT2 and MT3 sit higher by their median excess
    # on 11 and 10 frames.  Scatter about the table: MAD sigma 50 km on the full
    # discs (rms 86 km without two phase-166 discs the fit misreads) and about 100
    # km on the pointed observations (rms 106 km without rev 115 SPKMVDFHP004, at
    # -410 km, which is unexplained).  Each camera applies the model only over the
    # scales and phases it was measured at; elsewhere the limb keeps its ridge.
    visible_limb_altitude: &coiss_nac_visible_limb_altitude
      SATURN: &coiss_saturn_visible_limb
        altitude_km: [[30.0, 57.0], [60.0, 65.0], [90.0, 150.0], [112.0, 200.0], [140.0, 245.0], [163.0, 325.0]]
        sigma_km: 100.0
        band_offsets_km: {MT2: 125.0, MT3: 235.0}
        phase_deg_range: [25.0, 164.0]
        km_per_px_range: [123.0, 260.0]
    noise:
      saturation_dn: 4095          # 12-bit ADC
      full_well_dn: 4095
      expected_noise_dn: 4.0       # PLACEHOLDER — calibrate in Phase 10
      marker_value: 0              # CISS RAW missing-pixel marker
      read_noise_dn: 4.0           # PLACEHOLDER — calibrate in Phase 10
      # interim: photometric zero point (DN a vmag-0 star deposits per second),
      # the electron zero point over the NAC standard gain state.
      star_flux_dn_per_s_vmag0: 3.33e5
    image_quality_thresholds:
      blank_max_dn: 5.0
      saturation_threshold_dn: 4095
      noisy_threshold_dn: 10.0
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
  wac:
    data_units: raw_dn
    extfov_margin_vu:
      256: [5, 10]
      512: [5, 10]
      1024: [5, 10]
    star_psf_sigma: 0.77
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    visible_limb_altitude: &coiss_wac_visible_limb_altitude
      SATURN:
        <<: *coiss_saturn_visible_limb
        km_per_px_range: [67.0, 260.0]
    noise:
      saturation_dn: 4095
      full_well_dn: 4095
      expected_noise_dn: 4.0       # PLACEHOLDER — calibrate in Phase 10
      marker_value: 0
      read_noise_dn: 4.0           # PLACEHOLDER — calibrate in Phase 10
      # interim: photometric zero point (DN a vmag-0 star deposits per second),
      # the electron zero point over the WAC standard gain state.
      star_flux_dn_per_s_vmag0: 9.29e4
    image_quality_thresholds:
      blank_max_dn: 5.0
      saturation_threshold_dn: 4095
      noisy_threshold_dn: 10.0
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10

# Calibrated (I/F) variants of the Cassini ISS cameras.  The CISS
# CALIB pipeline produces reflectance values typically <= 1.0 for
# illuminated targets; raw-DN thresholds (blank floor 5.0 DN,
# saturation 4095 DN) would mis-classify every CALIB image as `blank`.
# The Cassini observation loader picks this block when the input
# filename contains ``_CALIB``.
#
# Saturation policy (Phase 10 §F): there is no `saturation_threshold_if`
# field.  The CISS CALIB pipeline applies an exposure-, filter-, and
# gain-dependent calibration, so a single I/F constant cannot identify
# the physically saturated DN ceiling.  The orchestrator therefore
# leaves the per-pixel saturation mask empty for calibrated_if input
# (see `spindoctor.nav_orchestrator.orchestrator._build_saturation_mask`) and
# the classifier sees an `inf` saturation threshold so
# `saturation_frac` is always 0.0 and the `fully_overexposed`
# early-out is disabled.  Operators who need accurate saturation flags
# on a Cassini frame must navigate the matching `_RAW.IMG` (CISS
# calibration is not a geometric reprojection, so raw and calibrated
# share pixel coordinates).
cassini_iss_calib:
  nac:
    data_units: calibrated_if
    extfov_margin_vu:
      256: [13, 25]
      512: [25, 50]
      1024: [50, 140]
    star_psf_sigma: 0.54
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    visible_limb_altitude: *coiss_nac_visible_limb_altitude
    noise:
      marker_value: 0                # CISS CALIB fills a missing pixel with 0.0
    image_quality_thresholds:
      blank_max_if: 1.0e-4            # PLACEHOLDER — calibrate in Phase 10
      noisy_threshold_if: 0.005       # PLACEHOLDER — calibrate in Phase 10
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
  wac:
    data_units: calibrated_if
    extfov_margin_vu:
      256: [5, 10]
      512: [5, 10]
      1024: [5, 10]
    star_psf_sigma: 0.77
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    visible_limb_altitude: *coiss_wac_visible_limb_altitude
    noise:
      marker_value: 0
    image_quality_thresholds:
      blank_max_if: 1.0e-4
      noisy_threshold_if: 0.005
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
