# Cassini ISS per-camera configuration (NAC + WAC).
#
# Numeric values placed before phase-10 calibration carry inline
# `# PLACEHOLDER` markers; the loader accepts them as the starting
# guess. Calibration phase replaces every PLACEHOLDER value with a
# fitted estimate.
cassini_iss:
  nac:
    data_units: raw_dn
    extfov_margin_vu:
      256: [13, 25]
      512: [25, 50]
      1024: [50, 140]
    star_psf_sigma: 0.54
    # Gaussian sigma (px) of the narrowest star the camera records, per
    # image row count (summing narrows a star in pixel units).  A source
    # more concentrated than this allows is a cosmic-ray hit.  Each value
    # is a little below the sigma of the Gaussian whose brightest-pixel
    # share equals that of the narrowest star measured: 122 stars on 24
    # full-size F ring frames (narrowest sigma 0.54), 935 stars on 28 SUM2
    # frames (0.33), and 87 stars on 8 SUM4 frames (0.25).  At 0.22 a 2x2
    # block may hold the whole box, so on 256-row frames only the pixel
    # and pair shares can set a source aside.
    star_sharpness_psf_sigma:
      256: 0.22
      512: 0.3
      1024: 0.5
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      saturation_dn: 4095          # 12-bit ADC
      full_well_dn: 4095
      expected_noise_dn: 4.0       # PLACEHOLDER — calibrate in Phase 10
      marker_value: 0              # CISS RAW missing-pixel marker
      read_noise_dn: 4.0           # PLACEHOLDER — calibrate in Phase 10
      # interim: photometric zero point (DN a vmag-0 star deposits per second),
      # the electron zero point over the NAC standard gain state.
      star_flux_dn_per_s_vmag0: 3.33e5
    image_quality_thresholds:
      blank_max_dn: 5.0
      saturation_threshold_dn: 4095
      noisy_threshold_dn: 10.0
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
  wac:
    data_units: raw_dn
    extfov_margin_vu:
      256: [5, 10]
      512: [5, 10]
      1024: [5, 10]
    star_psf_sigma: 0.77
    # As for the NAC: 18 stars on 6 full-size F ring frames (narrowest
    # sigma 0.78) and 1020 stars on 17 SUM2 frames (0.46).  No SUM4 frame
    # with measurable stars was found, so 256-row frames are not tested.
    star_sharpness_psf_sigma:
      512: 0.4
      1024: 0.7
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    # See the cassini_iss_calib WAC block for the calibration.
    model_error_floor_px:
      RingAnnulusNav: 0.9
    noise:
      saturation_dn: 4095
      full_well_dn: 4095
      expected_noise_dn: 4.0       # PLACEHOLDER — calibrate in Phase 10
      marker_value: 0
      read_noise_dn: 4.0           # PLACEHOLDER — calibrate in Phase 10
      # interim: photometric zero point (DN a vmag-0 star deposits per second),
      # the electron zero point over the WAC standard gain state.
      star_flux_dn_per_s_vmag0: 9.29e4
    image_quality_thresholds:
      blank_max_dn: 5.0
      saturation_threshold_dn: 4095
      noisy_threshold_dn: 10.0
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10

# Calibrated (I/F) variants of the Cassini ISS cameras.  The CISS
# CALIB pipeline produces reflectance values typically <= 1.0 for
# illuminated targets; raw-DN thresholds (blank floor 5.0 DN,
# saturation 4095 DN) would mis-classify every CALIB image as `blank`.
# The Cassini observation loader picks this block when the input
# filename contains ``_CALIB``.
#
# Saturation policy (Phase 10 §F): there is no `saturation_threshold_if`
# field.  The CISS CALIB pipeline applies an exposure-, filter-, and
# gain-dependent calibration, so a single I/F constant cannot identify
# the physically saturated DN ceiling.  The orchestrator therefore
# leaves the per-pixel saturation mask empty for calibrated_if input
# (see `spindoctor.nav_orchestrator.orchestrator._build_saturation_mask`) and
# the classifier sees an `inf` saturation threshold so
# `saturation_frac` is always 0.0 and the `fully_overexposed`
# early-out is disabled.  Operators who need accurate saturation flags
# on a Cassini frame must navigate the matching `_RAW.IMG` (CISS
# calibration is not a geometric reprojection, so raw and calibrated
# share pixel coordinates).
cassini_iss_calib:
  nac:
    data_units: calibrated_if
    extfov_margin_vu:
      256: [13, 25]
      512: [25, 50]
      1024: [50, 140]
    star_psf_sigma: 0.54
    # Gaussian sigma (px) of the narrowest star the camera records, per
    # image row count (summing narrows a star in pixel units).  A source
    # more concentrated than this allows is a cosmic-ray hit.  Each value
    # is a little below the sigma of the Gaussian whose brightest-pixel
    # share equals that of the narrowest star measured: 122 stars on 24
    # full-size F ring frames (narrowest sigma 0.54), 935 stars on 28 SUM2
    # frames (0.33), and 87 stars on 8 SUM4 frames (0.25).  At 0.22 a 2x2
    # block may hold the whole box, so on 256-row frames only the pixel
    # and pair shares can set a source aside.
    star_sharpness_psf_sigma:
      256: 0.22
      512: 0.3
      1024: 0.5
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      marker_value: 0                # CISS CALIB fills a missing pixel with 0.0
    image_quality_thresholds:
      blank_max_if: 1.0e-4            # PLACEHOLDER — calibrate in Phase 10
      noisy_threshold_if: 0.005       # PLACEHOLDER — calibrate in Phase 10
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
  wac:
    data_units: calibrated_if
    extfov_margin_vu:
      256: [5, 10]
      512: [5, 10]
      1024: [5, 10]
    star_psf_sigma: 0.77
    # As for the NAC: 18 stars on 6 full-size F ring frames (narrowest
    # sigma 0.78) and 1020 stars on 17 SUM2 frames (0.46).  No SUM4 frame
    # with measurable stars was found, so 256-row frames are not tested.
    star_sharpness_psf_sigma:
      512: 0.4
      1024: 0.7
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    # Model-error floor (px) of the annulus correlation on this camera, in
    # place of RingAnnulusNav's tuning floor (0.13 px, which fits the NAC: over
    # the 401 NAC annulus answers of the 20,584-frame F ring bundle run their
    # Mahalanobis distance to the bundle has median 0.71 and 1.2% beyond 3).
    # The WAC annulus template is off by a near-constant 1.5-1.9 px on whole
    # observations (rev 173 and rev 199 spoke movies) while the correlation
    # reports 0.2-0.7 px; the NCC curvature cannot see a template that misplaces
    # the edges.  Calibrated on the run's 995 WAC annulus answers (44
    # observations) against the bundle pointing corrected for the WAC bundle's
    # constant offset (0.43, 0.69) px, the median star-minus-bundle offset of
    # the run's 490 WAC star refinements, with a third of the observations held
    # out: at 0.13 px, 44% (fit) and 44% (held out) of the answers lie beyond a
    # Mahalanobis distance of 2 and 36% and 27% beyond 3; at 0.9 px 11.8% and
    # 2.0% beyond 2, none beyond 3 (a Gaussian gives 13.5% and 1.1%).  The 134
    # answers whose stars confirm the bundle have none beyond 2.  The median is
    # 0.56 either way: most WAC answers already report a wide localization
    # spread, which the floor does not change.
    model_error_floor_px:
      RingAnnulusNav: 0.9
    noise:
      marker_value: 0
    image_quality_thresholds:
      blank_max_if: 1.0e-4
      noisy_threshold_if: 0.005
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10

# The spacecraft's turning during an exposure, from which the star model draws each
# star's streak.  The reconstructed C-kernels hold one attitude every 4 s and on about a
# third of their intervals repeat the attitude before, so over a 1 s exposure they show
# either no motion or about twice the true motion; the as-flown predicted C-kernels hold
# the commanded constant rate (#768).  The motion is read from the predicted kernels
# without furnishing them, so the pointing stays the reconstructed kernels'.
cassini_iss_exposure_motion:
  # The SPICE id of the spacecraft, under which the SPICE database lists its kernels.
  spacecraft_id: -82
  # The CK object whose attitude is read: the spacecraft bus.  A constant rotation
  # between the bus and a camera cancels from the motion, so it serves both cameras.
  ck_object_id: -82000
  # The SPICE database's name of the predicted C-kernels, and the release whose files
  # are the as-flown set (CK-predicted-v02/*py_as_flown.bc, 2004-01-09T12:25 to
  # 2017-09-15); the name also lists the earlier release in CK-predicted.
  predicted_ck_name: CAS-CK-PREDICTED
  predicted_ck_version: V02
  # The largest ratio of a measured streak to the smear the as-flown kernels predict:
  # over 1,101 F ring frames predicted to smear at least 2 px whose streak could be
  # measured the ratio is at most 1.20 (99th percentile 1.12), and over the 140 measured
  # at least 4.5 px 0.85 to 1.04.  It vouches for the prediction, so frames predicted
  # under 4.5 / 1.5 = 3 px are not measured, and a predicted streak of 4.5 px or more
  # stands in where none can be measured.
  predicted_max_streak_to_predicted: 1.5
  # Where no predicted kernel covers an exposure, the motion is the reconstructed
  # kernels' mean rate over this many seconds either side of mid-exposure.  Over 1,796
  # F ring NAC frames 8 s puts the predicted streak a median 0.42 px from the measured
  # one (96% within 1 px); longer windows average across turns (30 s is off by up to
  # 10 px on a frame within 30 s of one).
  reconstructed_half_window_s: 8.0

# Star photometry of the Cassini ISS cameras, read by ObsCassiniISS.star_max_usable_vmag
# for raw and calibrated images alike.  A star of V magnitude m and the default spectral
# class (G0) deposits
#     flux_electrons_per_s_vmag0 * 10**(-0.4 * (m + filter_mag_offset[pair])) * texp
#         / electrons_per_dn[GAIN_MODE_ID]
# DN.  The dimmest visible star deposits min_detectable_dn, and the catalog search reaches
# search_depth_mag past it, as the previous navigation software did (flux.py and
# model_star.py, _compute_dimmest_visible_star_vmag, which searched 1 mag deeper).
#
# flux_electrons_per_s_vmag0 and filter_mag_offset are generated by
# util/star_photometry/cassini_iss_filter_offsets.py from the CISSCAL system-transmission
# and quantum-efficiency-correction tables of the Cassini ISS archive's calibration
# volume, through that software's photometric chain (a 5920 K photon spectrum scaled to
# V, times the system transmission, times the collecting area, times its per-filter
# correction for G-class stars).  A filter pair whose CISSCAL table is empty passes no
# light and is absent.  electrons_per_dn is CISSCAL's gain (30.27 NAC, 27.68 WAC at
# 29 e/DN) over its gain ratio for each state.
cassini_iss_star_photometry:
  nac:
    flux_electrons_per_s_vmag0: 2.304e+08
    electrons_per_dn:
      '12 ELECTRONS PER DN': 12.841
      '29 ELECTRONS PER DN': 30.27
