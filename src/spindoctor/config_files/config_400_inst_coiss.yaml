# Cassini ISS per-camera configuration (NAC + WAC).
#
# Numeric values placed before phase-10 calibration carry inline
# `# PLACEHOLDER` markers; the loader accepts them as the starting
# guess. Calibration phase replaces every PLACEHOLDER value with a
# fitted estimate.
cassini_iss:
  nac:
    data_units: raw_dn
    extfov_margin_vu:
      256: [13, 25]
      512: [25, 50]
      1024: [50, 140]
    star_psf_sigma: 0.54
    # Largest peak above the local background, in noise sigmas per unit of
    # predicted SNR, of a source a lone star can be, as measured on the
    # calibrated camera below (the ratio is in noise sigmas, so it does not
    # depend on the image's units).
    star_max_peak_per_predicted_snr: 150.0
    # Fraction of the offset window, per axis, inside which a lone star is
    # believed; see the calibrated camera below.
    one_star_ellipse_fraction: 0.6
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      saturation_dn: 4095          # 12-bit ADC
      full_well_dn: 4095
      expected_noise_dn: 4.0       # PLACEHOLDER — calibrate in Phase 10
      marker_value: 0              # CISS RAW missing-pixel marker
      read_noise_dn: 4.0           # PLACEHOLDER — calibrate in Phase 10
      # interim: photometric zero point (DN a vmag-0 star deposits per second),
      # the electron zero point over the NAC standard gain state.
      star_flux_dn_per_s_vmag0: 3.33e5
    image_quality_thresholds:
      blank_max_dn: 5.0
      saturation_threshold_dn: 4095
      noisy_threshold_dn: 10.0
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
  wac:
    data_units: raw_dn
    # Every technique, the star searches among them, finds offsets only
    # inside this margin.  98.7% of the 794 WAC star frames of the F ring
    # movies set aside for tuning have each axis of their pointing error
    # within 12.4 full-frame pixels (the error reaches 14), so a full frame
    # reaches 13 px, a 2x2 summed frame 7 px, and a 4x4 summed frame 4 px
    # (its 5 px is kept); no margin was narrowed.
    # Provisional until full runs set every camera's window.
    extfov_margin_vu:
      256: [5, 10]
      512: [7, 10]
      1024: [13, 13]
    star_psf_sigma: 0.77
    # As for the NAC; see the calibrated camera below.
    star_max_peak_per_predicted_snr: 40.0
    # Wider than the NAC's; see the calibrated camera below.
    one_star_ellipse_fraction: 0.7
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      saturation_dn: 4095
      full_well_dn: 4095
      expected_noise_dn: 4.0       # PLACEHOLDER — calibrate in Phase 10
      marker_value: 0
      read_noise_dn: 4.0           # PLACEHOLDER — calibrate in Phase 10
      # interim: photometric zero point (DN a vmag-0 star deposits per second),
      # the electron zero point over the WAC standard gain state.
      star_flux_dn_per_s_vmag0: 9.29e4
    image_quality_thresholds:
      blank_max_dn: 5.0
      saturation_threshold_dn: 4095
      noisy_threshold_dn: 10.0
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10

# Calibrated (I/F) variants of the Cassini ISS cameras.  The CISS
# CALIB pipeline produces reflectance values typically <= 1.0 for
# illuminated targets; raw-DN thresholds (blank floor 5.0 DN,
# saturation 4095 DN) would mis-classify every CALIB image as `blank`.
# The Cassini observation loader picks this block when the input
# filename contains ``_CALIB``.
#
# Saturation policy (Phase 10 §F): there is no `saturation_threshold_if`
# field.  The CISS CALIB pipeline applies an exposure-, filter-, and
# gain-dependent calibration, so a single I/F constant cannot identify
# the physically saturated DN ceiling.  The orchestrator therefore
# leaves the per-pixel saturation mask empty for calibrated_if input
# (see `spindoctor.nav_orchestrator.orchestrator._build_saturation_mask`) and
# the classifier sees an `inf` saturation threshold so
# `saturation_frac` is always 0.0 and the `fully_overexposed`
# early-out is disabled.  Operators who need accurate saturation flags
# on a Cassini frame must navigate the matching `_RAW.IMG` (CISS
# calibration is not a geometric reprojection, so raw and calibrated
# share pixel coordinates).
cassini_iss_calib:
  nac:
    data_units: calibrated_if
    extfov_margin_vu:
      256: [13, 25]
      512: [25, 50]
      1024: [50, 140]
    star_psf_sigma: 0.54
    # Largest peak above the local background, in noise sigmas per unit of
    # predicted SNR, of a source a lone star can be.  The value is measured
    # from a sample, and nothing derives it from the camera's photometry: of
    # 3463 stars found at the published bundles' pointing on the F ring and
    # spokes star frames the brightest is 126 (median 10).  Two lone
    # sources at 166 and 259, 88 and 48 px from the bundle's answer, are
    # not taken.
    # Grounding the bound in photometry is issue #844.
    star_max_peak_per_predicted_snr: 150.0
    # Fraction of the offset window, per axis, inside which
    # StarUniqueMatchNav believes a lone star: the ellipse whose semi-axes
    # are the window's half-widths times this fraction.  The whole window is
    # searched, so a source nearly as bright anywhere in it makes the match
    # ambiguous, but nothing cross-checks a single detection, and the wider
    # the region it may come from, the likelier an artifact is the brightest
    # thing in it.  Every camera sets its own fraction, in (0, 1], so the
    # ellipse never reaches past the window.
    # Replayed on the F ring and spokes star frames, the NAC's 334
    # one-star answers within 2 px of the published bundles' reach 0.55 of
    # the window, and the 61 farther from them lie between 0.01 and 0.56 of
    # it, so a narrower ellipse would not separate the two.
    # 0.6 is the ratio of the 30 px lone-star radius to the 50 px search
    # half-width on ISS_006RI_LPHRLFMOV001_PRIME, where radii of 30, 40,
    # and 50 px navigated 771, 772, and 750 of 1030 frames, none wrong;
    # those were measured with a square 50 px window and the earlier pair
    # search, before stars took the NAC's (50, 140) px offset window of a
    # full frame, whose ellipse is (30, 84) px.
    one_star_ellipse_fraction: 0.6
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      marker_value: 0                # CISS CALIB fills a missing pixel with 0.0
    image_quality_thresholds:
      blank_max_if: 1.0e-4            # PLACEHOLDER — calibrate in Phase 10
      noisy_threshold_if: 0.005       # PLACEHOLDER — calibrate in Phase 10
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
  wac:
    data_units: calibrated_if
    # The same margin as the raw-image camera above.
    extfov_margin_vu:
      256: [5, 10]
      512: [7, 10]
      1024: [13, 13]
    star_psf_sigma: 0.77
    # As for the NAC, and measured the same way: of 191 stars found at the
    # published bundles' pointing on the F ring and spokes star frames the
    # brightest is 20.8 (median 10.6); the bound is about twice that.
    star_max_peak_per_predicted_snr: 40.0
    # As for the NAC, but wider: the WAC's pointing error reaches the edge
    # of its window (see extfov_margin_vu above).  At 0.6, 12 lone
    # stars of the spokes movie ISS_173RI_SPOKEMOV003_PRIME (W1728775362
    # through W1728801375) lie between 0.60 and 0.72 of the 13 px window of
    # a full frame and are refused.  At 0.7 the 11 within 0.70 are taken,
    # and a star check finds the star at each answer; on W1728776493 it
    # finds nothing at the published bundle's answer, 3.8 px away.  No
    # other answer of the replayed F ring and spokes star frames changes.
    # 0.7 is 9.1 px of a full frame's (13, 13) px window and (4.9, 7.0) px
    # of a 2x2 summed frame's (7, 10) px one.
    one_star_ellipse_fraction: 0.7
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      marker_value: 0
    image_quality_thresholds:
      blank_max_if: 1.0e-4
      noisy_threshold_if: 0.005
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
