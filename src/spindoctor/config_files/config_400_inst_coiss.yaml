# Cassini ISS per-camera configuration (NAC + WAC).
#
# Numeric values placed before phase-10 calibration carry inline
# `# PLACEHOLDER` markers; the loader accepts them as the starting
# guess. Calibration phase replaces every PLACEHOLDER value with a
# fitted estimate.
cassini_iss:
  nac:
    data_units: raw_dn
    extfov_margin_vu:
      256: [13, 25]
      512: [25, 50]
      1024: [50, 140]
    star_psf_sigma: 0.54
    # Star search reach for this camera's pointing error, measured against the
    # published F ring bundle's per-frame pointing on the 10362 NAC star frames
    # of the movies set aside for tuning: the search window's half-width holds
    # 98.7% of them (each axis), and a lone star is believed within the radius
    # that holds 90.9% (StarUniqueMatchNav; the NAC error reaches 82 px).
    star_search_window_px: 50.0
    star_one_star_radius_px: 30.0
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      saturation_dn: 4095          # 12-bit ADC
      full_well_dn: 4095
      expected_noise_dn: 4.0       # PLACEHOLDER — calibrate in Phase 10
      marker_value: 0              # CISS RAW missing-pixel marker
      read_noise_dn: 4.0           # PLACEHOLDER — calibrate in Phase 10
      # interim: photometric zero point (DN a vmag-0 star deposits per second),
      # the electron zero point over the NAC standard gain state.
      star_flux_dn_per_s_vmag0: 3.33e5
    image_quality_thresholds:
      blank_max_dn: 5.0
      saturation_threshold_dn: 4095
      noisy_threshold_dn: 10.0
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
  wac:
    data_units: raw_dn
    extfov_margin_vu:
      256: [5, 10]
      512: [5, 10]
      1024: [5, 10]
    star_psf_sigma: 0.77
    # Star search reach at the same coverage as the NAC's, from the 794 WAC
    # star frames of the F ring movies set aside for tuning: 98.7% of them
    # have each axis of their pointing error within 12.4 px, and 90.9% lie
    # within 8.3 px (the WAC error reaches 14 px).  The NAC's 50 px let a
    # brighter source anywhere in it veto a lone WAC star.
    star_search_window_px: 13.0
    star_one_star_radius_px: 9.0
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      saturation_dn: 4095
      full_well_dn: 4095
      expected_noise_dn: 4.0       # PLACEHOLDER — calibrate in Phase 10
      marker_value: 0
      read_noise_dn: 4.0           # PLACEHOLDER — calibrate in Phase 10
      # interim: photometric zero point (DN a vmag-0 star deposits per second),
      # the electron zero point over the WAC standard gain state.
      star_flux_dn_per_s_vmag0: 9.29e4
    image_quality_thresholds:
      blank_max_dn: 5.0
      saturation_threshold_dn: 4095
      noisy_threshold_dn: 10.0
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10

# Calibrated (I/F) variants of the Cassini ISS cameras.  The CISS
# CALIB pipeline produces reflectance values typically <= 1.0 for
# illuminated targets; raw-DN thresholds (blank floor 5.0 DN,
# saturation 4095 DN) would mis-classify every CALIB image as `blank`.
# The Cassini observation loader picks this block when the input
# filename contains ``_CALIB``.
#
# Saturation policy (Phase 10 §F): there is no `saturation_threshold_if`
# field.  The CISS CALIB pipeline applies an exposure-, filter-, and
# gain-dependent calibration, so a single I/F constant cannot identify
# the physically saturated DN ceiling.  The orchestrator therefore
# leaves the per-pixel saturation mask empty for calibrated_if input
# (see `spindoctor.nav_orchestrator.orchestrator._build_saturation_mask`) and
# the classifier sees an `inf` saturation threshold so
# `saturation_frac` is always 0.0 and the `fully_overexposed`
# early-out is disabled.  Operators who need accurate saturation flags
# on a Cassini frame must navigate the matching `_RAW.IMG` (CISS
# calibration is not a geometric reprojection, so raw and calibrated
# share pixel coordinates).
cassini_iss_calib:
  nac:
    data_units: calibrated_if
    extfov_margin_vu:
      256: [13, 25]
      512: [25, 50]
      1024: [50, 140]
    star_psf_sigma: 0.54
    # The same measured reach as the raw-image camera above.
    star_search_window_px: 50.0
    star_one_star_radius_px: 30.0
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      marker_value: 0                # CISS CALIB fills a missing pixel with 0.0
    image_quality_thresholds:
      blank_max_if: 1.0e-4            # PLACEHOLDER — calibrate in Phase 10
      noisy_threshold_if: 0.005       # PLACEHOLDER — calibrate in Phase 10
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
  wac:
    data_units: calibrated_if
    extfov_margin_vu:
      256: [5, 10]
      512: [5, 10]
      1024: [5, 10]
    star_psf_sigma: 0.77
    # The same measured reach as the raw-image camera above.
    star_search_window_px: 13.0
    star_one_star_radius_px: 9.0
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      marker_value: 0
    image_quality_thresholds:
      blank_max_if: 1.0e-4
      noisy_threshold_if: 0.005
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
