# Cassini ISS per-camera configuration (NAC + WAC).
#
# Numeric values placed before phase-10 calibration carry inline
# `# PLACEHOLDER` markers; the loader accepts them as the starting
# guess. Calibration phase replaces every PLACEHOLDER value with a
# fitted estimate.
cassini_iss:
  nac:
    data_units: raw_dn
    extfov_margin_vu:
      256: [13, 25]
      512: [25, 50]
      1024: [50, 140]
    star_psf_sigma: 0.54
    # Largest peak above the local background, in noise sigmas per unit of
    # predicted SNR, of a source a lone star can be, as measured on the
    # calibrated camera below (the ratio is in noise sigmas, so it does not
    # depend on the image's units).
    star_max_peak_per_predicted_snr: 150.0
    # Fraction of the offset window, per axis, inside which a lone star is
    # believed; see the calibrated camera below.
    one_star_ellipse_fraction: 0.6
    star_psf_sizes:
      7: [15, 15]
      8: [13, 13]
      9: [11, 11]
      100: [9, 9]
    fit_camera_rotation: false
    max_rotation_deg: 5.0
    noise:
      saturation_dn: 4095          # 12-bit ADC
      marker_value: 0              # CISS RAW missing-pixel marker
      read_noise_dn: 4.0           # PLACEHOLDER — calibrate in Phase 10
      # interim: photometric zero point (DN a vmag-0 star deposits per second),
      # the electron zero point over the NAC standard gain state.
      star_flux_dn_per_s_vmag0: 3.33e5
      # The summed readout modes, keyed by the binning factor: the read noise of
      # one summed pixel in DN and the zero point in DN/s.  A mode this table
      # leaves out reads with the values above.  The published sources (Porco et
      # al. 2004, the ISS Data User's Guide, and West et al. 2010) give SUM2 and
      # SUM4 no read noise or gain of their own, so each reads as the
      # full-resolution camera at gain state 2: the published 12 e- read noise over
      # the published 30 e-/DN is 12 / 30 = 0.400 DN, and summing on the chip keeps
      # a star's charge, so the zero point stays 3.33e5 DN/s.  read_noise_dn above
      # is a placeholder above that 0.400 DN, so part of the step from the unbinned
      # star limit to the summed one comes from the placeholder; 0.400 DN is below
      # the limit's 1 DN noise floor, so the limit reads 1 DN in these modes.
      by_binning:
        2: {read_noise_dn: 0.400, star_flux_dn_per_s_vmag0: 3.33e5}
        4: {read_noise_dn: 0.400, star_flux_dn_per_s_vmag0: 3.33e5}
    image_quality_thresholds:
      blank_max_dn: 5.0
      saturation_threshold_dn: 4095
      noisy_threshold_dn: 10.0
      max_missing_frac_clean: 0.30
      max_overexposed_frac_clean: 0.80
      partial_dropout_min_frac: 0.05
    source_image_filter:
      kind: BANDPASS_DOG
      lo_sigma_px: 5.0
      hi_sigma_px: 0.7
      enabled: false
    mag_offset:
      fallback_combo: 'CL1+CL2'
      mag_offset_table:
        'CL1+CL2': {default: 0.0}  # PLACEHOLDER — calibrate in Phase 10
    # Star photometry of the camera, read by ObsCassiniISS for its star limit and star
    # width, on raw and calibrated images alike.  A star of Johnson V magnitude V and color
    # B - V has the camera magnitude m = V + color_term * (B - V), and deposits
    #     flux_per_s_vmag0 * 10**(-0.4 * (m + filter_mag_offset[FILTER PAIR]))
    #         * texp / gain[gain state]
    # raw DN, the rate counting electrons and gain giving electrons per DN.  The dimmest
    # visible star deposits min_detectable_dn[readout mode][gain state], and the catalog
    # search reaches search_depth_mag past it.  The filter pair is the label's two
    # FILTER_NAME values joined by '+'; the gain state is the nominal electrons per DN of
    # the label's GAIN_MODE_ID (215, 95, 29, or 12); the readout mode is the label's
    # INSTRUMENT_MODE_ID (FULL, or SUM2 or SUM4 for a frame summed 2x2 or 4x4 on the
    # chip).  Summing on the chip keeps a star's charge, so the rate holds in every mode.
    #
    # Measured on tour star fields (#130, #1257): util/star_photometry measured 1,046
    # frames sampled from the COISS_2999 index, 650 of them with an independent pointing
    # fix from three or more agreeing stars (388 of them NAC); the rate, the gain states,
    # the color term, and the detection limits are fitted from the 256 NAC frames through
    # the clear pair (one in three held out), and every other filter pair takes the calibration's offset below.  The
    # magnitudes are Johnson V (#1257).  The photometry is the raw image's DN (a
    # table-encoded image decoded through the calibration volume's inverse lookup table),
    # measured at the pointing found on the calibrated image.
    #
    # Rate: 4.15e6 DN/s for V = 0 and B - V = 0 through CL1+CL2 at 29 e/DN (+-0.01 mag,
    # 5,847 stars with a measured color), times CISSCAL's 30.27 e-/DN at that state; a star
    # of the default class (G0, B - V 0.59) gives 1.75e8 e-/s.
    # Gain: CISSCAL's 30.27 e-/DN at 29 e/DN over its gain ratios (cassimg__dntoelectrons
    # on COISS_0011).  12 and 95 are measured from the stars: DN ratios against 29 of
    # 2.238 (+-0.01 mag, 1,895 stars) and 0.318 (+-0.03 mag, 125 stars), where CISSCAL
    # gives 2.357 and 0.310.  215 has no stars.
    # Detection limit: the DN at 80% of the way from the detection floor to the plateau
    # of a detection-probability curve fitted to the clean, unsmeared stars of each readout
    # mode and gain state on frames exposed 46 s or less (longer exposures carry several
    # times the noise and would set the limit of every frame).  The noise in DN changes
    # with the gain state, so each mode gives a table by gain state.  A pair without enough
    # stars takes the value of the same mode's nearest measured gain state, scaled by the
    # ratio of their DN per electron, so that the dimmest visible star holds the same
    # electrons.  The full-frame values at 12 and 29 e/DN hold the same electrons to 1%.
    # The SUM4 values rest on a few frames each (97 and 76 stars), and disagree with that
    # scaling.
    # Color term: fitted with the rate, -0.61 +- 0.01, so a red star reads brighter than
    # its V.  It takes the robust scatter of the stars about the fit to 0.34 mag.  The
    # stars through other filters are too few to measure a color term of their own, so
    # every filter pair takes this one.
    # Filter offsets: CISSCAL's prediction for a solar spectrum, 2.5 log10 of the clear
    # pair's signal over the pair's, each signal the pair's system transmission times the
    # solar photon flux (efficiency/systrans) times the camera's quantum-efficiency
    # correction, times the pair's absolute correction factor (correction/), with the mean
    # of the parallel and perpendicular tables for a polarizer, since starlight is
    # unpolarized (util/star_photometry/cassini_iss_star_limits.py,
    # systrans_filter_offsets).  The offsets the stars measure agree for the broad pairs
    # (RED+CL2 1.07 +- 0.02 against 1.10) but read a magnitude or more too bright in the
    # narrow and infrared ones, where only the stars that happened to come out bright pass the
    # fitting cut, so none of them is used.
    # Star width: the Gaussian sigma of a star in the frame's own pixels.  FULL is the
    # camera's 0.54 (star_psf_sigma above); the clear-pair stars on frames exposed under
    # 10 s give 0.58 (1,001 stars), and longer exposures widen to 1.0 as the pointing
    # drifts.  SUM2 and SUM4 are those stars' medians, 0.39 (1,171 stars) and 0.32 (41
    # stars).
    star_photometry:
      flux_unit: electrons
      flux_per_s_vmag0: 1.257e+08
      gain:
        '12': 13.53  # measured
        '29': 30.27
        '95': 95.32  # measured
        '215': 223.58
      min_detectable_dn:
        FULL:
