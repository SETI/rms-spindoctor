# Simulated observation configuration. Mirrors the per-camera schema
# of the real instrument blocks so the sim path can be navigated without
# branching the orchestrator on observation type.
#
# This block is what the navigator knows about the instrument-agnostic
# ('generic') sim frame. A scene that sets another instrument is read with that
# instrument's config_4N0 block. The physics the frame is rendered with is in
# the simulator's own entries, sim/instruments/configs/.
sim:
  data_units: raw_dn
  extfov_margin_vu: [50, 50]
  star_psf_sigma: 1.
  # Fraction of the offset window, per axis, inside which
  # StarUniqueMatchNav believes a lone star, in (0, 1].  Not measured on
  # simulated frames: 0.6 is the Cassini NAC's value.
  one_star_ellipse_fraction: 0.6
  star_psf_sizes:
    100: [11, 11]
  fit_camera_rotation: false
  max_rotation_deg: 5.0
  noise:
    saturation_dn: 4095            # 12-bit synthetic detector
    marker_value: 0
    read_noise_dn: 1.0
    # Photometric zero point: DN a vmag-0 star deposits per second.  Derived so a
    # vmag-4 star reproduces the prior peak-normalized brightness at the generic
    # detector (see sim/instruments/configs/generic.yaml).
    star_flux_dn_per_s_vmag0: 1.3e4
  image_quality_thresholds:
    blank_max_dn: 5.0
    saturation_threshold_dn: 4095
    noisy_threshold_dn: 10.0
    max_missing_frac_clean: 0.30
    max_overexposed_frac_clean: 0.80
  source_image_filter:
    kind: BANDPASS_DOG
    lo_sigma_px: 5.0
    hi_sigma_px: 0.7
    enabled: false
  mag_offset:
    fallback_combo: 'CL'
    mag_offset_table:
      'CL': {default: 0.0}
