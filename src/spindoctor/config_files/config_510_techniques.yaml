# Per-technique confidence-formula coefficients and runtime tunables.
# Loaded at config-load time so any unknown reference fails fast at
# startup rather than mid-image.  Each technique block looks like:
#
#   <technique_name>:
#     alpha0: float                 # constant in the sigmoid argument
#     terms:                        # confidence-formula linear terms
#       - feature: str              # diagnostic-attribute name
#         alpha: float              # linear coefficient
#         offset: float | null      # subtracted before scaling (default 0)
#         divisor: float | null     # divides after offset (default 1, non-zero)
#         cap_at: float | null      # post-scale upper bound, in [0, 1] (optional)
#     hard_zero_if:                 # mapping str -> bool; firing forces conf=0
#       <attribute>: bool
#     hard_cap: float | null        # optional post-sigmoid clamp, in [0, 1]
#     tuning:                       # technique-specific runtime tunables
#       <key>: float | int          # see ``load_technique_tuning`` for schema
#
# Alpha coefficients and term normalizations are SIM-ANCHORED: fitted
# 2026-07-18 by L2-regularized logistic regression against
# planted-truth recovery on a randomized simulated-scene campaign
# (util/calibration, campaign seed 20260718, 4200 scenes per pass;
# label = "technique's own offset error <= 1.0 px") collected on the
# staged forward-model renderer (physically-scaled polyhedral meshes
# from the config_220 catalog plus the full surface / photometric truth
# axes: photometric law and opposition surge, the limb-relief field,
# albedo texture, gouraud shading, pose scatter, and a giant-planet
# disc-texture / transit slice with cast moon shadows; the ring family
# draws the ring truth vocabulary -- face-on through moderately
# inclined projections, eccentric / m-mode / edge-wave orbits, planted
# per-feature orbit errors, non-navigable distractors; the star
# families use the
# flux-normalized deposit and the navigator-matched PSF).  The
# model_error_floor_px tunables (#210) are calibrated on the same
# campaign so each technique's 2-sigma error coverage matches the
# 2D-Gaussian expectation (0.865).  A technique's confidence
# approximates its sim-anchored P(offset error <= 1 px) given its
# diagnostics; hard gates (spurious / at_edge) still force 0.
# Calibration basis and scope: the campaign renders with the empirical
# instrument chain OFF -- no artifacts / instrument_defaults block, no
# whole-scene PSF on the body and ring families (anti-aliased edges
# only), the navigator-matched floor PSF on the star families, and no
# distortion, smear, or atmosphere; noise is Poisson plus a log-uniform
# read-noise draw (plus a stray-light slice on the star-field family)
# -- and every scene emulates coiss_nac, although these coefficients
# apply fleet-wide.  The realism match (simulator report, realism-match
# section) vouches for a different renderer configuration, the one with
# the empirical chain ON, so it does not underwrite these coefficients;
# their real-frame meaning currently rests on the operator-sidecar
# library cross-check recorded in util/calibration/CAMPAIGN_20260718.md.
# confidence_provisional therefore stays true in the metadata; when a
# real-image anchor set exists (operator-verified offsets with measured
# per-technique errors), the same fit reruns against it and these
# sim-anchored values become the fallback for regimes real data cannot
# reach.
# BodyTerminatorNav carries its first sim-anchored fit (#223): the
# campaign's terminator rows are single-class (zero of 116 usable rows
# within 1 px), so its formula is an honest low plateau -- see the
# technique block.  Its trust label additionally stays provisional
# because the phase-H realism match computed the limb-rise figure of
# merit on the limb side only; no terminator-side divergence verdict
# exists yet.
# Fit reports (reliability tables, AUC/Brier, per-term health):
# util/calibration/README.md describes how to regenerate them.

techniques:
  BodyDiscCorrelateNav:
    # Sim campaign (seed 20260718, full-truth-axis renderer): n=1376
    # usable, base rate 0.77, AUC 0.82 -> 0.83, Brier 0.155 -> 0.153.
    alpha0: 0.429
    tuning:
      # When ``fit_camera_rotation`` is True the converged rotation
      # magnitude trips ``at_edge`` once it crosses
      # ``rotation_at_edge_fraction * max_rotation_deg``.  The default
      # 0.95 matches every other 3-DoF technique; lower values
      # surface "rotation is pegged against the cap" earlier.
      rotation_at_edge_fraction: 0.95
      # Largest pyramid-level peak migration accepted before the result
      # is flagged spurious.  Scales with the largest BODY_DISC
      # silhouette so a 600 px Mimas is not held to the same absolute
      # pixel budget as a 100 px Dione.  The applied cap is
      # ``max(consistency_max_px,
      # consistency_max_fraction_of_diameter * max_body_diameter_px)``.
      # ``consistency_max_px`` covers pyramid quantization (factor-2
      # downsampling shifts peaks by O(1) px regardless of body size);
      # ``consistency_max_fraction_of_diameter`` handles the natural
      # peak walk between pyramid levels for textured bodies
      # (high-resolution levels resolve crater-scale brightness
      # structure the coarser levels averaged out).
      consistency_max_fraction_of_diameter: 0.025
      consistency_max_px: 4.0
      # Gaussian low-pass (px) applied to both surfaces in the
      # correlator's full-resolution sub-pixel refinement.  The body
      # silhouette and the Lambert template are sharp anti-aliased
      # edges with differing profiles; correlating them aliases the
      # cross-power peak into a sub-pixel-phase-dependent S-curve
      # (~0.03 px, zero at integer / half-pixel offsets).  A ~1 px
      # matched low-pass removes the high-frequency mismatch and cuts
      # the residual to ~0.01 px; the upsampled DFT still localizes the
      # smoothed peak.  Only the final full-resolution refine is
      # band-limited -- coarse pyramid levels keep sharp surfaces for
      # integer-peak selection.  0.0 disables it.
      refine_lowpass_sigma_px: 1.0
      # Covariance model-error terms.  The peak-curvature (matched-filter)
      # covariance measures only the statistical precision at the winning
      # NCC peak; on a well-matched template that is far tighter than the
      # true registration error, which is dominated by silhouette model
      # error and localization ambiguity.  Three quadrature terms restore
      # calibration so the reported sigma tracks the error across body size
      # and resolution instead of pinning to a constant:
      #  - localization_uncertainty_scale multiplies the inter-pyramid-level
      #    peak migration (consistency, px); a peak that walks between
      #    levels is empirically the poorer-localized one (campaign
      #    corr(error, consistency) ~ 0.57).
      #  - model_error_size_frac scales the body diameter (px): a coherent
      #    silhouette mismatch displaces the peak by a roughly fixed
      #    fraction of the extent (campaign corr(error, radius) ~ 0.51).
      #  - model_error_floor_px is the size-independent floor (pointing,
      #    camera distortion, sub-pixel interpolation).
      localization_uncertainty_scale: 1.0
      model_error_size_frac: 0.005
      model_error_floor_px: 0.05
    terms:
      # PSR-style quality measure of the chosen NCC peak.  Campaign raw
      # p5/p50/p95 = 6.2/9.9/20.5, so the offset-6 divisor-14 transform
      # spans that range in [0, 1].  The fitted weight is small: with
      # textured/banded discs in the cohort a sharp peak no longer
      # separates success from failure -- the peak-to-runner-up ratio
      # and consistency carry the discrimination.
      - feature: ncc_peak
        alpha: 0.051
        offset: 6.0
        divisor: 14.0
        cap_at: 1.0
      # Pyramid-level consistency, normalized by the per-image
      # diameter-scaled spurious threshold.  ``consistency_ratio < 1.0``
      # means the result is within budget; ``ratio == 1.0`` is exactly
      # at the spurious edge, where the term contributes its full
      # negative alpha to the sigmoid argument.  Using the
      # ratio rather than the raw pixel value lets the divisor stay at
      # 1.0 while the underlying budget tracks body diameter.
      - feature: consistency_ratio
        alpha: -1.365
        divisor: 1.0
      # Reward additional bodies in the composite (joint geometric
      # constraint sharpens the peak); cap so a 3-body scene saturates.
      # Not identifiable in the sim campaign (single-body scenes only);
      # retained at the design prior.
      - feature: body_count
        alpha: 0.4
        divisor: 3.0
        cap_at: 1.0
      # Peak-to-runner-up ratio: a sharp, unambiguous correlation peak
      # has ratio >> 1 vs the next-best peak.
      - feature: peak_to_runner_up_ratio
        alpha: 1.121
        divisor: 2.0
        cap_at: 1.0
    hard_zero_if:
      at_edge: true
      spurious: true

  BodyBlobNav:
    # Sim campaign (seed 20260718, full-truth-axis renderer; the
    # detection-SNR reliability gate admits the full emitted size range
    # down to the sub-resolution design regime): n=876 usable, base
    # rate 0.83, AUC 0.50 -> 0.89, Brier 0.33 -> 0.12.
    alpha0: 1.465
    terms:
      # Brightness-weighted centroid uncertainty shrinks with SNR.
      # Campaign raw p5/p50/p95 = 18/61/517 (heavy tail).
      - feature: body_snr_inside_predicted_bbox
        alpha: 0.895
        divisor: 600.0
        cap_at: 1.0
      # NEGATIVE alpha, reversing the design's more-signal prior, and
      # confirmed for the third campaign in a row -- now on the
      # full-truth-axis renderer (relief, albedo texture, photometric
      # laws): the lit-weighted-centroid model error grows with
      # apparent size, so absolute P(err <= 1 px) falls as the blob
      # gets bigger.  Small blobs remain the technique's tightest
      # regime in absolute pixels.  Campaign raw p5/p50/p95 = 8/25/69.
      - feature: body_extent_px
        alpha: -1.063
        offset: 8.0
        divisor: 130.0
        cap_at: 1.0
      # Multi-body geometry over-determines the joint translation.
      # Not identifiable in the sim campaign (single-body scenes only);
      # retained at the design prior.
      - feature: blob_count
        alpha: 0.4
        divisor: 3.0
        cap_at: 1.0
      # Phase-and-irregularity penalty.  Combines shape irregularity
      # with how much of the body is in shadow into a dimensionless
      # factor ``(ellipsoid_rms_residual_km / body_radius_km) *
      # (1 + 2 * sin^2(phase / 2))`` that the body NavModel emits
      # per-blob.  Raw phase angle alone is too coarse: a regular
      # Mimas at phase 90 has predictable shadowing and the lit-
      # weighted predicted centroid handles it (factor ~ 0.01); an
      # irregular Hyperion at the same phase has unpredictable
      # shadowing on an unknown rotational orientation that the
      # ellipsoidal model cannot fully correct (factor ~ 0.15).
      # Calibrated on the detection-SNR-gate pass (config_220 residuals
      # populated; simulated bodies rendered at the matching relief and
      # navigated against the smooth ellipsoid): campaign raw factor
      # p5/p50/p95 = 0.002 / 0.073 / 0.30, so the divisor spans that
      # range.  The penalty is milder than on the large-blob-only
      # regime: with small blobs in the fit the base rate rises to 0.90
      # and irregularity explains less of the residual failure mass.
      # Refit on the full-truth-axis pass (raw p5/p50/p95 =
      # 0.003/0.019/0.369): with surface texture and relief in the
      # cohort the irregularity penalty deepens to -0.545.
      - feature: max_phase_irregularity_factor
        alpha: -0.545
        divisor: 0.35
        cap_at: 1.0
    hard_zero_if:
      at_edge: true
    # The hard cap mirrors the BODY_BLOB reliability formula: a
    # brightness-weighted centroid is a weaker observation than a limb
    # fit, so the technique cannot drive the ensemble past 0.4
    # confidence even when every term saturates.
    hard_cap: 0.4
    tuning:
      # Pixels of slack around the search-window axis bounds for the
      # at-edge check.  See ``RingEdgeNav.at_edge_tolerance_px``.
      at_edge_tolerance_px: 1.0
      # Covariance model-error terms.  The per-blob centroid CRLB counts
      # photon statistics only; the brightness-weighted centroid is a
      # biased estimate of the geometric center (lit-hemisphere offset,
      # shape irregularity) whose error scales with the body radius.
      #  - model_error_size_frac is that centroid bias as a fraction of the
      #    body radius; per-blob variances combine by inverse-variance so a
      #    multi-blob fit tightens correctly (campaign corr(error, radius)
      #    ~ 0.34).
      #  - model_error_floor_px is the size-independent floor (pointing).
      # localization_uncertainty_scale is unused here (no correlation
      # pyramid) and left at its 0.0 default.
      model_error_size_frac: 0.05
      model_error_floor_px: 0.1

  BodyLimbNav:
    # Sim campaign (seed 20260718, full-truth-axis renderer): n=461
    # usable, base rate 0.54, AUC 0.71 -> 0.81, Brier 0.22 -> 0.21.
    # The base rate fell from the previous campaign's 0.75: the
    # limb-relief field, albedo texture, and non-Lambert photometric
    # laws all displace the rendered limb from the smooth prediction,
    # which is exactly the regime the fit must price in.
    alpha0: 0.132
    terms:
      # The sim limb now reports its honest visible-arc fraction
      # (surviving polyline over the unclipped whole-body silhouette
      # boundary, net of frame clipping and sibling-body occlusion),
      # so the partial-arc penalty is FITTED for the first time
      # instead of frozen at the design prior.  Campaign raw
      # p5/p50/p95 = 0.33/0.76/1.0.
      - feature: visible_limb_arc_fraction
        alpha: 1.068
      - feature: dt_fit_rms_px
        alpha: -1.303
      # Campaign raw p5/p50/p95 = 150/280/433.
      - feature: visible_arc_px
        alpha: 0.776
        divisor: 440.0
        cap_at: 1.0
    hard_zero_if:
      at_edge: true
      spurious: true
    tuning:
      # Minimum surviving polyline length per LIMB_ARC for feasibility.
      # Shorter limbs do not constrain a 2-D translation enough to be
      # worth the LM iteration.
      min_arc_vertices: 30.0
      # Final DT residual exceeding this many limb-sigmas marks the
      # result spurious.
      spurious_dt_rms_factor: 5.0
      # Floor for the spurious-detection threshold.
      spurious_dt_floor_px: 3.0
      # Below this Tukey-inlier count the M-estimator covariance is no
      # longer informative — flag spurious.
      spurious_min_inliers: 6
      # Below this inlier fraction the LM has almost certainly walked
      # off the true limb onto internal-body features (crater rims,
      # terminator, surface boundaries) — flag spurious.  A clean limb
      # fit on a fully-visible body retains 50 %+ of vertices as
      # inliers; image dropouts and cosmic rays on the polyline path
      # account for at most a few percent more rejection.  Below 20 %
      # is a strong mis-convergence signature (Voyager Enceladus
      # C4400436 mis-converged at 17.7 % was the calibration case).
      spurious_min_inlier_fraction: 0.20
      # If the LM moves more than this many pixels from the integer
      # coarse-NCC seed, flag spurious.  Defensive: with the trust
      # region (below) the LM cannot leave the coarse basin, so
      # this guard normally never fires; it stays in place to catch
      # any future regression that bypasses the trust region.  Set
      # slightly larger than ``lm_trust_region_px``.
      spurious_max_lm_displacement_px: 4.0
      # Coarse-seed mis-lock gate.  At low phase (below ~15 deg) the lit
      # arc spans almost the whole silhouette and the limb-darkening
      # roll-off is nearly symmetric, so the across-limb gradient that
      # constrains the fit is weakest exactly where the geometry offers
      # the least leverage: a false polarity-weighted overlap peak several
      # pixels from the true limb can outscore it and seed the LM in the
      # wrong basin.  The trust region then pins the LM against its
      # boundary while it tries to escape, and it exits at the iteration
      # cap without ever meeting the step tolerance.  A fit that BOTH
      # failed to converge AND ended at least this fraction of the trust
      # region away from the integer coarse seed is that mis-lock; flag it
      # spurious rather than emit a confident multi-pixel offset.  A
      # healthy sub-pixel refinement lands within ~0.71 px of its integer
      # seed and converges, so it clears this gate on both counts.
      spurious_unconverged_trust_boundary_fraction: 0.9
      # Maximum LM displacement from the integer coarse-NCC seed
      # (pixels).  The LM rejects any trial step that would land
      # outside this radius without committing — preventing the
      # joint LM + Tukey IRLS instability that can otherwise drag
      # the polyline off the coarse basin onto crater rims,
      # terminator edges, or surface boundaries when reweighting
      # at the trial offset finds a different inlier set.  The
      # coarse NCC search returns the integer-pixel mask-overlap
      # maximum, so the true sub-pixel optimum is within
      # ``hypot(0.5, 0.5) ≈ 0.71`` px of the seed — 1.0 px gives
      # legitimate sub-pixel refinement headroom while denying
      # the LM the runway it needs to reach a 2-4 px-away
      # spurious minimum.
      lm_trust_region_px: 1.0
      # Tikhonov anchor strength toward the coarse-NCC seed.  Set
      # to 0 by default — Tikhonov strong enough to prevent
      # multi-pixel walks on textured bodies also prevents
      # legitimate sub-pixel refinement on clean ones.  The trust
      # region is the harder bound; the spurious-detection guards
      # catch the case where the LM hits the trust-region boundary
      # with an unhealthy fit (Cassini Tethys N1574928113 falls
      # here — the limb walks to the boundary, RMS is elevated,
      # the spurious flag fires, and the fallback terminator
      # technique handles the body).
      lm_tikhonov_alpha: 0.0
      # Final continuous gradient-ridge sub-pixel refinement after the DT
      # Levenberg-Marquardt converges (see
      # :func:`spindoctor.nav_technique.dt_fitting.gradient_ridge_refine`).  Held
      # OFF for the limb: the dominant limb error is a model-vs-image edge
      # offset -- the gradient-magnitude peak of a limb-darkened,
      # PSF-blurred limb sits ~0.1 px inside the geometric silhouette the
      # LIMB_ARC predicts -- not the DT quantization the continuous fit
      # would remove.  Refining onto the gradient peak therefore SHARPENS
      # that offset (clean planted-(0,0) recovery worsens from ~0.10 px to
      # ~0.17 px).  Removing the floor needs a model-side fix that predicts
      # the limb at the gradient-peak location; see
      # ``dev_guide_techniques_body_limb``.  1 enables, 0 disables (the
      # tuning loader is numeric-only, so this is an int flag).
      gradient_ridge_refine: 0
      # Pixels of slack around the search-window axis bounds for the
      # at-edge check.  See ``RingEdgeNav.at_edge_tolerance_px``.
      at_edge_tolerance_px: 1.0
      # Rotation-axis ``at_edge`` fraction; see
      # ``BodyDiscCorrelateNav.rotation_at_edge_fraction``.
      rotation_at_edge_fraction: 0.95
      # Model-error floor (px), added in quadrature to the covariance's
      # translation diagonal (#210).  The Tukey-weighted DT covariance
      # under-reports the limb model error, and on the full-truth-axis
      # renderer that error is dominated by physics the fit cannot see:
      # the limb-relief field, albedo texture, and non-Lambert shading
      # all displace the rendered limb from the smooth predicted
      # silhouette.  20260718 campaign: 2-sigma coverage 0.68 at the
      # previous 0.92 floor, 0.86 at this value
      # (util/calibration/fit_floors).  Note the floor now sits above
      # the medium tier's 2.0 px sigma cap, so a limb-only fix
      # surfaces as a low-tier result -- the honest price of a limb
      # whose position error is set by unmodeled terrain.
      model_error_floor_px: 2.61
      # Shared DT fit-quality gates (dt_fit_gates.py).  A fit neither the
      # DT-LM nor the gradient-ridge stage verified (both exited at their
      # iteration caps without meeting the step tolerance) is an
      # unverified fit: its confidence is capped JUST below the high
      # tier's 0.85 boundary, so it cannot carry a high-tier result on
      # its own but is not otherwise degraded -- formal convergence
      # flickers on healthy dense-edge scenes (sim ring sweeps show
      # sub-millipixel recoveries whose ridge stage misses the 1e-3 px
      # step tolerance), so a deep cap would strafe good fits.  The hard
      # consequence for a genuinely mis-locked unconverged fit rides on
      # the combined polarity gate below.
      lm_unconverged_confidence_cap: 0.84
      # Standalone polarity-rejection hard gate.  Healthy multi-body
      # frames run ~11% rejection (small secondary moons on the ansa
      # contribute wrong-polarity limb vertices while the dominant limb
      # fits cleanly; Cassini DIONE N1702389073 measures 0.110), so the
      # standalone threshold sits far above that band and catches only
      # grossly wrong locks.
      spurious_max_polarity_rejection_fraction: 0.35
      # Combined gate: unconverged AND elevated polarity rejection is
      # the coarse-seed mis-lock signature (Cassini Tethys N1716186428:
      # 12.7% rejection at the 30-iteration cap on a seed 6.8 px off in
      # du; the healthy 11%-rejection frames all converge).
      #
      # This gate is CONVERGENCE-discriminated, not margin-discriminated.
      # The 0.10 threshold sits BELOW the healthy reference (0.110 on the
      # multi-body DIONE frames), so the convergence flag is the only
      # thing separating them: a healthy frame that both runs ~11%
      # rejection and fails to reach a local optimum is hard-rejected.
      # Two things to know before widening or narrowing this: the
      # convergence flag now also counts a converged gradient-ridge
      # polish, which makes True easier to reach; and the healthy
      # evidence frames (N1702389073 / N1702389662 / N1702390017) are
      # NOT in the image library, so no CI case holds this margin.
      spurious_unconverged_polarity_rejection_fraction: 0.10
      # Coarse-NCC acquisition-quality gate: the winning coarse shift's
      # in-bounds vertex match fraction must reach this, or the seed
      # never had a lock and the LM refined noise.  Conservative
      # plumbing default -- healthy library limb fits measure well
      # above it.
      # The full library-calibrated threshold lock is #179's scope.
      spurious_min_coarse_peak_fraction: 0.05

  BodyTerminatorNav:
    # First sim-anchored fit (#223; seed 20260718, full-truth-axis
    # renderer).  The campaign's terminator rows are SINGLE-CLASS: zero
    # of 116 usable rows recovered within 1 px (median error 5.2 px,
    # p5 2.55 px) -- on randomized crescents the DT fit settles several
    # pixels from the planted truth, systematically toward the bright
    # limb-side gradient, and no diagnostic separates a closer result
    # from a farther one.  The L2-regularized fit therefore converges
    # to an honest low plateau (confidence ~0.03-0.05): a terminator
    # fix cannot pass the ensemble's 0.35 gate on its own or outweigh a
    # calibrated technique, which also ends the uncalibrated-default
    # era in which terminator locks at ~0.7 confidence dragged fused
    # results to their own multi-pixel offsets.  The arc-fraction,
    # arc-length, and phase terms are sign-bounded to zero by the
    # single-class rows (no success mass to reward); they stay wired
    # for a future real-anchored calibration.  Trust labeling: the
    # phase-H realism match produced no terminator-side rise-width
    # verdict (FOM 3 is limb-side only), so terminator confidences
    # remain confidence_provisional per the #223 sequencing even
    # though the technique is now sim-fitted.
    alpha0: -1.93
    terms:
      - feature: visible_terminator_arc_fraction
        alpha: 0.0
      - feature: dt_fit_rms_px
        alpha: -1.533
      - feature: visible_arc_px
        alpha: 0.0
        divisor: 100.0
        cap_at: 1.0
      - feature: mean_phase_angle_factor
        alpha: 0.0
      - feature: mean_albedo_penalty
        alpha: -0.216
    hard_zero_if:
      at_edge: true
      spurious: true
    tuning:
      # Minimum surviving polyline length per TERMINATOR_ARC for
      # feasibility (same shape as BodyLimbNav.min_arc_vertices).
      min_arc_vertices: 30.0
      # Final DT residual exceeding this many terminator-sigmas marks
      # the result spurious.
      spurious_dt_rms_factor: 5.0
      # Floor for the spurious-detection threshold (terminators are
      # softer than limbs; the floor is one pixel wider).
      spurious_dt_floor_px: 4.0
      # Below this Tukey-inlier count the M-estimator covariance is
      # no longer informative.
      spurious_min_inliers: 6
      # Below this inlier fraction the LM has almost certainly walked
      # off the true terminator onto crater shadows or surface
      # boundaries; see ``BodyLimbNav.spurious_min_inlier_fraction``
      # for the motivation.
      spurious_min_inlier_fraction: 0.20
      # See ``BodyLimbNav.spurious_max_lm_displacement_px``.
      spurious_max_lm_displacement_px: 4.0
      # See ``BodyLimbNav.lm_trust_region_px``.
      lm_trust_region_px: 1.0
      # See ``BodyLimbNav.lm_tikhonov_alpha``.
      lm_tikhonov_alpha: 0.0
      # Pixels of slack around the search-window axis bounds for the
      # at-edge check.  See ``RingEdgeNav.at_edge_tolerance_px``.
      at_edge_tolerance_px: 1.0
      # Rotation-axis ``at_edge`` fraction; see
      # ``BodyDiscCorrelateNav.rotation_at_edge_fraction``.
      rotation_at_edge_fraction: 0.95
      # Model-error floor (px), solved on the technique's own campaign
      # rows for the first time (#210, seed 20260718): the DT fit's
      # reported sigma (~1.2 px) sits far below its actual recovery
      # error (median 5.2 px), so the floor carries nearly all of the
      # honest uncertainty.  2-sigma coverage 0.04 before flooring,
      # 0.87 after (util/calibration/fit_floors).  A terminator fix is
      # therefore always a low-tier result, consistent with its
      # fallback-only ensemble role.
      model_error_floor_px: 4.32
      # Basin second-opinion (#125): after LM convergence, scan the
      # coarse search window for a competing DT-cost basin farther than
      # basin_exclude_radius_px from the converged offset.  When the
      # best competing mean per-vertex DT cost is below
      # basin_cost_ratio_threshold times the converged cost (with
      # basin_cost_epsilon_px guarding near-zero converged costs), the
      # DT surface is not unimodal -- a crater shadow, albedo boundary,
      # or second body offers a rival alignment the fit has no basis to
      # rule out -- and the result is marked spurious.  This closes the
      # lone-primary hole: the fallback-tier drop protects terminator
      # results only when a limb or disc result exists to supersede
      # them.  Set the ratio to 0 to disable the check.
      basin_cost_ratio_threshold: 1.2
      basin_exclude_radius_px: 5.0
      basin_cost_epsilon_px: 0.25
      # Shared DT fit-quality gates; see ``BodyLimbNav`` for the
      # rationale behind each threshold.
      lm_unconverged_confidence_cap: 0.84
      spurious_max_polarity_rejection_fraction: 0.35
      spurious_unconverged_polarity_rejection_fraction: 0.10
      spurious_min_coarse_peak_fraction: 0.05

  RingEdgeNav:
    # Sim campaign (seed 20260718, ring-vocabulary family: inclined
    # through face-on projections, eccentric/m-mode/edge-wave orbits,
    # planted orbit errors, non-navigable distractors): n=591 usable,
    # base rate 0.90, AUC 0.68 -> 0.79, Brier 0.087 -> 0.082.  The base
    # rate fell from the face-on-only family's 0.97: planted radial
    # ephemeris errors and distractor ringlets put genuine failure mass
    # in the cohort for the first time.
    alpha0: 1.832
    terms:
      # Campaign raw p5/p50/p95 = 509/758/2140 (inclined projections
      # lengthen the closed-ellipse edges; the /1500 transform still
      # spans the healthy range without pinning the bulk at the cap).
      - feature: total_edge_length_px
        alpha: 0.976
        divisor: 1500.0
        cap_at: 1.0
      # Penalize the MEAN per-edge DT residual (px), not the raw sum.  The sum
      # scales with the number of fused edges, so with a fixed divisor a frame
      # with more rings was penalized purely for having more rings, driving
      # confidence to zero on real multi-edge scenes.  The mean is
      # edge-count independent.  On the ring-vocabulary family the
      # weight deepens (-0.023 -> -0.069): edge-wave and m-mode shapes
      # that the fit mis-locks leave a visible residual.  Most failure
      # mass is still clean-residual wrong-feature locks (aliasing, and
      # planted orbit errors the fit absorbs into the offset) that the
      # residual cannot see, so the discrimination continues to ride on
      # edge length and the spurious gates.
      - feature: per_edge_dt_rms_mean
        alpha: -0.069
    hard_zero_if:
      at_edge: true
    tuning:
      # Pixels of slack around the search-window axis bounds for the
      # at-edge check.  A converged offset whose absolute distance from
      # any axis bound (+/-margin_v, +/-margin_u) falls within this
      # tolerance is flagged ``at_edge=True``.  One pixel matches the
      # bilinear DT half-cell width: any closer and the LM gradient
      # information is unreliable.
      at_edge_tolerance_px: 1.0
      # Final DT residual exceeding this many radial-sigmas marks the
      # result spurious.
      spurious_dt_rms_factor: 5.0
      # Floor for the spurious-detection threshold.
      spurious_dt_floor_px: 3.0
      # Below this Tukey-inlier count the M-estimator covariance is no
      # longer informative.
      spurious_min_inliers: 6
      # A Tukey inlier fraction (inliers over aggregated model vertices)
      # below this marks the result spurious.  ``result.rms_px`` after
      # Tukey reweighting collapses to ~0 when the LM converges to a
      # local minimum where one edge fits cleanly and the others are
      # wholly mis-aligned (Cassini Tethys N1572471790 was the
      # calibration case — the LM locked onto one of three rings,
      # anchoring on ~1/3 of the vertices).  No residual statistic
      # separates that from a correct fit whose faintest edge is simply
      # undetectable in the image (routine on flat Keeler-gap ansa
      # frames, #203), but the explained fraction does: a wrong-ring
      # lock anchors a minority of the model, a correct fit with one
      # missing edge anchors >0.8.
      spurious_min_inlier_fraction: 0.5
      # The aggregate inlier-fraction veto above is waived for a
      # multi-edge fusion when its low fraction is fully explained by
      # edges that are ABSENT from the image rather than mis-aligned
      # (issue #261).  The waiver requires all of: (1) at least
      # ``spurious_waiver_min_well_fit_edges`` edges each clear
      # ``spurious_min_inlier_fraction`` (and ``spurious_min_inliers``)
      # on their OWN vertices; (2) the fit's translation covariance is
      # full rank — the weighted vertices are almost all from the
      # well-fit subset, so this certifies the surviving edges constrain
      # both offset axes on their own; and (3) every
      # non-well-fit edge has a per-edge median DT residual of at least
      # ``spurious_waiver_absent_median_px`` — its vertices sit far from
      # every detected image edge, i.e. there is nothing there to match.
      # Calibration cases: Cassini C ring N1467344214 (correct fit,
      # 821/3188 inliers; the two rejected edges have medians 46 and
      # 17 px — absent — so the waiver fires) vs Cassini Tethys
      # N1572472169 (wrong-ring lock, 739/1901 inliers; a rejected edge
      # lies ON a detected image edge at median 0.04 px — internal
      # disagreement — so the veto stands).  A single-edge fit never
      # qualifies (its own fraction IS the aggregate), so single-edge
      # behavior is unchanged.
      spurious_waiver_min_well_fit_edges: 1
      spurious_waiver_absent_median_px: 5.0
      # Sigma floor (px) added in quadrature to the translation
      # covariance whenever the waiver above fires.  A waived fit is
      # carried by a minority of its model in a scene whose parallel
      # ringlet structure can offer alias alignments the DT cannot rule
      # out; the LM covariance measures only the statistical precision
      # of the anchored vertices.  The floor sits above the medium
      # tier's 2 px sigma cap so a waived fix surfaces as a low-tier
      # result and cannot outweigh a full-support fix in the ensemble.
      spurious_waiver_sigma_floor_px: 3.0
      # See ``BodyLimbNav.spurious_max_lm_displacement_px``.
      spurious_max_lm_displacement_px: 4.0
      # Localization sigma (px) of the image edge the fit measures
      # against, added in quadrature to each vertex's model sigma to form
      # the residual scale the robust fit actually uses.
      #
      # A ring edge's model sigma is its catalog radial uncertainty
      # divided by the radial km/px, and ring orbits are solved to a
      # fraction of a km while a WAC pixel spans ~100 km, so that sigma
      # routinely lands at 0.001 px.  The evidence cannot support such a
      # scale: the fit measures distance to a BINARY edge mask, whose
      # distance transform is quantized to the integer pixel grid.  With
      # a 0.001 px scale the Tukey redescender's rejection radius is
      # 4.685 * 0.001 = 0.005 px, so the only vertices it keeps are the
      # ones sitting exactly on a mask pixel (DT == 0), which is
      # reachable only at an integer offset.  The fit then never leaves
      # the integer coarse-NCC seed, reports a sub-milli-pixel sigma
      # that is not an uncertainty, and hands the inlier-fraction gate a
      # fraction that counts pixel phase rather than model agreement.
      #
      # Half a pixel is the half-cell of the mask's own quantization,
      # which is the floor on how well a binary mask can place an edge.
      # Only RingEdgeNav declares this: BodyLimbNav and
      # BodyTerminatorNav derive their per-vertex sigmas from body shape
      # and pole uncertainty, which measure 0.5 to 3 px on real frames
      # and so already exceed what the mask can resolve.
      edge_localization_sigma_px: 0.5
      # See ``BodyLimbNav.lm_trust_region_px``.
      lm_trust_region_px: 1.0
      # See ``BodyLimbNav.lm_tikhonov_alpha``.
      lm_tikhonov_alpha: 0.0
      # Final continuous gradient-ridge sub-pixel refinement; see
      # ``BodyLimbNav.gradient_ridge_refine``.  1 enables, 0 disables.
      # ON: the binary edge mask quantises detected edges to the integer
      # pixel grid, so on dense real ring scenes a large fraction of model
      # vertices land exactly on edge pixels (DT == 0, zero gradient) and the
      # DT-LM step stalls at the integer coarse-NCC seed.  The continuous
      # gradient-ridge pass refines against the un-thresholded gradient
      # magnitude, recovering the sub-pixel offset the quantised DT discards.
      # (On clean sim scenes the DT-LM already reaches its ~0.016 px floor, so
      # the refine is a no-op there.)
      gradient_ridge_refine: 1
      # Rotation-axis ``at_edge`` fraction; see
      # ``BodyDiscCorrelateNav.rotation_at_edge_fraction``.
      rotation_at_edge_fraction: 0.95
      # Shared DT fit-quality gates; see ``BodyLimbNav`` for the
      # rationale.  RingEdgeNav runs polarity-free (the ring catalog
      # does not yet encode lighting / gap-vs-ringlet polarity), so the
      # two polarity thresholds are inert here until that flag is
      # wired; the convergence cap and the coarse-peak gate apply.
      lm_unconverged_confidence_cap: 0.84
      spurious_max_polarity_rejection_fraction: 0.35
      spurious_unconverged_polarity_rejection_fraction: 0.10
      spurious_min_coarse_peak_fraction: 0.05

  StarUniqueMatchNav:
    # The 1-star path is capped at 0.7 inside the technique (single match
    # cannot self-check); the 2-star path is capped at 0.8 (residual
    # cross-checks the assignment).  YAML alpha shape is identical for
    # both paths; the cap is applied post-sigmoid in
    # ``StarUniqueMatchNav.navigate``.
    # Sim campaign (seed 20260718): n=473 usable, base rate 0.83,
    # AUC 0.49 -> 0.75, Brier 0.15 -> 0.13 (both modes pooled; the
    # structural caps stay).  The astrometric-error and unresolved-
    # companion slices sit in this cohort, so part of the failure mass
    # is planted catalog error no detection diagnostic can see.
    alpha0: 0.781
    terms:
      # Higher predicted SNR shrinks the centroid CRLB and tightens the
      # match.  Campaign raw p5/p50/p95 = 15/85/252 (the flux-
      # normalized star deposit brightened the healthy range; the old
      # /100 transform pinned 44% of rows at the cap, so the divisor
      # widens to 250).
      - feature: predicted_snr
        alpha: 0.809
        divisor: 250.0
        cap_at: 1.0
      # Magnitude margin to the next-brightest predictable star in the
      # extfov.  Below the 1.5 mag floor the technique short-circuits
      # before reaching the formula; above the floor, additional margin
      # earns confidence up to a 1.5 mag span.
      - feature: brightness_margin_mag
        alpha: 1.002
        offset: 1.5
        divisor: 1.5
        cap_at: 1.0
      # Larger residuals between the matched detection and the prediction
      # pull confidence down.
      - feature: residual_px
        alpha: -0.112
        divisor: 2.0
    hard_zero_if:
      at_edge: true
      spurious: true
    tuning:
      # Minimum magnitude difference to the next-brightest predictable
      # star for the 1-star path to fire.
      brightness_margin_to_next_catalog_star_mag: 1.5
      # Half-width of the search window around each prediction (px).
      # Should bracket the per-instrument SPICE pointing-error envelope
      # so the brightest peak in the window is the matched detection.
      search_window_px: 30.0
      # Centroid box half-width around the brightness peak (px).
      centroid_box_half_px: 3
      # Maximum allowed best-assignment residual in the 2-star path
      # before falling back to the 1-star path.
      max_residual_px: 4.0
      # Detection-threshold multiplier on image_noise_sigma; below this
      # the brightest pixel inside the search window is considered noise.
      detection_sigma: 4.0
      # Minimum background-subtracted peak-to-runner-up ratio for the
      # 1-star detection (#211).  The absolute detection_sigma test
      # cannot reject a noise spike: the maximum of the ~3700-pixel
      # search window sits at 3.5-4.5 sigma for pure noise, so a
      # marginal star routinely loses to a spike that clears 4 sigma.
      # A real star detection towers over the window's noise order
      # statistics (sim: ratio >= ~2 for every good match) while a
      # matched spike sits within ~30% of its runner-up; below this
      # ratio the single-detection premise of the 1-star path fails and
      # the result is spurious.  Unit-free (no DN-scale dependence).
      one_star_min_peak_ratio: 1.5
      # Maximum prediction-to-detection distance (px) accepted by the
      # 1-star path when the peak-ratio gate above is vacuous (#259).
      # The ratio reports an infinite no-rival sentinel when the
      # window's runner-up never clears the background -- a flat or
      # quantized frame where the #211 gate has measured nothing.  A
      # real star on a real (noisy) background always has a finite
      # runner-up, so the sentinel case is exactly where a lone hot
      # pixel or artifact would otherwise auto-pass every check.  In
      # that case the residual (which on this path IS the reported
      # offset) must stay inside the pointing-prior core: default is
      # one third of search_window_px, since the window half-width
      # brackets the per-instrument SPICE pointing-error envelope (a
      # ~3-sigma budget) and an uncorroborated no-rival detection far
      # from the prediction is far more likely an artifact than a
      # 2-3-sigma pointing error.  A finite peak ratio leaves
      # acceptance to the measured #211 gate: operator-verified
      # library matches carry genuine one-star offsets up to ~24 px,
      # so no uniform residual cut can sit below the search window.
      one_star_max_residual_px: 10.0
      # Per-mode caps applied post-sigmoid; the 1-star path cannot
      # self-check, so its cap is lower than the 2-star path's.
      one_star_confidence_cap: 0.7
      two_star_confidence_cap: 0.8
      # Pixels of slack around the search-window axis bounds for the
      # at-edge check.  A converged offset whose absolute distance from
      # any axis bound (+/-margin_v, +/-margin_u) falls within this
      # tolerance is flagged ``at_edge=True`` and forced to zero
      # confidence by the technique's ``hard_zero_if`` gate.  Matches
      # the bilinear-DT half-cell width used elsewhere in the pipeline.
      at_edge_tolerance_px: 1.0
      # Rotation-axis ``at_edge`` fraction; see
      # ``BodyDiscCorrelateNav.rotation_at_edge_fraction``.  Only used
      # by the 2-star Procrustes path; the 1-star path always reports
      # rotation as unobservable so the threshold has no effect there.
      rotation_at_edge_fraction: 0.95

  StarRefineNav:
    # Pass-2 refinement on the pass-1 ensemble's prior offset.  Fit on
    # the 20260718 campaign and re-verified on the re-collected pass
    # (the calibrated pass-1 formulas change which priors reach pass
    # 2): n=482 usable, base rate 0.92, AUC 0.80 -> 0.84,
    # Brier 0.12 -> 0.06.
    alpha0: 1.795
    terms:
      # More inliers => more independent constraints; saturate at 5.
      - feature: n_stars_used
        alpha: 1.228
        divisor: 5.0
        cap_at: 1.0
      # Lower median per-star error => tighter refinement.
      - feature: median_pos_err_px
        alpha: -0.81
        divisor: 1.0
      # Per-axis scatter: sign-bounded to zero on this campaign (the
      # median per-star error already carries the same signal on these
      # rows); kept wired for a future real-anchored calibration.
      - feature: residual_scatter_px
        alpha: 0.0
        divisor: 1.0
    hard_zero_if:
      at_edge: true
      spurious: true
    tuning:
      # Half-width of the per-star refine window (px).  Tighter than the
      # unique-match search window because the pass-1 prior already put
      # us within a few pixels of the right answer.
      refine_window_px: 6.0
      # Centroid box half-width around the brightness peak (px).
      centroid_box_half_px: 3
      # Drop a star whose detection sits more than this many pixels from
      # the prior-shifted prediction; almost certainly a wrong peak.
      max_per_star_residual_px: 4.0
      # Detection-threshold multiplier on image_noise_sigma.
      detection_sigma: 4.0
      # Below this many surviving inliers the technique reports spurious.
      min_inliers: 1
      # Pixels of slack around the search-window axis bounds for the
      # at-edge check (see StarUniqueMatchNav.at_edge_tolerance_px).
      at_edge_tolerance_px: 1.0
      # Post-sigmoid confidence cap when the refine fit had only one
      # inlier.  A 1-star refine adds no independent cross-check
      # information beyond the prior it was handed (the same single
      # observation that drove the pass-1 fit), so its confidence
      # ceiling is set lower than ``StarUniqueMatchNav``'s 0.7 1-star
      # cap.  The ensemble's primary-technique selection therefore
      # cannot promote a 1-star refine over a 1-star unique-match on
      # the same observation.  Phase 10 calibration may retune the
      # numeric value; the structural cap stays.
      single_inlier_confidence_cap: 0.5
      # Rotation-axis ``at_edge`` fraction; see
      # ``BodyDiscCorrelateNav.rotation_at_edge_fraction``.  Only the
      # multi-inlier Procrustes path uses it; a 1-inlier refine always
      # reports rotation as unobservable.
      rotation_at_edge_fraction: 0.95
      # Model-error floor (px), added in quadrature to the covariance's
      # translation diagonal (#210): 20260718 campaign 2-sigma coverage
      # 0.83 at the previous 0.22 floor, 0.87 at this value
      # (util/calibration/fit_floors).
      model_error_floor_px: 0.27

  StarFieldFromCatalogNav:
    # Multi-star RANSAC pattern matcher.
    # Sim campaign (seed 20260718): n=92 usable, base rate 0.99 (91 of
    # 92 non-spurious pattern matches recovered planted truth), so the
    # calibrated output is a high plateau rather than a discriminative
    # curve; the hard_cap below keeps the near-single-class evidence
    # from claiming certainty on real frames the sim cannot represent
    # (distortion, smear, saturated bloom).
    alpha0: 2.288
    terms:
      - feature: n_inliers
        alpha: 0.803
        offset: 6.0
        divisor: 6.0
        cap_at: 1.0
      # Sign-constrained to zero by the fit: with no failure class the
      # residual carries no signal in the campaign.  Kept wired for a
      # future real-anchored calibration.
      - feature: median_residual_px
        alpha: 0.0
        divisor: 1.0
      # Constant in the campaign (the detector always fills its
      # max_sources=30 budget, noise peaks included) -- no information
      # as wired; kept at zero weight.
      - feature: n_detected_sources
        alpha: 0.0
        divisor: 30.0
        cap_at: 1.0
      - feature: n_catalog_predicted
        alpha: 0.768
        divisor: 30.0
        cap_at: 1.0
    hard_zero_if:
      at_edge: true
      spurious: true
    # Single-class sim evidence cannot support confidence above ~0.95;
    # conservative ceiling pending the real-anchored calibration.
    hard_cap: 0.95
    tuning:
      # Maximum number of brightest detected sources / brightest
      # catalog stars to feed the matcher.  Triplet count is M^3, so
      # 30 keeps the candidate list bounded (~27K triplets per side).
      max_sources: 30
      # Detection-threshold multiplier on image_noise_sigma.
      detection_sigma: 4.0
      # Gaussian PSF sigma (px) used for the matched-filter kernel.
      # Matches the typical ungroomed star PSF; per-instrument
      # overrides arrive in Phase 9 / 10 once the integration library
      # exercises the full instrument set.
      psf_sigma_px: 1.0
      # Centroid box half-width around each detection peak (px).
      centroid_box_half_px: 3
      # Match radius in the (ratio, ratio, angle_rad) hash
      # space; weighted Euclidean.  0.05 is the empirical default for
      # centroid sigma ~0.1 px against typical triplet scales (Part 3
      # §"Algorithm specifics").
      hash_match_tolerance: 0.05
      # Per-axis weights in the hash distance metric.  Radians and
      # dimensionless ratios are roughly comparable in magnitude over
      # the typical triplet shapes; both default to 1.0.
      hash_ratio_weight: 1.0
      hash_angle_weight: 1.0
      # Maximum residual (px) for a detection-to-catalog
      # correspondence to count as an inlier under a candidate
      # transform.
      inlier_tolerance_px: 2.0
      # Minimum inlier count for the STRONG-tier triplet-RANSAC matcher to
      # accept a transform; below this the technique tries the wide-offset
      # asterism fallback (below) before returning spurious.  The floor is
      # 6 because the RANSAC evaluates thousands of triplet seeds, so a
      # three-inlier coincidence (a seed triangle plus zero corroboration)
      # is reachable by chance; six inliers (seed triangle plus three
      # corroborating stars) is the level at which a lock over that many
      # trials is statistically decisive.
      pattern_match_min_inliers: 6
      # Wide-offset asterism fallback for sparse few-bright-star fields
      # with a large unknown pointing offset (the Pleiades-cluster regime).
      # When the triplet RANSAC cannot reach pattern_match_min_inliers, seed
      # a translation only from bright-anchor pairings -- the brightest
      # trusted catalog stars against the brightest detections -- and accept
      # a lower inlier count when the chance-alignment significance clears
      # the budget below.  Restricting the seeds to a handful of
      # brightness-anchored trials (rather than the RANSAC's thousands of
      # triplet trials) is what makes a three-inlier lock trustworthy: the
      # trial count, not the inlier count alone, sets the false-lock rate.
      # 1 enables the fallback; 0 disables it (strong-tier RANSAC only).
      wide_offset_enabled: 1
      # Minimum inlier count for a wide-offset lock.  Hard floor of 3: two
      # stars cannot cross-check a rigid translation (any single pair
      # defines an exact offset), so at least one corroborating third star
      # is required on top of the anchor pair.
      wide_offset_min_inliers: 3
      # Number of brightest photometry-trusted catalog stars used as seed
      # anchors.  A star flagged photometry_saturated (#284: a bright record
      # whose magnitude is an untrusted lower bound) is skipped as an anchor
      # because its brightness ordering is uncertain, though it can still be
      # a corroborating inlier.
      wide_offset_anchor_catalog: 3
      # Number of brightest detections paired against each catalog anchor to
      # form the seed offsets.  The product with wide_offset_anchor_catalog
      # bounds the seed (trial) count that enters the false-lock model.
      wide_offset_anchor_detections: 6
      # False-lock budget: the maximum expected number of chance locks (of
      # the achieved inlier count, over the evaluated bright-anchor seeds)
      # under a uniform-random-detection null.  A candidate is accepted only
      # when its computed expectation falls at or below this.  0.01 keeps the
      # per-frame chance-lock rate at one percent; a genuine three-inlier
      # anchor lock on a sparse field sits several orders of magnitude below
      # it, while a two-inlier lock (anchor pair plus one chance neighbor)
      # sits above it and is rejected.
      wide_offset_false_lock_budget: 0.01
      # Maximum inlier residual RMS (px) for a wide-offset lock.  A lock
      # whose corroborating inliers sit near the match-tolerance edge is a
      # scattered near-chance alignment, not a rigid asterism; genuine locks
      # cluster well inside the tolerance.
      wide_offset_max_residual_rms_px: 1.5
      # Post-formula confidence cap for a wide-offset lock.  Fewer
      # corroborating stars than a strong-tier match means the result cannot
      # claim the high tier on its own; it must still clear the ensemble gate
      # to navigate.  0.6 lands a clean lock in the medium / low tier.
      wide_offset_confidence_cap: 0.6
      # Single-bright-star wide-offset acquisition.  When neither the triplet
      # RANSAC nor the >=3-inlier asterism fallback locks, a field can still
      # carry exactly one confidently-detectable catalog star at a large
      # unknown offset (the glare-elevated Pleiades regime, where the fainter
      # members drop below the detection limit).  A one-star lock has no
      # corroborating inlier and so cannot clear the chance-alignment budget;
      # in its place the anchor pairing itself must be unambiguous, which
      # holds only when BOTH the catalog anchor and the detection anchor are
      # uniquely bright by a large margin.  A glare field routinely produces
      # peaks brighter than a real faint star, so a frame whose brightest
      # detection is not uniquely dominant (e.g. 1694 vs 1240 DN) correctly
      # fails this gate and stays unlocked.  1 enables the one-star lock; 0
      # disables it.  Default 0: the capability is validated on the sim
      # scenes but held off by default pending an image-library false-lock
      # sweep (which needs SPICE holdings the unit suite does not reach).
      wide_offset_one_star_enabled: 0
      # Minimum predicted-brightness margin (mag) of the catalog anchor over
      # the next-brightest predictable catalog star for a one-star lock.  A
      # smaller margin means more than one plausible bright anchor, so the
      # single pairing is ambiguous and the lock is refused.
      wide_offset_one_star_catalog_margin_mag: 1.0
      # Minimum peak-DN ratio of the brightest detection to the
      # next-brightest for a one-star lock.  Below this the dominant peak is
      # not uniquely bright (a glare artifact or a comparably bright rival
      # could be the true anchor), so the single pairing is ambiguous and the
      # lock is refused.
      wide_offset_one_star_detection_margin_ratio: 3.0
      # Post-formula confidence cap for a one-star wide-offset lock.  A lock
      # resting on a single uncorroborated anchor pairing sits below even the
      # >=3-inlier wide-offset cap; it must still clear the ensemble gate to
      # navigate.  0.4 lands a clean one-star lock in the low tier.
      wide_offset_one_star_confidence_cap: 0.4
      # Pixels of slack around the search-window axis bounds for the
      # at-edge check (see StarUniqueMatchNav.at_edge_tolerance_px).
      at_edge_tolerance_px: 1.0
      # Rotation-axis ``at_edge`` fraction; see
      # ``BodyDiscCorrelateNav.rotation_at_edge_fraction``.
      rotation_at_edge_fraction: 0.95
      # Roll / translation separability floor (deg).  The camera-roll
      # separability analysis in
      # docs/simulator_report/simulator_report.rst ("Camera-roll
      # sensitivity and roll / translation separability") shows the
      # RANSAC field matcher cannot separate a roll below ~0.75 deg
      # from a pure translation: the fitted roll collapses toward a
      # spurious zero.  A fitted |rotation| below this floor is
      # therefore reported with the rotation-unobservable sentinel
      # variance and the ``rotation_below_separability_floor``
      # diagnostics flag instead of a confident near-zero value.
      rotation_separability_floor_deg: 0.75
      # Uncalibrated model-error floor (px), added in quadrature to the
      # reported covariance diagonal: reported_cov = CRLB-form (+)
      # model_error_floor_px**2.  Captures the SPICE pointing residual
      # and body-shape error that the pattern-match residual scatter
      # does not.  Default 0.0 is a no-op pending an integration-library
      # calibration sweep.
      model_error_floor_px: 0.0
      # PSF-fit refinement of matched inliers.  The brightness-weighted
      # moment centroid that pins each detection is unbiased but only
      # noise-limited; for faint stars its scatter dominates the field
      # offset.  After the matcher fixes the correspondences, each inlier
      # detection is re-centroided by a true PSF fit
      # (``obs.star_psf().find_position``) against the instrument's
      # modeled point-spread function, which is the minimum-variance
      # estimator and roughly halves-to-quarters the per-star error in
      # the photon-noise-limited regime.  An undersampled PSF fit carries
      # a small sub-pixel-phase bias floor (~0.08 px) that only matters
      # once a star is bright enough for the moment's noise to fall below
      # it, so the refinement is applied per star only below an
      # integrated-SNR ceiling; brighter detections keep the moment.
      # 1 enables the refinement; 0 keeps the moment centroid everywhere.
      psf_refine_enabled: 1
      # Square box side (px, odd) for the PSF fit and the integrated-SNR
      # estimate around each inlier.
      psf_refine_box_px: 11
      # Maximum search distance (px) from the moment centroid for the
      # PSF fit; the moment is already within a pixel of truth.
      psf_refine_search_limit_px: 2.0
      # Integrated-SNR ceiling: a detection whose box SNR
      # (total net signal / sqrt(signal + n_pix * noise_sigma**2))
      # exceeds this keeps its moment centroid, because above the
      # moment/PSF crossover the moment's noise is already below the PSF
      # bias floor.  Calibrated to the field-level crossover on the sim
      # star fields (~30 for a nominal background; the optimum drifts to
      # ~16-21 under elevated read noise or a stray-light gradient, so
      # this is set for the nominal case -- see the star-field
      # centroiding section of the simulator performance report).
      psf_refine_snr_max: 30.0

  RingAnnulusNav:
    # Sim campaign (seed 20260718, ring-vocabulary family): n=489
    # usable, base rate 0.92, AUC 0.93 (the previous fit already ranked
    # these rows well), Brier 0.062.  Inclined projections and planted
    # orbit errors trimmed the base rate from the face-on-only family's
    # 0.94; the refit redistributes weight toward the multi-annulus
    # term without changing any transform.
    alpha0: 0.647
    terms:
      # PSR-style quality measure of the chosen NCC peak.  Campaign raw
      # p5/p50/p95 = 10/27/42.
      - feature: ncc_peak
        alpha: 1.168
        offset: 6.0
        divisor: 45.0
        cap_at: 1.0
      - feature: peak_to_runner_up_ratio
        alpha: 1.059
        divisor: 2.0
        cap_at: 1.0
      # Reward additional ring systems in the composite.  The current
      # spacecraft fleet has at most a handful of multi-planet ring
      # scenes, so the saturation cap is at 2 (vs body_count's 3).
      - feature: annulus_count
        alpha: 0.593
        divisor: 2.0
        cap_at: 1.0
    hard_zero_if:
      at_edge: true
      spurious: true
    tuning:
      # Covariance model-error terms.  The peak-curvature covariance
      # measures statistical precision at the winning NCC peak only.
      #  - localization_uncertainty_scale multiplies the inter-pyramid-level
      #    peak migration (consistency, px), the dominant per-scene
      #    localization-uncertainty signal.
      #  - model_error_size_frac (off by default) would scale the annulus
      #    radial span; the ring-annulus bulk error does not track span,
      #    so it stays 0.0 and the floor carries the template model error.
      #  - model_error_floor_px is the size-independent floor.
      localization_uncertainty_scale: 1.0
      model_error_size_frac: 0.0
      model_error_floor_px: 0.13

  TitanHazeNav:
    # Sim-anchored fit over the 413 committed rows of the planted-truth
    # campaign (util/titan_truth, 700 randomized scenes, campaign seed
    # 20260725), rounded to the nearest 0.05.  Produced and verified by
    # util/titan_truth/fit_confidence.py: --propose prints the fit, and a
    # plain run reads these values back and scores them against the
    # separation checks below.  The generic fitter (util/calibration/fit.py)
    # is enrolled for this technique and was run, but its label -- recovered
    # within 1 px -- has a base rate of 0.975 on the Titan calibration
    # family, so every usable row falls in one class and the coefficients it
    # returns discriminate nothing; the anchors have to separate the few
    # rows wrong by more than twice a stated per-axis bound, so the fit
    # behind these values up-weights exactly those rows.
    #
    # What the coefficients encode: the apparent envelope diameter is
    # the dominant term because the campaign's failure mode is entirely
    # a small-disc one -- every row wrong by more than twice its axis
    # bound has an envelope under 140 px, where the sunward arc has its
    # least support.  Real Cassini Titan frames run 200-1075 px, so on
    # them that term sits at its cap and the quality terms carry the
    # discrimination; the negative residual alpha is BOUNDED at -2.5 in
    # the fit's own configuration rather than left at the -15.12 the
    # unconstrained solve returns, because a rendered haze limb is
    # exactly the circle the method assumes while a real one is not, and
    # a residual coefficient tuned on the simulator would price real
    # frames out of confidence altogether.  Measured: 0 of 7
    # confident-wrong rows remain, and every real cohort frame keeps
    # confidence in 0.53-0.88.  Provisional under the program-wide
    # confidence_provisional marker; real-evidence re-anchoring is
    # tracked separately.
    alpha0: -9.30
    terms:
      # Mirror-correlation Pearson score at the winning cross-track
      # shift.  Already in [0, 1] so it needs no scaling.
      - feature: symmetry_peak_score
        alpha: 2.75
        divisor: 1.0
        cap_at: 1.0
      # Fraction of annulus mirror pairs that were usable; contaminant
      # masking and frame edges are what reduce it.
      - feature: symmetry_valid_fraction
        alpha: 1.75
        divisor: 1.0
        cap_at: 1.0
      # Fraction of surviving limb rays the robust circle fit kept.
      - feature: arc_inlier_fraction
        alpha: 1.50
        divisor: 1.0
        cap_at: 1.0
      # Apparent haze-envelope diameter, capped at 160 px: a
      # well-resolved Titan saturates the term and a disc near the 40 px
      # emission floor contributes almost nothing.
      - feature: envelope_diameter_px
        alpha: 5.55
        divisor: 160.0
        cap_at: 1.0
      # NEGATIVE alpha: a large inlier residual RMS means the sunward
      # limb is not the circle the method assumes.  The 3.0 px divisor
      # puts the saturation just past the 2.0 px arc_residual gate.
      - feature: arc_residual_rms_px
        alpha: -2.50
        divisor: 3.0
        cap_at: 1.0
    hard_zero_if:
      # A fit whose assembled offset reaches the search window may be
      # reporting the window bound rather than the body: the true
      # displacement can lie outside, and a sunward limb pushed past the
      # ray window returns rays pinned at their own search bound whose
      # mutual agreement then wins the robust fit.  That is the
      # confident-wrong failure mode, so an at-edge haze fit contributes
      # no confidence at all -- matching every other technique's gate.
      at_edge: true
    tuning:
      # Covariance model-error floor.  The symmetry-peak curvature and
      # the circle fit's Gauss-Newton covariance both measure
      # statistical precision only; the haze envelope's departure from
      # a circle and the wavelength-dependent haze top are model error
      # neither can see.
      #
      # util/calibration/fit_floors.py solves this to 0.000 px on the
      # Titan calibration family (353 usable rows, 2-sigma coverage
      # 0.997 against the 0.865 Gaussian target), because a rendered
      # haze IS the circle the fit assumes and the per-axis sigma
      # floors already over-cover there.  The value is kept above that
      # solve on purpose: on real frames the same coverage is carried
      # by model error the simulator cannot express, and cutting the
      # floor to zero would narrow the reported uncertainty on exactly
      # the population the fitter has no rows for.
      model_error_floor_px: 0.2


# Feature-emission tunables that decide which technique a given
# scene's features feed.  Per-planet overrides because Saturn's ring
# system spans tens of thousands of km radially while the Jupiter /
# Uranus / Neptune systems are an order of magnitude narrower; the
# "individual edges can't be separated" criterion lives at very
# different image-scale thresholds.
feature_emission:
  ring_annulus:
    # Default applies to any planet that does not have an explicit
    # entry below.  Both Saturn and the giant-planet fleet have entries
    # so this default is mostly defensive against typos / new planets.
    default:
      # Maximum per-edge polyline radial extent (px) below which the
      # rings model emits a RING_ANNULUS template instead of per-edge
      # polylines.  Per-polyline gate; fires when a single ring edge
      # has compressed below this width.
      max_radial_px: 5.0
      # Ring-radial km/px threshold above which the ENTIRE ring system
      # is annulus-class regardless of any per-polyline metric.  At
      # this resolution even a "well-traceable" per-edge polyline only
      # spans a handful of pixels along the radial direction; the
      # right technique is the multi-ring composite NCC, not the
      # per-edge DT fit.
      kmpp_threshold: 1000.0
    planets:
      SATURN:
        # At or above 25 km/px radial resolution the whole Saturn
        # system routes to the RING_ANNULUS composite (the rendered-brightness
        # NCC fit); the per-edge DT fit receives only sub-25 km/px
        # scenes.  Measured, not geometric: a 131-frame clean-truth
        # head-to-head (operator-audited, bundle defect lists applied)
        # put the per-edge fit's wrong-when-accepted rate at 5% / 13% /
        # 56% / 100% in the 300-1000 / 100-300 / 25-100 / 0-25 km/px
        # bands, while the annulus fit was wrong on zero accepted
        # answers at every band -- so the annulus route covers the
        # regimes that comparison validates, everything at or above
        # 25 km/px.  The per-edge
        # fit degrades toward FINE resolution: as resolution improves,
        # the ring alias lattice resolves -- many similar concentric
        # ringlet edges separate into distinct image edges -- and the
        # shape-only DT fit locks onto the wrong one, which the
        # rendered-brightness template disambiguates because relative
        # ring brightness is part of the match.  Below 25 km/px the
        # trustworthy evidence is three frames on which NEITHER
        # technique is validated (the edge path re-locks
        # catastrophically on all three; the annulus near-misses twice
        # and fails once), so the threshold stops where the evidence
        # stops, not where the edge fit is known good; the sub-25
        # confident-wrong exposure remains open (#346, #476).  This
        # threshold is Saturn-measured only; the default and other
        # planets' entries keep their geometric values because no
        # equivalent measurement exists for them.
        max_radial_px: 5.0
        kmpp_threshold: 25.0
      JUPITER:
        # Jupiter's main ring spans ~122500-129000 km (~6500 km wide,
        # ~10x narrower than Saturn).  Lower kmpp threshold so
        # annulus fires before the ring becomes a single bright pixel.
        max_radial_px: 5.0
        kmpp_threshold: 200.0
      URANUS:
        # Uranus's main rings span ~41800-51200 km (~9400 km wide).
        max_radial_px: 5.0
        kmpp_threshold: 300.0
      NEPTUNE:
        # Neptune's main rings span ~41900-62900 km (~21000 km wide).
        max_radial_px: 5.0
        kmpp_threshold: 500.0
