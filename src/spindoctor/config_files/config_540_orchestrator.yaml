# Orchestrator-level acceptance parameters: the ensemble combine and the
# per-feature-type reliability gate.
#
# Every value here mirrors the code default (DEFAULT_* constants in
# spindoctor.nav_orchestrator.ensemble and
# spindoctor.feature.reliability); the section exists so calibration
# sweeps and user config files can override them without code changes.
#
# The tier min_confidence boundaries are SIM-ANCHORED (calibrated
# against simulated planted-truth recovery only, on the same campaign
# basis as the technique alphas: empirical instrument chain off,
# coiss_nac-only cohort -- see the provenance note in
# config_510_techniques.yaml): derived 2026-07-18 from the
# recalibrated campaign's fused results (util/calibration, campaign
# seed 20260718 on the staged forward-model renderer with the full
# surface / photometric truth axes and the ring truth vocabulary;
# 3392 fused offsets, all #210 covariance floors live) as the
# smallest confidence at which the tier's sigma-gated subset achieves
# a 0.9 success rate against the tier's own error budget.
# max_sigma_px values are the tier definitions, not fitted.
# - high: 0.85 (success 0.932 at sigma <= 0.5 px, err <= 0.5 px; the
#   0.55-0.80 bands measure 0.874-0.8999, under target -- the ring
#   family's planted orbit errors put tight-sigma confidently-wrong
#   locks in the mid-confidence band, failure mass no ring diagnostic
#   can see, so the boundary sits where the measured curve actually
#   clears 0.9).
# - medium: the sigma <= 2.0 px gate carries the discrimination by
#   itself (success 0.92+ at every measured confidence band), so the
#   boundary rests at the same floor as the low tier and the final
#   gate; the tiers are sigma-differentiated, which is what
#   max_sigma_px is for.
# min_confidence 0.35: the fused fit rate (err <= 3 px) measures
# 0.35-0.40 in the 0.10-0.15 bands and 0.89 at 0.35, with almost no
# probability mass in between (n < 15 per 0.05 band in 0.20-0.30) --
# the crossing is bounded inside (0.15, 0.35] and the gate takes the
# measured upper edge.  Everything else remains subject to empirical
# calibration.
# The three floors solved on their own campaign rows (BodyLimbNav
# 2.61 px, BodyTerminatorNav 4.32 px, StarRefineNav 0.27 px) hold
# 2-sigma coverage at 0.86-0.87 against the 0.865 reference
# (util/calibration/fit_floors verification).  The NCC techniques
# (disc / blob / annulus) carry floors from the campaign that first
# solved them; the additive solver re-solves +0.000 px on the current
# rows -- a conservative-direction check only -- and their size-scaled
# covariance terms over-cover at 0.93-0.94.  StarUniqueMatchNav's
# CRLB-only sigma measures 0.85.
orchestrator:
  ensemble:
    # Mahalanobis-distance threshold for grouping per-technique results.
    agreement_sigma: 2.0
    # Euclidean translation-distance fallback grouping threshold (px).
    agreement_pixel_floor: 5.0
    # Minimum summed-confidence gap between best and runner-up groups
    # before declaring a conflict.  Absolute when the runner-up has a
    # quorum (two or more members); in a lone-vs-lone standoff the gap
    # is measured relative to the winner (conflict only when
    # best - runner_up < agreement_gap * best), so an excluded
    # low-confidence dissenter cannot veto a clearly stronger singleton.
    agreement_gap: 0.5  # (dimensionless fraction)
    # Multiplier on combined confidence when more than one group existed.
    disagreement_penalty: 0.7
    # Additional multiplier when the conflicted branch fires.
    conflicted_confidence_multiplier: 0.3
    # Final-result threshold below which the ensemble returns failed.
    min_confidence: 0.35
    # Euclidean translation distance (px) within which a BodyBlobNav
    # brightness centroid is treated as agreeing with a corroborated
    # (non-single-star) star fix.  When such a fix is present and the blob
    # agrees with none within this floor, the blob is dropped from the
    # ensemble math as a contradicted outlier: a multi-star fix outranks a
    # lone brightness centroid as a position witness, so the centroid must
    # not force a conflict against the star solution.  Matches
    # agreement_pixel_floor (a blob outside the grouping tolerance of every
    # trusted star fix is not corroborating it).  0.0 disables the drop.
    blob_star_disagreement_floor_px: 5.0
    # rcond for scipy.linalg.pinvh.
    pinvh_rcond: 1.0e-9
    # Maximum |rotation| (deg) a 3-DoF result may take before rejection.
    max_allowed_rotation_deg: 5.0
    # Body-witness veto: cross-technique guards on confident-wrong body
    # locks the per-technique diagnostics cannot see (a disc / limb
    # consensus that agreed at a shape-mismatched offset the pose-free
    # blob contradicts, or a lone blob carrying the answer while the
    # geometric technique on the same body self-flagged spurious).  The
    # blob centroid's lit-hemisphere bias grows toward half phase and is
    # re-modeled only once the coarse acquisition switches to the crescent
    # template past it, so the two checks bracket its reliable-witness
    # regime: the shape-lock check trusts the blob only below the low
    # phase ceiling, the collapsed-regime check treats it as the haze-bias
    # suspect only above the high phase floor.  The disagreement tolerance
    # is the larger of the floor and a fraction of the body diameter;
    # well-navigated frames hold the blob within ~1.5 px of the fused
    # offset, while a shape lock or haze drag disagrees by 5 px and up.
    body_witness_shape_lock_max_phase_deg: 60.0
    body_witness_collapse_min_phase_deg: 90.0
    body_witness_disagreement_floor_px: 4.0
    body_witness_disagreement_frac: 0.03
    # Mahalanobis-distance threshold the blob-vs-consensus disagreement must
    # exceed under the combined covariance before the veto fires: the pixel
    # floor above is a lower bound, this is the statistical gate so a low-SNR
    # or small-body centroid whose large sigma makes the separation consistent
    # with agreement is not vetoed on scatter alone.
    body_witness_agreement_sigma: 2.0
    # Background-gradient score at or above which a frame is treated as
    # scattered-light, so the disc and limb techniques on one body are fused
    # as a single correlated witness rather than two independent ones.
    # Matches the cohort-curation scattered-light prescan threshold.
    scattered_light_gradient_score: 5.0
    # Confidence/sigma requirements per confidence tier; max_sigma_px
    # null means no sigma requirement for that tier.
    tier_thresholds:
      high: {min_confidence: 0.85, max_sigma_px: 0.5}
      medium: {min_confidence: 0.35, max_sigma_px: 2.0}
      low: {min_confidence: 0.35, max_sigma_px: null}
  # Minimum reliability per feature type; features below their type's
  # threshold are gated out before any technique runs.  Feature types
  # not listed fall through with a 0.0 threshold (no gate).
  reliability_gate:
    STAR: 0.20
    LIMB_ARC: 0.30
    TERMINATOR_ARC: 0.30
    BODY_DISC: 0.30
    BODY_BLOB: 0.20
    RING_EDGE: 0.30
    RING_ANNULUS: 0.30
    CARTOGRAPHIC_MODEL: 0.30
    TITAN_LIMB: 0.30
