# Galileo SSI per-camera configuration. Single 8-bit camera; the noise
# and image-quality threshold values are starting points carrying
# `# PLACEHOLDER` markers until phase-10 calibration finalizes them.
galileo_ssi:
  data_units: raw_dn
  extfov_margin_vu: [350, 350]
  # The simulator's copy of the star width: the navigator reads its own from
  # galileo_ssi_star_photometry below, and this value matches it, so a simulated
  # frame's stars have the width the navigator expects.
  star_psf_sigma: 0.65
  # Fraction of the offset window, per axis, inside which
  # StarUniqueMatchNav believes a lone star, in (0, 1].  Not measured on
  # this camera: 0.6 is the Cassini NAC's value.  On the black-sky library
  # frame C0164392700R a lone artifact lies 40 px from the one predicted
  # star, inside the 210 px ellipse of the 350 px window.
  one_star_ellipse_fraction: 0.6
  star_psf_sizes:
    100: [7, 7]
  # Galileo SSI carries non-negligible attitude rotation residuals, and they
  # are deliberately left unfitted.  Nothing can currently use a fitted
  # rotation: each technique measures it about its own center, so the
  # translations that come back with it are not in one convention, and a
  # rotation without a recorded center cannot be carried into an attitude at
  # all -- which suppresses the corrected C-matrix and omits the frame from
  # the corrected kernels.  With fitting off the twist is absorbed into the
  # reported translation.  Issue #434 is the standing account and proposes
  # fitting about the FOV center, which would make it usable.
  fit_camera_rotation: false
  max_rotation_deg: 5.0
  noise:
    saturation_dn: 255             # 8-bit ADC
    marker_value: 0
    read_noise_dn: 1.0             # PLACEHOLDER — calibrate in Phase 10
    # interim: photometric zero point (DN a vmag-0 star deposits per second),
    # the electron zero point over the standard gain state.
    star_flux_dn_per_s_vmag0: 2.14e4
    # The summed readout mode, keyed by the binning factor: the read noise of one
    # summed pixel in DN and the zero point in DN/s.  A mode this table leaves out
    # reads with the values above.  The published sources (Belton et al. 1992 and
    # Klaasen 1993) give the 2x2 summation mode a read noise of 44 e- and no gain
    # of its own, so at the 187 e-/DN of gain state 2 it reads 44 / 187 = 0.235 DN
    # (read_noise_dn above is a placeholder).  Summing on the chip keeps a star's
    # charge, so the zero point stays 2.14e4 DN/s.  0.235 DN is below the star
    # limit's 1 DN noise floor, so the limit reads 1 DN in this mode, as it does
    # unbinned.
    by_binning:
      2: {read_noise_dn: 0.235, star_flux_dn_per_s_vmag0: 2.14e4}
  image_quality_thresholds:
    blank_max_dn: 5.0              # PLACEHOLDER — calibrate in Phase 10
    saturation_threshold_dn: 255   # 8-bit ADC
    noisy_threshold_dn: 10.0       # PLACEHOLDER — calibrate in Phase 10
    max_missing_frac_clean: 0.30
    max_overexposed_frac_clean: 0.80
  source_image_filter:
    kind: BANDPASS_DOG
    lo_sigma_px: 5.0
    hi_sigma_px: 0.7
    enabled: false
  mag_offset:
    fallback_combo: 'CL'
    mag_offset_table:
      'CL': {default: 0.0}         # PLACEHOLDER — calibrate in Phase 10

# Star photometry of the Galileo SSI camera, read by ObsGalileoSSI for its star limit
# and star width.  A star of V magnitude m and the default spectral class deposits
#     flux_electrons_per_s_vmag0 * 10**(-0.4 * (m + filter_mag_offset[FILTER_NAME]))
#         * texp / electrons_per_dn[gain state]
# DN.  The dimmest visible star deposits min_detectable_dn, and the catalog search reaches
# search_depth_mag past it.  The gain state is the label's GAIN item (1 = 400K, 2 = 100K,
# 3 = 40K, 4 = 10K).  A summation-mode frame reads the same values: summing on the chip
# keeps a star's charge, and no star field was measured in that mode.
#
# Measured on star fields of the 1990 and 1992 cruise (#130): 101 frames with an
# independent pointing fix from three or more agreeing stars, one frame in three held
# out; util/star_photometry and its fit commands give the method.
galileo_ssi_star_photometry:
  ssi:
    # Fit: 6.05e6 DN/s for V = 0 through CLEAR at 10K (+-0.11 mag, 64 stars), times the
    # 38.7 e-/DN of 10K.  Klaasen et al. 1999's absolute response (Table 2) gives
    # 5.9e6 DN/s.  The scale is the 1992 frames': the 1990 frames read 0.4-1.7 mag
    # fainter at the same settings, unexplained (#1211).
    flux_electrons_per_s_vmag0: 2.34e+08
    # Klaasen 1993 (JPL D-5880, Tables 3-1 and 3-2): 38.7 e-/DN at 10K and the published
    # ratios 4.824, 9.771 and 47.135 of the other states.  The stars measure 100K/10K at
    # 0.070 (+-0.27 mag, 7 stars) against 0.102 published; the others are unmeasured.
    electrons_per_dn:
      '10K': 38.7
      '40K': 186.7
      '100K': 378.1
      '400K': 1824.1
    # Fit: 142 +- 63 DN, the DN at 80% of the way from the detection floor to the
    # plateau of a detection-probability curve fitted to every clean star.
    min_detectable_dn: 140.0
    # As in the earlier navigation software, which searched 1 mag past the dimmest
    # visible star.
    search_depth_mag: 1.0
    # Klaasen et al. 1999 (Table 3): 2.5 log10 of each filter's solar filter factor.  The
    # stars measured are few and mostly hot Pleiades members, far bluer than the Sun,
    # so the measured values (beside each) are not used.
    filter_mag_offset:
      CLEAR: 0.0
      VIOLET: 3.84    # measured 2.64 +- 0.65 (1 star)
      GREEN: 2.10     # not measured
      RED: 2.01       # measured 3.52 +- 0.53 (2 stars)
      IR-7270: 4.69   # measured 5.42 +- 0.39 (3 stars)
      IR-7560: 3.99   # not measured
      IR-8890: 5.68   # not measured
      IR-9680: 5.77   # measured 7.69 +- 0.33 (5 stars)
    # Gaussian sigma (px) of a star: the median of 517 unsaturated stars on 75 full
    # frames (p16-p84 0.41-1.10).  The core is about 0.4 px across and 1.0 px along the
    # direction of smear; Klaasen et al. 1999's line-spread FWHM of 1.39 px is sigma
    # 0.59.
    star_psf_sigma: 0.65
