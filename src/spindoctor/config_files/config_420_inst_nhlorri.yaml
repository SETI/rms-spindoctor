# New Horizons LORRI per-camera configuration. Single 12-bit camera;
# noise and image-quality threshold values carry `# PLACEHOLDER`
# markers until phase-10 calibration finalizes them.
newhorizons_lorri:
  data_units: raw_dn
  extfov_margin_vu:
    256: [15, 15]
    512: [30, 30]
    1024: [60, 60]
  # The simulator's copy of the star width, in the pixels of an unbinned frame: the
  # navigator reads its own from star_photometry.psf_sigma below, per binning mode, and
  # this value matches its unbinned one.  On a simulated 4X4 frame the
  # simulator takes a quarter of this width, 0.225 px, while the navigator uses 0.45 px
  # on a real 4X4 frame, so the two match only at full resolution.
  star_psf_sigma: 0.9
  # Fraction of the offset window, per axis, inside which
  # StarUniqueMatchNav believes a lone star, in (0, 1].  Not measured on
  # this camera: 0.6 is the Cassini NAC's value.
  one_star_ellipse_fraction: 0.6
  star_psf_sizes:
    100: [7, 7]
  fit_camera_rotation: false
  max_rotation_deg: 5.0
  noise:
    saturation_dn: 4095            # 12-bit ADC
    marker_value: 0
    read_noise_dn: 4.0             # PLACEHOLDER — calibrate in Phase 10
    # interim: photometric zero point (DN a vmag-0 star deposits per second),
    # the electron zero point over the single gain state.
    star_flux_dn_per_s_vmag0: 3.33e7
    # The binned readout mode, keyed by the binning factor: the read noise of one
    # binned pixel in DN and the zero point in DN/s.  A mode this table leaves out
    # reads with the values above.  The 4x4 mode's published gain is 19.4 e-/DN,
    # against 21 e-/DN at 1x1 (see _sources below), so the published 23 e- read
    # noise is 23 / 19.4 = 1.19 DN.  Binning on the chip keeps a star's charge, so
    # the electron zero point the value above is sized from, 7.0e8 e-/s, reads
    # 7.0e8 / 19.4 = 3.61e7 DN/s.  read_noise_dn above is a placeholder above the
    # published 23 / 21 = 1.10 DN, so part of the step from the unbinned star limit
    # to the binned one comes from the placeholder.
    by_binning:
      4: {read_noise_dn: 1.19, star_flux_dn_per_s_vmag0: 3.61e7}
  image_quality_thresholds:
    blank_max_dn: 5.0              # PLACEHOLDER — calibrate in Phase 10
    saturation_threshold_dn: 4095  # 12-bit ADC
    noisy_threshold_dn: 10.0       # PLACEHOLDER — calibrate in Phase 10
    max_missing_frac_clean: 0.30
    max_overexposed_frac_clean: 0.80
    partial_dropout_min_frac: 0.05
  source_image_filter:
    kind: BANDPASS_DOG
    lo_sigma_px: 5.0
    hi_sigma_px: 0.7
    enabled: false
  mag_offset:
    fallback_combo: '1'
    mag_offset_table:
      '1': {default: 0.0}          # PLACEHOLDER — calibrate in Phase 10
  # Star photometry of the camera, read by ObsNewHorizonsLORRI for its star limit and star
  # width.  A star of V magnitude m and the default spectral class deposits
  #     flux_per_s_vmag0 * 10**(-0.4 * m) * texp / gain[binning]
  # DN, the rate counting electrons and gain giving electrons per DN.  The dimmest visible
  # star deposits min_detectable_dn[binning], and the catalog search reaches
  # search_depth_mag past it.  LORRI has no filter, so the block has no filter_mag_offset,
  # and one gain state, so gain is keyed by the binning mode.  The
  # binning mode follows from the row count, as the image host reads it: 1024 rows is 1X1
  # and 256 rows is 4X4.  Binning changes the electrons per DN, the noise of a pixel, and
  # the width of a star in pixels, so each of those is given per mode.
  #
  # Measured on star fields of the cruise and the Pluto approach (#130): 341 frames with an
  # independent pointing fix from three or more agreeing stars, one frame in three held
  # out.  Frames shorter than 50 ms are left out of the fit: LORRI has no shutter, so the
  # frame transfer adds light to a short exposure.  util/star_photometry and its fit
  # commands give the method.
  star_photometry:
    # Fit: 3.605e7 DN/s for V = 0 at 1X1 (+-0.01 mag, 4310 stars), times 21.0 e-/DN.
    # Weaver et al. 2020's zero point (18.78 at 1X1) gives 3.2e7 DN/s.
    flux_unit: electrons
    flux_per_s_vmag0: 7.57e+08
    # Weaver et al. 2020.  The stars measure the 4X4/1X1 DN ratio at 1.054 (+-0.01 mag)
    # against the 1.082 these values give.
    gain:
      1X1: 21.0
      4X4: 19.4
    # Fit: 110 +- 7 DN at 1X1 and 60 +- 4 DN at 4X4, each the DN at 80% of the way from
    # the detection floor to the plateau of a detection-probability curve fitted to every
    # clean star of that mode.
    min_detectable_dn:
      1X1: 110.0
      4X4: 60.0
    # As in the earlier navigation software, which searched 1 mag past the dimmest
    # visible star.
    search_depth_mag: 1.0
    # Gaussian sigma of a star, in the frame's own pixels.  1X1: the median of 311 stars
    # on 45 frames (p16-p84 0.82-0.97); Weaver et al. 2020's FWHMs of 2.04 x 2.70 px are
    # sigma 0.87 x 1.15.  4X4: the 5-10 s navigation frames give 0.45-0.54, and the
    # sub-second star calibrations 0.28 (pointing jitter widens a long exposure).
    psf_sigma:
      1X1: 0.9
      4X4: 0.45
  # ``_sources`` is documentation-only.  The configuration loader drops
  # every key starting with ``_`` at load time, so this block does not
  # affect runtime behavior; it exists so reviewers can trace each
  # value's provenance and so the Phase 10 calibration step has a
  # checklist of references to verify.
  _sources:
    noise:
      saturation_dn: 'New Horizons LORRI Instrument Calibration Report (PDS NHxxLO_xxxx). 12-bit ADC; 4095 DN is the hard-fact ADC ceiling.'
      marker_value: 'NHLORRI raw missing-pixel sentinel; 0 per the LORRI EDR pipeline.'
      read_noise_dn: 'PLACEHOLDER — calibrate in Phase 10 (LORRI 1x1 read-noise expected ~ 1 e-, but tuned to per-image MAD floor in Phase 10).'
      by_binning: 'Published 4x4 gain (19.4 e-/DN) and read noise (23 e-): Cheng et al. 2008 (Space Science Reviews 140, 189-215), Weaver et al. 2020 (PASP 132, 035003), and the New Horizons SOC-to-Instrument Pipeline ICD, the sources the simulator''s LORRI entry cites.'
    image_quality_thresholds:
      blank_max_dn: 'PLACEHOLDER — calibrate in Phase 10; bias-subtracted dark frames typically peak below 5 DN.'
      saturation_threshold_dn: 'Mirrors noise.saturation_dn (12-bit ADC).'
      noisy_threshold_dn: 'PLACEHOLDER — calibrate in Phase 10 against the per-image MAD distribution from clean LORRI exposures.'
      max_missing_frac_clean: 'Project-wide default; revisit in Phase 10 once the LORRI sensor-mask population is measured.'
      max_overexposed_frac_clean: 'Project-wide default.'
      partial_dropout_min_frac: 'Project-wide default.'
    mag_offset:
      fallback_combo: 'NHLORRI uses a single panchromatic filter slot, encoded as ``1``.'
      mag_offset_table: 'PLACEHOLDER — calibrate in Phase 10 against catalog-vs-instrument SNR on the planted-offset library.'
