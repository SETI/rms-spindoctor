name: Run Tests
run-name: Run Tests triggered by ${{ github.ref_type }} ${{ github.ref_name }} or ${{ github.triggering_actor }}

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "21 11 * * 0"

jobs:
  lint:
    name: Lint rms-spindoctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: |
          ruff check src tests

      - name: Ruff (format)
        run: |
          ruff format --check src tests

      - name: Mypy
        run: |
          mypy src tests

      - name: Sphinx
        run: |
          sphinx-build -W -b html docs docs/_build

      - name: PyMarkdown
        run: |
          pymarkdown scan docs/ .cursor/ README.md CONTRIBUTING.md

      - name: Codespell
        run: |
          codespell src tests docs util experiments scripts README.md CONTRIBUTING.md .cursor

  test:
    name: Test rms-spindoctor
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt6 loads EGL at import time; ubuntu-latest images omit it by default.
      - name: Install EGL for PyQt6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Test with coverage
        run: |
          export PDS3_HOLDINGS_DIR=https://pds-rings.seti.org/holdings
          export PDS4_HOLDINGS_DIR=https://pds-rings.seti.org/pds4
          # OOPS_RESOURCES / UCAC4_PATH / YBSC_PATH are deliberately NOT set:
          # the SPICE and star-catalog trees live in cloud buckets whose bulk
          # egress is prohibitively expensive, so public access is off and
          # automated runs must not download them. Tests marked
          # REQUIRES_EXTERNAL_DATA (tests/config.py) skip without
          # OOPS_RESOURCES; run them locally against a local copy of the
          # oops resources directory.
          # loadfile keeps each test file on one xdist worker; PyQt6 + default load
          # scheduling has caused worker crashes when tests from the same file ran
          # in different processes.
          # The marker expression restates the default from addopts, because a
          # -m flag replaces addopts' own rather than adding to it.  It skips
          # two tiers.  The integration tier reaches real archive holdings; the
          # operator-curated image-library regression tests are one part of it,
          # and it needs a populated $PDS3_HOLDINGS_DIR, the oops resources and
          # SPICE kernels under $OOPS_RESOURCES, and the $UCAC4_PATH / $YBSC_PATH
          # star catalogs -- slow, and unavailable to this job, whose buckets are
          # closed for egress cost.  The postgres tier needs a PostgreSQL server
          # named by SPINDOCTOR_TEST_POSTGRES_URL, and CI runs no service
          # container for one.  Run both locally before merging: the integration
          # tier against that environment, the postgres tier against a local
          # server.
          python -m pytest --cov --cov-report=xml -n auto --dist=loadfile \
            -m "not integration and not postgres"

      - name: Print coverage report
        run: |
          coverage report -m

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' &&!github.event.pull_request.head.repo.fork
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
